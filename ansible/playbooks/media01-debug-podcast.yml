---
- name: Locate Raven media assets on media-01
  hosts: media-01
  gather_facts: false
  tasks:
    - name: Inspect service-area media and worker state
      ansible.builtin.shell: |
        set -uo pipefail
        echo '=== ID ==='; id
        echo '=== SRV TOP ==='; find /srv -maxdepth 3 -mindepth 1 -printf '%M %u:%g %s %p\n' 2>/dev/null | sort | sed -n '1,420p'
        echo '=== RAVEN / BESQUARE CANDIDATES ==='
        find /srv /tmp /var/tmp -maxdepth 8 -type f \( -iname '*raven*' -o -iname '*besquare*' -o -iname '*caption*' -o -name 'master.mp4' -o -name 'render_captions.py' \) -printf '%s %p\n' 2>/dev/null | sort -nr | sed -n '1,500p'
        echo '=== MEDIA-PRODUCTION FILES ==='
        if [ -d /srv/media-production ]; then
          find /srv/media-production -maxdepth 6 -type f -printf '%s %p\n' 2>/dev/null | sort -nr | sed -n '1,500p'
        fi
        echo '=== WORKER STATUS ==='
        systemctl is-active media01-worker.service 2>/dev/null || true
        systemctl status media01-worker.service --no-pager -l 2>/dev/null | sed -n '1,100p' || true
        echo '=== PROCESS LIST ==='
        ps -eo user,pid,etimes,%cpu,%mem,args --sort=-%cpu | grep -Ei 'media01|ffmpeg|python|openmontage|whisper' | grep -v grep | head -100 || true
      args: {executable: /bin/bash}
      register: out
      changed_when: false
    - name: Print inspection
      ansible.builtin.debug:
        msg: "{{ out.stdout }}"
