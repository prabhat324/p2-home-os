---
- name: Inspect prepared OpenMontage BeSquare experiment
  hosts: media-01
  gather_facts: false
  tasks:
    - name: Inspect isolated project and available tooling
      ansible.builtin.shell: |
        set -uo pipefail
        P=/srv/media-production/work/openmontage-besquare-demo-01
        echo '=== PROJECT TREE ==='
        find "$P" -maxdepth 5 -printf '%M %u:%g %s %p\n' 2>/dev/null | sort | sed -n '1,500p'
        echo '=== EXPERIMENT ==='
        cat "$P/experiment.json" 2>/dev/null || true
        echo '=== FFPROBE INPUT ==='
        ffprobe -v error -show_entries format=duration,size,bit_rate -show_entries stream=index,codec_name,codec_type,width,height,r_frame_rate,sample_rate,channels -of json "$P/input/master.mp4" 2>&1 || true
        echo '=== OPENMONTAGE LOCATIONS ==='
        find /home/p2ops /srv /opt /usr/local -maxdepth 7 \( -type d -o -type f \) -iname '*openmontage*' -printf '%M %u:%g %s %p\n' 2>/dev/null | sort | sed -n '1,500p'
        echo '=== REPO MARKERS ==='
        find /home/p2ops /srv /opt -maxdepth 8 -type f \( -name 'AGENT_GUIDE.md' -o -name 'PROJECT_CONTEXT.md' -o -name 'tool_registry.py' -o -name 'requirements.txt' \) -printf '%p\n' 2>/dev/null | grep -Ei 'openmontage|media01' | sed -n '1,300p'
        echo '=== CLIS/PYTHON/NODE ==='
        command -v python3 || true; python3 --version || true; command -v node || true; node --version 2>/dev/null || true; command -v npm || true; npm --version 2>/dev/null || true; command -v ffmpeg || true; ffmpeg -hide_banner -encoders 2>/dev/null | grep -E 'nvenc|libx264|libx265' | head -40 || true
        echo '=== CAPTION ASSET HEAD ==='
        sed -n '1,100p' /srv/media-production/review/besquare-demo-01/speaker-captions.ass 2>/dev/null || true
        echo '=== EXISTING OPENMONTAGE WORK ==='
        find /srv/media-production/work/openmontage-besquare-demo-01 -maxdepth 6 -type f -printf '%s %p\n' 2>/dev/null | sort -nr | sed -n '1,300p'
      args: {executable: /bin/bash}
      register: out
      changed_when: false
    - name: Print inspection
      ansible.builtin.debug:
        msg: "{{ out.stdout }}"
