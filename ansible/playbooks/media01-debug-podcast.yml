---
- name: Diagnose Raven full podcast audio channel separation
  hosts: media-01
  gather_facts: false
  vars:
    source: /srv/media-production/inbox/raven-podcast-01/master.mp4
  tasks:
    - name: Probe Raven master duration and audio layout
      ansible.builtin.shell: |
        set -euo pipefail
        echo '=== PROBE ==='
        ffprobe -v error -show_entries format=duration:stream=index,codec_type,codec_name,width,height,r_frame_rate,channels,channel_layout,sample_rate -of json "{{ source }}"
        echo '=== HOST KNOWN WINDOW 4-20s ==='
        ffmpeg -nostdin -hide_banner -ss 4 -t 16 -i "{{ source }}" -filter_complex "[0:a]channelsplit=channel_layout=stereo[L][R];[L]astats=metadata=1:reset=0[Ls];[R]astats=metadata=1:reset=0[Rs]" -map '[Ls]' -f null - -map '[Rs]' -f null - 2>&1 | grep -E 'Channel:|RMS level dB|Peak level dB' || true
        echo '=== RAVEN KNOWN WINDOW 32-52s ==='
        ffmpeg -nostdin -hide_banner -ss 32 -t 20 -i "{{ source }}" -filter_complex "[0:a]channelsplit=channel_layout=stereo[L][R];[L]astats=metadata=1:reset=0[Ls];[R]astats=metadata=1:reset=0[Rs]" -map '[Ls]' -f null - -map '[Rs]' -f null - 2>&1 | grep -E 'Channel:|RMS level dB|Peak level dB' || true
      args:
        executable: /bin/bash
      register: diag
      changed_when: false

    - name: Report Raven channel diagnostics
      ansible.builtin.debug:
        msg: "{{ diag.stdout }}"
