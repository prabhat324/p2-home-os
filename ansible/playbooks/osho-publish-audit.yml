---
- name: Audit Project Osho publishing evidence on compute-01
  hosts: compute-01
  gather_facts: false
  tasks:
    - name: Find first Growth Template V1 render or publish evidence
      ansible.builtin.shell: |
        set -euo pipefail
        python3 - <<'PY'
        import json
        from pathlib import Path
        from datetime import datetime

        roots = [
            Path('/srv/osho/renders'),
            Path('/srv/osho/work'),
            Path('/srv/osho/youtube/receipts'),
        ]
        marker = 'osho-growth-v1'
        matches = []

        def walk_values(obj):
            if isinstance(obj, dict):
                for k, v in obj.items():
                    yield str(k), v
                    yield from walk_values(v)
            elif isinstance(obj, list):
                for v in obj:
                    yield from walk_values(v)

        def marker_present(data):
            for k, v in walk_values(data):
                if k in ('growth_template', 'production_profile') and str(v) == marker:
                    return True
            return False

        def pick(data, *keys):
            if not isinstance(data, dict):
                return None
            for key in keys:
                if data.get(key) not in (None, ''):
                    return data.get(key)
            for v in data.values():
                if isinstance(v, dict):
                    got = pick(v, *keys)
                    if got not in (None, ''):
                        return got
            return None

        for root in roots:
            if not root.exists():
                continue
            for path in root.rglob('*.json'):
                try:
                    data = json.loads(path.read_text(encoding='utf-8'))
                except Exception:
                    continue
                if not marker_present(data):
                    continue
                stat = path.stat()
                matches.append({
                    'path': str(path),
                    'mtime': datetime.fromtimestamp(stat.st_mtime).astimezone().isoformat(),
                    'reel_id': pick(data, 'reel_id', 'job_id', 'render_id'),
                    'source_id': pick(data, 'source_id'),
                    'title': pick(data, 'title', 'youtube_title'),
                    'video_id': pick(data, 'video_id', 'youtube_video_id'),
                    'published_at': pick(data, 'published_at', 'uploaded_at', 'publish_time', 'created_at'),
                })

        matches.sort(key=lambda x: (x.get('published_at') or x['mtime'], x['path']))
        print('GROWTH_MATCH_COUNT=' + str(len(matches)))
        for i, row in enumerate(matches, 1):
            print('GROWTH_MATCH_' + str(i) + '=' + json.dumps(row, ensure_ascii=False, sort_keys=True))

        # Correlate any growth render with durable YouTube receipts by source/reel id.
        receipts = []
        receipt_root = Path('/srv/osho/youtube/receipts')
        if receipt_root.exists():
            for path in receipt_root.rglob('*.json'):
                try:
                    data = json.loads(path.read_text(encoding='utf-8'))
                except Exception:
                    continue
                if isinstance(data, dict):
                    receipts.append((path, data))

        first = matches[0] if matches else None
        if first:
            ids = {str(x) for x in (first.get('reel_id'), first.get('source_id')) if x not in (None, '')}
            correlated = []
            for path, data in receipts:
                candidates = {str(data.get(k)) for k in ('source_id','job_id','reel_id') if data.get(k) not in (None,'')}
                if ids & candidates:
                    correlated.append({
                        'path': str(path),
                        'source_id': data.get('source_id'),
                        'reel_id': data.get('reel_id') or data.get('job_id'),
                        'video_id': data.get('video_id'),
                        'title': data.get('title'),
                        'published_at': data.get('published_at') or data.get('uploaded_at') or data.get('created_at'),
                    })
            correlated.sort(key=lambda x: (x.get('published_at') or '', x['path']))
            print('FIRST_GROWTH=' + json.dumps(first, ensure_ascii=False, sort_keys=True))
            print('FIRST_GROWTH_RECEIPT_COUNT=' + str(len(correlated)))
            for row in correlated:
                print('FIRST_GROWTH_RECEIPT=' + json.dumps(row, ensure_ascii=False, sort_keys=True))
        PY
      args:
        executable: /bin/bash
      register: growth_audit
      changed_when: false

    - name: Show first Growth Template V1 evidence
      ansible.builtin.debug:
        msg: "{{ growth_audit.stdout_lines }}"
