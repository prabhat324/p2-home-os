---
- name: Audit Project Osho publishing evidence on compute-01
  hosts: compute-01
  gather_facts: false
  tasks:
    - name: Read authoritative autopilot status counts
      ansible.builtin.shell: |
        set -euo pipefail
        sqlite3 -header -column /srv/osho/library/catalog/catalog.sqlite \
          "SELECT lower(trim(status)) AS status, COUNT(*) AS count FROM osho_autopilot_state WHERE status IS NOT NULL AND trim(status) <> '' GROUP BY lower(trim(status)) ORDER BY status;"
      args:
        executable: /bin/bash
      register: status_counts
      changed_when: false

    - name: Show authoritative autopilot status counts
      ansible.builtin.debug:
        msg: "{{ status_counts.stdout_lines }}"

    - name: Read durable YouTube receipt identities
      ansible.builtin.shell: |
        set -euo pipefail
        python3 - <<'PY'
        import json
        from pathlib import Path

        root = Path('/srv/osho/youtube/receipts')
        rows = []
        if root.exists():
            for path in sorted(root.rglob('*.json')):
                try:
                    data = json.loads(path.read_text(encoding='utf-8'))
                except Exception as exc:
                    print(f'INVALID_RECEIPT file={path.name} error={type(exc).__name__}')
                    continue
                if not isinstance(data, dict):
                    print(f'INVALID_RECEIPT file={path.name} error=not-object')
                    continue
                rows.append((
                    path.name,
                    data.get('source_id'),
                    data.get('job_id'),
                    data.get('video_id'),
                    data.get('uploaded_at') or data.get('published_at') or data.get('created_at'),
                    data.get('title'),
                ))

        print(f'RECEIPT_FILES={len(rows)}')
        video_ids = {str(r[3]) for r in rows if r[3]}
        source_ids = {str(r[1]) for r in rows if r[1]}
        job_ids = {str(r[2]) for r in rows if r[2]}
        print(f'UNIQUE_VIDEO_IDS={len(video_ids)}')
        print(f'UNIQUE_SOURCE_IDS={len(source_ids)}')
        print(f'UNIQUE_JOB_IDS={len(job_ids)}')
        for row in rows:
            print('RECEIPT', *[f'{k}={v!r}' for k, v in zip(
                ('file','source_id','job_id','video_id','timestamp','title'), row
            )])
        PY
      args:
        executable: /bin/bash
      register: receipts
      changed_when: false

    - name: Show durable YouTube receipt identities
      ansible.builtin.debug:
        msg: "{{ receipts.stdout_lines }}"

    - name: Read current reconciled dashboard summary
      ansible.builtin.uri:
        url: http://192.168.0.88:8787/api/dashboard
        return_content: true
        timeout: 5
      register: dashboard
      changed_when: false

    - name: Show reconciled dashboard summary
      ansible.builtin.debug:
        msg:
          - "dashboard_version={{ dashboard.json.dashboard_version | default('unknown') }}"
          - "summary={{ dashboard.json.summary | default({}) }}"
          - "state_reconciliation={{ dashboard.json.state_reconciliation | default({}) }}"
          - "latest_upload={{ dashboard.json.latest_upload | default({}) }}"
