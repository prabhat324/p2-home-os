---
- name: Audit backup coverage and stateful workloads before relocation
  hosts: core-01:compute-01:compute-02
  gather_facts: false
  tasks:
    - name: Collect non-sensitive relocation backup evidence
      ansible.builtin.shell: |
        set -u
        echo "HOST=$(hostname -s)"
        echo "USER=$(id -un)"
        echo "GROUPS=$(id -Gn)"
        echo '=== STORAGE ==='
        findmnt -rn -o TARGET,SOURCE,FSTYPE,OPTIONS 2>/dev/null | grep -E '^/mnt|^/srv|nfs|cifs' | sed -n '1,80p' || true
        df -hT 2>/dev/null | grep -E 'Filesystem|/mnt|/srv|/$' | sed -n '1,80p' || true
        echo '=== EXPECTED BACKUP MOUNTS ==='
        for p in /mnt/photos-primary /mnt/backup /mnt/photos-backup /mnt/media /srv/backups /var/backups; do
          if findmnt -rn "$p" >/dev/null 2>&1; then
            echo "$p=MOUNTED"
          elif [ -e "$p" ]; then
            echo "$p=EXISTS_NOT_MOUNT"
          else
            echo "$p=ABSENT"
          fi
        done
        echo '=== BACKUP TIMERS/SERVICES ==='
        systemctl list-timers --all --no-pager 2>/dev/null | grep -Ei 'backup|rsync|restic|borg|snapshot' | sed -n '1,80p' || true
        systemctl list-unit-files --no-pager 2>/dev/null | grep -Ei 'backup|rsync|restic|borg|snapshot' | sed -n '1,80p' || true
        echo '=== RECENT BACKUP-LIKE FILES ==='
        for base in /var/backups /srv/backups /home/$(id -un); do
          [ -d "$base" ] || continue
          find "$base" -maxdepth 3 -type f \( -iname '*.tar.gz' -o -iname '*.tgz' -o -iname '*.sql' -o -iname '*.sqlite*' -o -iname '*.bak' \) -printf '%TY-%Tm-%Td %TH:%TM %s %p\n' 2>/dev/null | sort -r | head -30 || true
        done
        echo '=== CONTAINERS ==='
        if command -v docker >/dev/null 2>&1; then
          docker ps --format '{{"{{"}}.Names{{"}}"}}|{{"{{"}}.Image{{"}}"}}|{{"{{"}}.Status{{"}}"}}' 2>/dev/null | sed -n '1,80p' || echo 'docker-unavailable-to-user'
        fi
        if command -v podman >/dev/null 2>&1; then
          podman ps --format '{{"{{"}}.Names{{"}}"}}|{{"{{"}}.Image{{"}}"}}|{{"{{"}}.Status{{"}}"}}' 2>/dev/null | sed -n '1,80p' || true
        fi
        echo '=== STATEFUL PATH SIZES (NO CONTENTS) ==='
        for p in /opt/docker/compose /srv/compose /srv/osho /mnt/photos-primary; do
          [ -e "$p" ] && du -sh "$p" 2>/dev/null || true
        done
        sync
      args:
        executable: /bin/bash
      register: backup_audit
      changed_when: false

    - name: Print backup evidence
      ansible.builtin.debug:
        var: backup_audit.stdout_lines

- name: Verify compute-01 private photo backup completion
  hosts: compute-01
  gather_facts: false
  tasks:
    - name: Check backup service and compare source/backup inventory
      ansible.builtin.shell: |
        set -u
        echo '=== COMPUTE01 BACKUP SERVICE ==='
        systemctl show compute01-backup.service \
          -p Result -p ExecMainStatus -p ExecMainCode \
          -p ExecMainStartTimestamp -p ExecMainExitTimestamp \
          --no-pager 2>/dev/null || true
        echo '=== PHOTO FILE COUNTS ==='
        for p in /mnt/photos-primary /mnt/photos-backup; do
          printf '%s files=' "$p"
          find "$p" -xdev -type f -print 2>/dev/null | wc -l
          printf '%s bytes=' "$p"
          find "$p" -xdev -type f -printf '%s\n' 2>/dev/null | awk '{s+=$1} END{printf "%.0f\n",s}'
        done
        echo '=== RSYNC DRY-RUN SUMMARY ==='
        if command -v rsync >/dev/null 2>&1; then
          rsync -aHAXn --delete --stats /mnt/photos-primary/ /mnt/photos-backup/ 2>&1 \
            | grep -E 'Number of files|Number of regular files transferred|Total file size|Total transferred file size|Literal data|Matched data|sent .* bytes|speedup' || true
        else
          echo 'rsync-unavailable'
        fi
        sync
      args:
        executable: /bin/bash
      register: photo_verify
      changed_when: false

    - name: Print photo backup verification
      ansible.builtin.debug:
        var: photo_verify.stdout_lines

- name: Diagnose compute-01 photo storage device detection
  hosts: compute-01
  gather_facts: false
  tasks:
    - name: Collect device and mount evidence
      ansible.builtin.shell: |
        set -o pipefail
        echo '=== LSBLK ==='
        lsblk -o NAME,MODEL,SERIAL,SIZE,FSTYPE,LABEL,UUID,MOUNTPOINTS 2>/dev/null || true
        echo '=== FSTAB ==='
        cat /etc/fstab 2>/dev/null || true
        echo '=== BY-UUID ==='
        ls -l /dev/disk/by-uuid 2>/dev/null || true
        echo '=== USB ==='
        lsusb 2>/dev/null || true
        echo '=== PHOTO MOUNT UNITS ==='
        systemctl status mnt-photos\\x2dprimary.mount mnt-photos\\x2dbackup.mount --no-pager 2>&1 || true
        echo '=== FAILED UNITS ==='
        systemctl --failed --no-pager --no-legend 2>/dev/null || true
      args:
        executable: /bin/bash
      register: storage_diag
      changed_when: false

    - name: Print storage diagnostic
      ansible.builtin.debug:
        var: storage_diag.stdout_lines

- name: Deep read-only photo disk diagnostic
  hosts: compute-01
  gather_facts: false
  tasks:
    - name: Read kernel-visible partition metadata without writing disks
      ansible.builtin.shell: |
        set -o pipefail
        echo '=== LSBLK PARTITION DETAIL ==='
        lsblk -o NAME,KNAME,MODEL,SERIAL,SIZE,TYPE,RO,RM,TRAN,STATE,FSTYPE,PTTYPE,PARTTYPE,PARTUUID,UUID,LABEL,MOUNTPOINTS 2>&1 || true
        echo '=== PROC PARTITIONS ==='
        grep -E '(^major|[[:space:]]sd[ab][0-9]*$)' /proc/partitions 2>/dev/null || cat /proc/partitions
        echo '=== DEVICE BY-ID ==='
        ls -l /dev/disk/by-id 2>/dev/null | grep -Ei 'wd|passport|wxt1e849j7c9|wx21d3752yd0' || true
        echo '=== UDEV SDB ==='
        udevadm info --query=property --name=/dev/sdb 2>&1 | grep -E '^(DEVNAME|DEVTYPE|ID_MODEL|ID_SERIAL|ID_SERIAL_SHORT|ID_PART_TABLE|ID_FS|ID_BUS|ID_USB)' || true
        echo '=== SYSFS SDB CHILDREN ==='
        find /sys/class/block/sdb -maxdepth 2 -type l -printf '%f -> %l\n' 2>/dev/null | sed -n '1,120p' || true
        echo '=== RECENT KERNEL STORAGE EVENTS ==='
        journalctl -k --no-pager --since '-45 minutes' 2>&1 | grep -Ei 'usb|uas|scsi|sd[a-z]|partition|gpt|i/o error|sense|reset|capacity|medium|read error' | tail -220 || true
        echo '=== READ-ONLY USERSPACE PROBES ==='
        command -v wipefs >/dev/null && wipefs -n /dev/sdb 2>&1 || true
        command -v fdisk >/dev/null && fdisk -l /dev/sdb 2>&1 || true
        command -v parted >/dev/null && parted -s /dev/sdb print 2>&1 || true
        command -v smartctl >/dev/null && smartctl -i /dev/sdb 2>&1 || true
      args:
        executable: /bin/bash
      register: deep_storage_diag
      changed_when: false

    - name: Print deep storage diagnostic
      ansible.builtin.debug:
        var: deep_storage_diag.stdout_lines

- name: Inspect photo backup safety and switch adjacency
  hosts: compute-01:compute-02
  gather_facts: false
  tasks:
    - name: Collect backup unit and LLDP evidence
      ansible.builtin.shell: |
        set -o pipefail
        echo "=== HOST $(hostname -s) ==="
        if [ "$(hostname -s)" = "compute-01" ]; then
          echo '=== BACKUP SERVICE UNIT ==='
          systemctl cat compute01-backup.service 2>&1 || true
          echo '=== BACKUP TIMER UNIT ==='
          systemctl cat compute01-backup.timer 2>&1 || true
          echo '=== UDISKS BACKUP DEVICE ==='
          command -v udisksctl >/dev/null && udisksctl info -b /dev/sda1 2>&1 | sed -n '1,140p' || true
        fi
        echo '=== NETWORK NEIGHBOR ==='
        networkctl status 2>/dev/null | grep -E 'Connected To:|State:|Address:|Gateway:' | sed -n '1,80p' || true
        command -v lldpcli >/dev/null && lldpcli show neighbors 2>&1 | sed -n '1,160p' || true
      args:
        executable: /bin/bash
      register: safety_diag
      changed_when: false

    - name: Print backup safety and adjacency diagnostic
      ansible.builtin.debug:
        var: safety_diag.stdout_lines
