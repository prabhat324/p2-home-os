---
- name: Verify rolling YouTube 24h metric
  hosts: compute-02
  gather_facts: false
  tasks:
    - name: Verify Analyst metric and live API
      ansible.builtin.shell: |
        set -eu
        base='http://127.0.0.1:8787'
        page="$(mktemp)"; api="$(mktemp)"
        curl -fsS "$base/youtube-analyst" > "$page"
        curl -fsS "$base/api/analytics" > "$api"
        printf 'PAGE_24H_LABEL=%s\n' "$(grep -q '24-hour views' "$page" && echo yes || echo no)"
        printf 'PAGE_COVERAGE_NOTE=%s\n' "$(grep -q 'minimum measured' "$page" && echo yes || echo no)"
        python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); m=d.get("views_24h") or {}; print("API_STATUS="+str(d.get("status"))); print("VIEWS_24H="+str(m.get("value"))); print("TRACKED="+str(m.get("tracked_videos"))); print("CHANNEL="+str(m.get("channel_videos"))); print("COVERAGE_COMPLETE="+str(m.get("coverage_complete"))); print("WINDOW_COMPLETE="+str(m.get("window_complete"))); print("WINDOW_HOURS="+str(m.get("window_hours"))); print("AGE_SECONDS="+str(d.get("age_seconds")))' "$api"
        rm -f "$page" "$api"
      args:
        executable: /bin/bash
      register: verify
      changed_when: false
    - name: Show verification
      ansible.builtin.debug:
        msg: "{{ verify.stdout_lines }}"
