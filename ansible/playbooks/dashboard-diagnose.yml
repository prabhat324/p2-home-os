---
- name: Diagnose Project Osho dashboard navigation and YouTube analyst
  hosts: compute-02
  gather_facts: false
  tasks:
    - name: Inspect live dashboard frontend, routes and analyst references
      ansible.builtin.shell: |
        set -o pipefail
        base='http://127.0.0.1:8787'
        root='/srv/compose/osho-dashboard'

        echo '=== HEALTH ==='
        curl -fsS "${base}/health" 2>/dev/null || true
        echo
        echo '=== HTTP ROUTES ==='
        for p in / /youtube /analytics /analyst /api/dashboard /api/analytics; do
          code=$(curl -sS -o /tmp/osho-dash-body -w '%{http_code}' "${base}${p}" 2>/dev/null || true)
          echo "$p HTTP=$code SIZE=$(wc -c </tmp/osho-dash-body 2>/dev/null || echo 0)"
        done
        rm -f /tmp/osho-dash-body

        echo '=== FILES ==='
        find "$root" -maxdepth 4 -type f \( -name '*.py' -o -name '*.html' -o -name '*.js' -o -name '*.css' \) -print 2>/dev/null | sort

        echo '=== NAV / ANALYTICS REFERENCES ==='
        grep -RniE 'YouTube|Analyst|Analytics|sidebar|nav|href=|scroll|section|tab|dashboard' "$root" \
          --include='*.html' --include='*.js' --include='*.py' --include='*.css' 2>/dev/null | head -500 || true

        echo '=== FRONTEND CONTENT ==='
        for f in $(find "$root" -maxdepth 4 -type f \( -name '*.html' -o -name '*.js' \) 2>/dev/null | sort); do
          echo "--- $f ---"
          sed -n '1,320p' "$f"
        done

        echo '=== SERVER ROUTES ==='
        for f in $(find "$root" -maxdepth 4 -type f -name '*.py' 2>/dev/null | sort); do
          echo "--- $f ---"
          grep -nE '@app\.|@router\.|def .*dashboard|def .*analytics|youtube|analyst|HTMLResponse|FileResponse|StaticFiles' "$f" | head -240 || true
        done
      args:
        executable: /bin/bash
      register: dashboard_diag
      changed_when: false
      failed_when: false

    - name: Print dashboard diagnostic
      ansible.builtin.debug:
        msg: "{{ dashboard_diag.stdout_lines }}"
