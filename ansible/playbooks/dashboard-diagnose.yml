---
- name: Inspect YouTube Analyst payload for historical data
  hosts: compute-02
  gather_facts: false
  tasks:
    - name: Inspect live analytics payload shape
      ansible.builtin.shell: |
        set -eu
        curl -fsS http://127.0.0.1:8787/api/analytics | python3 - <<'PY'
        import json,sys
        d=json.load(sys.stdin); a=d.get('analytics') or {}; ch=a.get('channel') or {}
        print('TOP_KEYS='+','.join(sorted(a.keys())))
        print('CHANNEL_KEYS='+','.join(sorted(ch.keys())) if isinstance(ch,dict) else 'CHANNEL_KEYS=')
        for k,v in a.items():
            if isinstance(v,list): print(f'LIST={k} LEN={len(v)}')
            elif isinstance(v,dict): print(f'DICT={k} KEYS='+','.join(sorted(v.keys())[:40]))
        print('AGE_SECONDS='+str(d.get('age_seconds')))
        PY
      args:
        executable: /bin/bash
      register: diag
      changed_when: false
    - name: Show payload shape
      ansible.builtin.debug:
        msg: "{{ diag.stdout_lines }}"
