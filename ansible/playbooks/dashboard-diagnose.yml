---
- name: Diagnose Project Osho dashboard ready-count semantics
  hosts: compute-02
  gather_facts: false
  tasks:
    - name: Inspect live dashboard payload and ready-count implementation
      ansible.builtin.shell: |
        set -o pipefail
        base='http://127.0.0.1:8787'

        echo '=== DASHBOARD HEALTH ==='
        curl -fsS "${base}/health" 2>/dev/null || true
        echo

        echo '=== DASHBOARD API SAFE SUMMARY ==='
        payload="$(curl -fsS "${base}/api/dashboard" 2>/dev/null || true)"
        if [ -n "$payload" ]; then
          DASHBOARD_PAYLOAD="$payload" python3 - <<'PY'
        import json, os
        d=json.loads(os.environ['DASHBOARD_PAYLOAD'])
        def walk(obj, path=''):
            if isinstance(obj, dict):
                for k,v in obj.items():
                    p=f'{path}.{k}' if path else k
                    if any(x in k.lower() for x in ('ready','publish','upload','skip','pending','queue','source','receipt')):
                        if isinstance(v,(str,int,float,bool)) or v is None:
                            print(f'{p}={v}')
                        elif isinstance(v,(list,dict)):
                            print(f'{p}_TYPE={type(v).__name__} SIZE={len(v)}')
                    walk(v,p)
            elif isinstance(obj,list):
                for i,v in enumerate(obj[:50]):
                    walk(v,f'{path}[{i}]')
        walk(d)
        PY
        fi

        echo '=== DEPLOYED FILES ==='
        find /srv/compose/osho-dashboard -maxdepth 3 -type f \
          \( -name '*.py' -o -name '*.html' -o -name '*.js' \) -print 2>/dev/null | sort

        echo '=== READY REFERENCES ==='
        grep -RniE 'ready|published|uploaded|skipped|pending|receipts|state_reconciliation|summary' \
          /srv/compose/osho-dashboard/app /srv/compose/osho-dashboard 2>/dev/null \
          | head -320 || true

        echo '=== SERVER CONTEXT ==='
        for f in /srv/compose/osho-dashboard/app/server.py /srv/compose/osho-dashboard/server.py; do
          [ -f "$f" ] || continue
          echo "--- $f ---"
          grep -nEi 'ready|summary|dashboard|published|uploaded|skipped|pending' "$f" | head -120 || true
        done
      args:
        executable: /bin/bash
      register: dashboard_diag
      changed_when: false

    - name: Print dashboard diagnostic
      ansible.builtin.debug:
        msg: "{{ dashboard_diag.stdout_lines }}"
