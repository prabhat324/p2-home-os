---
- name: Revoke ReviewMuse runtime DDL privilege after migration
  hosts: compute-03
  gather_facts: false
  tasks:
    - name: Revoke schema create from application role
      ansible.builtin.shell: |
        set -euo pipefail
        source /srv/reviewmuse/secrets/postgres.env
        podman exec -e PGPASSWORD="$POSTGRES_PASSWORD" reviewmuse-postgres \
          psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" \
          -c 'REVOKE CREATE ON SCHEMA public FROM reviewmuse_app; GRANT USAGE ON SCHEMA public TO reviewmuse_app;'
        echo SCHEMA_CREATE_REVOKED=ok
      args:
        executable: /bin/bash
      no_log: true
      changed_when: true

    - name: Verify runtime role no longer has schema create
      ansible.builtin.shell: |
        set -euo pipefail
        source /srv/reviewmuse/secrets/postgres.env
        podman exec -e PGPASSWORD="$POSTGRES_PASSWORD" reviewmuse-postgres \
          psql -At -U "$POSTGRES_USER" -d "$POSTGRES_DB" \
          -c "SELECT has_schema_privilege('reviewmuse_app','public','CREATE');"
      args:
        executable: /bin/bash
      register: verify
      no_log: true
      changed_when: false

    - name: Show safe revoke result
      ansible.builtin.debug:
        msg: "RUNTIME_SCHEMA_CREATE={{ 'no' if verify.stdout == 'f' else 'unexpected' }}"
