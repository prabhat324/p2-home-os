---
- name: Discover new media node on local network
  hosts: core-01
  gather_facts: false
  tasks:
    - name: Probe LAN and collect hostname and SSH clues
      ansible.builtin.shell: |
        set -u
        subnet="192.168.0"
        seq 1 254 | xargs -P 32 -I{} sh -c 'ping -c 1 -W 1 0.{} >/dev/null 2>&1 || true' "$subnet"

        echo 'HOSTNAME_LOOKUP_BEGIN'
        getent ahostsv4 media-01 2>/dev/null || true
        getent ahostsv4 media-01.local 2>/dev/null || true
        command -v avahi-resolve-host-name >/dev/null 2>&1 && avahi-resolve-host-name -4 media-01.local 2>/dev/null || true
        echo 'HOSTNAME_LOOKUP_END'

        echo 'NEIGHBORS_BEGIN'
        ip -4 neigh show 2>/dev/null | LC_ALL=C tr -cd '\11\12\15\40-\176' | sort -V || cat /proc/net/arp 2>/dev/null || true
        echo 'NEIGHBORS_END'

        echo 'LIVE_SSH_HOSTS_BEGIN'
        export subnet
        seq 1 254 | xargs -P 64 -I{} bash -c 'ip="$subnet.{}"; timeout 0.5 bash -c "exec 3<>/dev/tcp/$ip/22" >/dev/null 2>&1 && echo "$ip" || true' | sort -V
        echo 'LIVE_SSH_HOSTS_END'
      args:
        executable: /bin/bash
      register: discovery
      changed_when: false

    - name: Print discovery results
      ansible.builtin.debug:
        msg: "{{ discovery.stdout_lines }}"
