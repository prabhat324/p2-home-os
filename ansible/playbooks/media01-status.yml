---
- name: Read media-01 worker and job status
  hosts: media-01
  gather_facts: false
  tasks:
    - name: Read service state
      ansible.builtin.command:
        argv: [systemctl, is-active, media01-worker.service]
      register: service_state
      changed_when: false
      failed_when: false

    - name: Read worker process
      ansible.builtin.command:
        argv: [pgrep, -a, -f, /home/p2ops/media01/media_worker.py --watch]
      register: worker_process
      changed_when: false
      failed_when: false

    - name: Read demo job status
      ansible.builtin.slurp:
        src: /srv/media-production/logs/besquare-demo-01.status.json
      register: demo_status

    - name: Read recent demo log
      ansible.builtin.command:
        argv: [tail, -n, "30", /srv/media-production/logs/besquare-demo-01.log]
      register: recent_log
      changed_when: false
      failed_when: false

    - name: Read GPU utilization
      ansible.builtin.command:
        argv:
          - nvidia-smi
          - --query-gpu=utilization.gpu,memory.used,memory.total,temperature.gpu,power.draw
          - --format=csv,noheader
      register: gpu_state
      changed_when: false

    - name: Read model cache size
      ansible.builtin.command:
        argv: [du, -sh, /srv/media-production/work/.cache]
      register: cache_size
      changed_when: false
      failed_when: false

    - name: Report status
      ansible.builtin.debug:
        msg:
          service: "{{ service_state.stdout }}"
          process: "{{ worker_process.stdout }}"
          job: "{{ demo_status.content | b64decode | from_json }}"
          gpu: "{{ gpu_state.stdout }}"
          cache: "{{ cache_size.stdout }}"
          recent_log: "{{ recent_log.stdout_lines }}"

    - name: Collect read-only hardware and software inventory
      ansible.builtin.shell: |
        python3 - <<'PY'
        import subprocess,json
        commands = {
          "identity":"hostnamectl",
          "cpu":"lscpu",
          "memory":"free -h",
          "disks":"lsblk -o NAME,SIZE,TYPE,FSTYPE,MOUNTPOINTS,MODEL,TRAN",
          "space":"df -hT / /srv/media-production",
          "gpu":"nvidia-smi -q",
          "pci":"lspci",
          "network":"ip -br link",
          "software":"dpkg-query -W -f='${binary:Package} ${Version}\\n' ffmpeg mediainfo imagemagick sox rubberband-cli python3 docker.io docker-ce nvidia-container-toolkit nvtop htop tmux smartmontools nvme-cli sysstat lm-sensors ethtool iperf3",
          "ffmpeg":"ffmpeg -hide_banner -version",
          "filters":"ffmpeg -hide_banner -filters",
          "python_packages":"/home/p2ops/media01/venv/bin/python -m pip list --format=json",
          "service":"systemctl show media01-worker.service -p User -p Group -p ActiveState -p SubState -p NRestarts -p MemoryCurrent -p CPUUsageNSec",
          "power":"powerprofilesctl get",
          "thermal":"sensors",
          "failed_services":"systemctl --failed --no-pager",
          "app_hashes":"sha256sum /home/p2ops/media01/media_worker.py /home/p2ops/media01/qa_gate.py /home/p2ops/media01/content_analyzer.py",
          "source_format":"ffprobe -v error -show_streams -show_format -of json /srv/media-production/inbox/besquare-demo-01/master.mp4"
        }
        result={}
        for name,cmd in commands.items():
          try:
            p=subprocess.run(cmd,shell=True,capture_output=True,text=True,timeout=15)
            out=p.stdout
            if name=="filters":
              out="\\n".join(x for x in out.splitlines() if any(k in x for k in ["cuda","npp","loudnorm","libvmaf","zscale","subtitles"]))
            result[name]={"rc":p.returncode,"stdout":out,"stderr":p.stderr[-1500:]}
          except Exception as e: result[name]={"error":str(e)}
        print(json.dumps(result))
        PY
      args:
        executable: /bin/bash
      register: inventory_report
      changed_when: false

    - name: Print hardware and software inventory
      ansible.builtin.debug:
        msg: "{{ inventory_report.stdout | from_json }}"

    - name: Read implementation prerequisites and review evidence
      ansible.builtin.shell: |
        python3 - <<'PY'
        import subprocess,json,pathlib
        result={}
        for name,cmd in {
          "sudo":"sudo -n -l",
          "network":"networkctl status --no-pager",
          "links":"ethtool enx80691a165c43",
          "power":"cat /sys/firmware/acpi/platform_profile /sys/firmware/acpi/platform_profile_choices /sys/devices/system/cpu/cpu0/cpufreq/energy_performance_preference",
          "ac":"cat /sys/class/power_supply/AC*/online",
          "mounts":"findmnt -r -o TARGET,SOURCE,FSTYPE",
          "timers":"systemctl list-timers --all --no-pager",
          "processes":"ps -eo pid,ppid,user,comm --sort=pid"
        }.items():
          p=subprocess.run(cmd,shell=True,capture_output=True,text=True,timeout=10)
          result[name]={"rc":p.returncode,"stdout":p.stdout,"stderr":p.stderr}
        root=pathlib.Path("/srv/media-production")
        for name in ["content-report.json","transcript.json"]:
          p=root/"review/besquare-demo-01/analysis"/name
          if p.exists():
            v=json.loads(p.read_text())
            if name=="transcript.json": v={k:v[k] for k in ["model","engine","created_at"] if k in v}
            else: v.pop("fact_check_flags",None)
            result[name]=v
        result["manifests"]={str(p):p.read_text() for p in (root/"inbox").glob("*/project.json")}
        print(json.dumps(result))
        PY
      args:
        executable: /bin/bash
      changed_when: false
      register: prerequisites
    - name: Print implementation prerequisites
      ansible.builtin.debug:
        msg: "{{ prerequisites.stdout | from_json }}"

    - name: Read v2 validation artifacts
      ansible.builtin.shell: |
        python3 - <<'PY'
        import pathlib,json,subprocess
        root=pathlib.Path("/srv/media-production")
        files=["logs/performance-validation.status.json","logs/performance-4k-v2.status.json","logs/besquare-demo-01.status.json","logs/worker-heartbeat.json","work/performance-validation/results.json","work/performance-4k-v2/timings.json","review/performance-4k-v2/qa-report.json"]
        data={}
        for name in files:
          p=root/name
          if p.exists():
            v=json.loads(p.read_text())
            if name.endswith("qa-report.json"):v={k:v[k] for k in ["status","failures","warnings","loudness"] if k in v}
            data[name]=v
        for name in ["work/performance-validation/commands.log","work/performance-4k-v2/commands.log"]:
          p=root/name
          if p.exists(): data[name]=p.read_text()[-3500:]
        data["venv"]=subprocess.run(["/home/p2ops/media01/venv-v2/bin/python","-m","pip","list","--format=json"],capture_output=True,text=True).stdout
        data["artifacts"]=[str(p.relative_to(root)) for p in (root/"review").glob("*/*") if p.is_file()]
        print(json.dumps(data))
        PY
      changed_when: false
      register: v2
    - name: Print v2 validation
      ansible.builtin.debug:
        msg: "{{ v2.stdout | from_json }}"
