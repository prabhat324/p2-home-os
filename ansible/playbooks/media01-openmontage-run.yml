---
- name: Run isolated OpenMontage comparison driver on media-01
  hosts: media-01
  gather_facts: false
  vars:
    remote_driver: /home/p2ops/openmontage-lab/run_openmontage_compare.py
    om_python: /home/p2ops/openmontage-lab/OpenMontage/.venv/bin/python
    final_mp4: /srv/media-production/review/openmontage-besquare-demo-01/OpenMontage-Wasaga-18m-V1.mp4
    report_json: /srv/media-production/review/openmontage-besquare-demo-01/OpenMontage-Wasaga-18m-V1.report.json
  tasks:
    - name: Install experiment driver beside the isolated OpenMontage lab
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../files/media01_openmontage_driver.py"
        dest: "{{ remote_driver }}"
        mode: '0755'

    - name: Execute full OpenMontage comparison and wait for completion
      ansible.builtin.command:
        argv:
          - "{{ om_python }}"
          - "{{ remote_driver }}"
      environment:
        PATH: /home/p2ops/openmontage-lab/node-v24.20.0-linux-x64/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      register: openmontage_run
      changed_when: true

    - name: Verify completed deliverables
      ansible.builtin.shell: |
        set -euo pipefail
        test -s '{{ final_mp4 }}'
        test -s '{{ report_json }}'
        echo '=== FINAL FILE ==='
        ls -lh '{{ final_mp4 }}' '{{ report_json }}'
        echo '=== REPORT ==='
        cat '{{ report_json }}'
        echo '=== GPU ==='
        nvidia-smi --query-gpu=name,utilization.gpu,memory.used,memory.total,temperature.gpu --format=csv,noheader
      args:
        executable: /bin/bash
      register: verify
      changed_when: false

    - name: Report completed OpenMontage render
      ansible.builtin.debug:
        msg:
          driver_output: "{{ openmontage_run.stdout_lines }}"
          verification: "{{ verify.stdout }}"
          final: "{{ final_mp4 }}"
