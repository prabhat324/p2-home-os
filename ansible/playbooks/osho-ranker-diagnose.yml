---
- name: Locate stale Project Osho 8B QA dependencies on compute-01
  hosts: compute-01
  gather_facts: false
  tasks:
    - name: Search worker source for stale models and GPU handoff text
      ansible.builtin.shell: |
        set -u
        cd /srv/compose/osho-worker
        echo '=== QWEN 8B OCCURRENCES ==='
        grep -RIn --include='*.py' --include='*.sh' --include='*.service' \
          -E 'qwen3:8b|Qwen3 8B|llama3\.1:8b|GPU STAGE: stopping' . 2>/dev/null | head -240 || true

        echo '=== QA IMPORTS ==='
        sed -n '1,140p' retention_qa_v4.py 2>/dev/null || true

        echo '=== CURRENT PIPELINE ==='
        pgrep -af 'osho_autopilot.py|hook_ranker_v5.py|retention_qa_v4.py' 2>/dev/null || true
        ollama ps 2>/dev/null || true
        echo '--- 000005 rank log tail ---'
        tail -50 /srv/osho/logs/autopilot/000005-hook-v5.log 2>/dev/null || true
      args:
        executable: /bin/bash
      register: stale_model
      changed_when: false
      failed_when: false

    - name: Show stale model search
      ansible.builtin.debug:
        msg: "{{ stale_model.stdout_lines }}"
