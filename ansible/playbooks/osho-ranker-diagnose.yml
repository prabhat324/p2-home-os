---
- name: Diagnose stalled Project Osho autopilot stage
  hosts: compute-01
  gather_facts: false
  tasks:
    - name: Inspect autopilot process tree, journal and processing row
      ansible.builtin.shell: |
        set -o pipefail
        echo "NOW=$(date -Ins)"
        echo '=== SERVICE ==='
        systemctl is-active osho-autopilot.service 2>/dev/null || true
        systemctl show osho-autopilot.service -p MainPID -p ActiveEnterTimestamp -p ExecMainStartTimestamp -p NRestarts --no-pager 2>/dev/null || true
        echo '=== PROCESS TREE ==='
        ps -eo pid,ppid,etimes,state,wchan:32,comm,args --forest | grep -E 'osho_autopilot|hook_ranker_v5|retention_qa_v4|ollama|llama-server|ffmpeg|yt-dlp' | grep -v grep || true
        echo '=== AUTOPILOT CHILDREN ==='
        apid="$(systemctl show -p MainPID --value osho-autopilot.service 2>/dev/null || true)"
        if [ -n "$apid" ] && [ "$apid" != 0 ]; then
          ps -o pid,ppid,etimes,state,wchan:40,comm,args --ppid "$apid" 2>/dev/null || true
          cat "/proc/$apid/wchan" 2>/dev/null | sed 's/^/AUTOPILOT_WCHAN=/' || true
        fi
        echo '=== PROCESSING ROWS ==='
        python3 - <<'PY'
        import sqlite3
        from pathlib import Path
        db=Path('/srv/osho/library/catalog/catalog.sqlite')
        c=sqlite3.connect(f'file:{db}?mode=ro&immutable=1',uri=True,timeout=2)
        c.row_factory=sqlite3.Row
        rows=c.execute("SELECT * FROM osho_autopilot_state WHERE lower(trim(status))='processing'").fetchall()
        print('PROCESSING_COUNT='+str(len(rows)))
        for r in rows:
            d=dict(r)
            print('PROCESSING_ROW='+repr(d))
        c.close()
        PY
        echo '=== SOURCE 000029 FILES ==='
        ls -l --time-style=long-iso /srv/osho/candidates/000029* /srv/osho/transcripts/000029* /srv/osho/logs/autopilot/000029* 2>/dev/null || true
        echo '=== RANK RESULT SUMMARY ==='
        python3 - <<'PY'
        import json,pathlib
        p=pathlib.Path('/srv/osho/candidates/000029.hook-ranked-v5.json')
        if p.exists():
            d=json.loads(p.read_text())
            print('TYPE='+type(d).__name__)
            if isinstance(d,dict):
                print('KEYS='+','.join(sorted(d.keys())))
                for k in ('source_id','candidates','ranked','survivors','top','approved'):
                    v=d.get(k)
                    if isinstance(v,list): print(f'{k.upper()}_COUNT={len(v)}')
                    elif v is not None: print(f'{k.upper()}={v!r}')
        PY
        echo '=== JOURNAL TAIL ==='
        journalctl -u osho-autopilot.service --since '2026-08-15 02:50:00' --no-pager -n 160 2>/dev/null || true
      args:
        executable: /bin/bash
      register: diag
      changed_when: false
      failed_when: false

    - name: Show stall diagnosis
      ansible.builtin.debug:
        msg: "{{ diag.stdout_lines }}"
