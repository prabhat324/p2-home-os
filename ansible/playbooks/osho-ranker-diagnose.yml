---
- name: Diagnose Project Osho QA model paths on compute-01
  hosts: compute-01
  gather_facts: false
  tasks:
    - name: Collect exact QA model and GPU handoff code
      ansible.builtin.shell: |
        set -u
        cd /srv/compose/osho-worker
        echo '=== RETENTION QA MODEL OCCURRENCES ==='
        grep -nE 'qwen3|llama3\.1|ollama|LARGE-V3|large-v3|GPU STAGE' retention_qa_v4.py 2>/dev/null || true

        echo '=== CONTEXT AROUND MODEL OCCURRENCES ==='
        for n in $(grep -nE 'qwen3|llama3\.1' retention_qa_v4.py 2>/dev/null | cut -d: -f1 | head -20); do
          start=$((n-8)); [ "$start" -lt 1 ] && start=1
          end=$((n+12))
          echo "--- lines $start-$end ---"
          sed -n "${start},${end}p" retention_qa_v4.py
        done

        echo '=== CURRENT QA PROGRESS ==='
        pgrep -af 'osho_autopilot.py|retention_qa_v4.py|hook_ranker_v5.py' 2>/dev/null || true
        ollama ps 2>/dev/null || true
        tail -100 /srv/osho/logs/autopilot/000004-qa-v4.log 2>/dev/null || true
      args:
        executable: /bin/bash
      register: qa_code
      changed_when: false
      failed_when: false

    - name: Show exact QA code
      ansible.builtin.debug:
        msg: "{{ qa_code.stdout_lines }}"
