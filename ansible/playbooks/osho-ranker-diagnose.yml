---
- name: Validate live Project Osho state after apparent stall
  hosts: compute-01
  gather_facts: false
  tasks:
    - name: Compare SQLite live state and inspect latest rank result
      ansible.builtin.shell: |
        set -o pipefail
        cd /srv/compose/osho-worker
        echo "NOW=$(date -Ins)"
        echo '=== SERVICE / PROCS ==='
        systemctl is-active osho-autopilot.service 2>/dev/null || true
        pgrep -af 'osho_autopilot.py|hook_ranker_v5.py|retention_qa_v4.py' 2>/dev/null || true
        echo '=== LIVE SQLITE STATE (WAL-AWARE) ==='
        python3 - <<'PY'
        import sqlite3
        db='/srv/osho/library/catalog/catalog.sqlite'
        for label,uri in [
            ('LIVE',f'file:{db}?mode=ro'),
            ('IMMUTABLE',f'file:{db}?mode=ro&immutable=1'),
        ]:
            c=sqlite3.connect(uri,uri=True,timeout=2)
            c.row_factory=sqlite3.Row
            rows=c.execute("SELECT lower(trim(status)) status,count(*) count FROM osho_autopilot_state GROUP BY lower(trim(status)) ORDER BY status").fetchall()
            print(label+'_COUNTS='+repr({r['status']:r['count'] for r in rows}))
            latest=c.execute("SELECT * FROM osho_autopilot_state ORDER BY source_number DESC LIMIT 8").fetchall()
            for r in latest: print(label+'_ROW='+repr(dict(r)))
            c.close()
        PY
        echo '=== 000029 RANK RESULT ==='
        python3 - <<'PY'
        import json,pathlib
        p=pathlib.Path('/srv/osho/candidates/000029.hook-ranked-v5.json')
        print('EXISTS='+str(p.exists()))
        if p.exists():
            d=json.loads(p.read_text())
            for k,v in d.items():
                if isinstance(v,list): print(f'{k.upper()}_COUNT={len(v)}')
                elif k in ('source_id','model','version','generated_at'): print(f'{k.upper()}={v!r}')
        q=pathlib.Path('/srv/osho/transcripts/000029.retention-qa-v4.json')
        print('QA_SUMMARY_EXISTS='+str(q.exists()))
        PY
        echo '=== RECENT AUTOPILOT LOG RESULTS ==='
        for f in $(find /srv/osho/logs/autopilot -maxdepth 1 -type f -name '*-hook-v5.log' -printf '%T@ %p\n' | sort -nr | head -8 | awk '{print $2}'); do
          echo "--- $f ---"
          grep -E 'SAVED:|NO SAFE|SURVIVORS|FULL CLIPS|ERROR|timed out|MODEL' "$f" | tail -20 || true
        done
      args:
        executable: /bin/bash
      register: diag
      changed_when: false
      failed_when: false

    - name: Show live-state validation
      ansible.builtin.debug:
        msg: "{{ diag.stdout_lines }}"
