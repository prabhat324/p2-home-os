---
- name: Follow active Project Osho source through repaired QA path
  hosts: compute-01
  gather_facts: false
  tasks:
    - name: Collect current source diagnostics
      ansible.builtin.shell: |
        set -u
        cd /srv/compose/osho-worker

        echo '=== SERVICE ==='
        systemctl is-active osho-autopilot.service 2>/dev/null || true
        systemctl show osho-autopilot.service -p ActiveState -p SubState -p MainPID --no-pager 2>/dev/null || true

        echo '=== QA FIX STATUS ==='
        sudo -n /usr/local/sbin/p2ops-osho-qa-fix status 2>&1 || true

        echo '=== PIPELINE ==='
        pgrep -af 'osho_autopilot.py|hook_ranker_v5.py|retention_qa_v4.py|render|youtube' 2>/dev/null || true
        ollama ps 2>/dev/null || true

        source_id="$(pgrep -af 'retention_qa_v4.py|hook_ranker_v5.py' 2>/dev/null \
          | sed -nE 's/.*(retention_qa_v4.py|hook_ranker_v5.py) ([0-9]{6}).*/\2/p' \
          | head -1)"
        if [ -z "$source_id" ]; then
          source_id="$(find /srv/osho/logs/autopilot -maxdepth 1 -type f -name '*-hook-v5.log' -printf '%T@ %f\n' 2>/dev/null \
            | sort -nr | head -1 | sed -nE 's/^[^ ]+ ([0-9]{6})-hook-v5\.log$/\1/p')"
        fi
        echo "CURRENT_SOURCE=${source_id:-none}"

        if [ -n "$source_id" ]; then
          rank="/srv/osho/logs/autopilot/${source_id}-hook-v5.log"
          qa="/srv/osho/logs/autopilot/${source_id}-qa-v4.log"
          summary="/srv/osho/transcripts/${source_id}.retention-qa-v4.json"

          echo '=== CURRENT ARTIFACTS ==='
          for f in "$rank" "$qa" "$summary"; do
            if [ -e "$f" ]; then stat -c '%n size=%s mtime=%y' "$f"; else echo "MISSING $f"; fi
          done

          echo '=== CURRENT RANK TAIL ==='
          tail -80 "$rank" 2>/dev/null || true

          echo '=== CURRENT QA TAIL ==='
          tail -180 "$qa" 2>/dev/null || true

          echo '=== CURRENT QA MODEL/TIMEOUT EVIDENCE ==='
          grep -nE 'MODEL: |ERROR: timed out|GPU STAGE: stopping|FINAL CONSENSUS|GENUINE APPROVALS|SUMMARY:' "$qa" 2>/dev/null || true

          rank_before=$(stat -c %Y "$rank" 2>/dev/null || echo 0)
          qa_before=$(stat -c %Y "$qa" 2>/dev/null || echo 0)
          echo '=== 30 SECOND LIVENESS SAMPLE ==='
          sleep 30
          rank_after=$(stat -c %Y "$rank" 2>/dev/null || echo 0)
          qa_after=$(stat -c %Y "$qa" 2>/dev/null || echo 0)
          echo "RANK_MTIME_BEFORE=$rank_before AFTER=$rank_after"
          echo "QA_MTIME_BEFORE=$qa_before AFTER=$qa_after"
          pgrep -af 'osho_autopilot.py|hook_ranker_v5.py|retention_qa_v4.py|render|youtube' 2>/dev/null || true
          ollama ps 2>/dev/null || true
          tail -80 "$rank" 2>/dev/null || true
          tail -140 "$qa" 2>/dev/null || true
        fi

        echo '=== LATEST LOGS ==='
        find /srv/osho/logs/autopilot -maxdepth 1 -type f -printf '%T@ %TY-%Tm-%TdT%TH:%TM:%TS %p\n' 2>/dev/null \
          | sort -nr | head -15 || true
      args:
        executable: /bin/bash
      register: active_diag
      changed_when: false
      failed_when: false

    - name: Show active source diagnostics
      ansible.builtin.debug:
        msg: "{{ active_diag.stdout_lines }}"
