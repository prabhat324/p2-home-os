---
- name: Inspect Project Osho live progress telemetry path
  hosts: compute-01
  gather_facts: false
  tasks:
    - name: Inspect autopilot dashboard sender and active source
      ansible.builtin.shell: |
        set -o pipefail
        cd /srv/compose/osho-worker
        echo "NOW=$(date -Ins)"
        echo '=== SERVICE / PROCS ==='
        systemctl is-active osho-autopilot.service 2>/dev/null || true
        pgrep -af 'osho_autopilot.py|hook_ranker_v5.py|retention_qa_v4.py' 2>/dev/null || true
        echo '=== DASHBOARD REFERENCES IN AUTOPILOT ==='
        grep -nEi 'dashboard|heartbeat|jobs/update|worker/heartbeat|current_job|progress|compute-02|8787' osho_autopilot.py | head -260 || true
        echo '=== DASHBOARD FUNCTIONS CONTEXT ==='
        python3 - <<'PY'
        from pathlib import Path
        p=Path('osho_autopilot.py')
        lines=p.read_text(errors='ignore').splitlines()
        hits=[i for i,l in enumerate(lines) if any(x in l.lower() for x in ('dashboard','jobs/update','worker/heartbeat','current_job'))]
        shown=set()
        for i in hits:
            a=max(0,i-8); b=min(len(lines),i+18)
            key=(a,b)
            if key in shown: continue
            shown.add(key)
            print(f'--- L{a+1}-L{b} ---')
            for n in range(a,b): print(f'{n+1}: {lines[n]}')
        PY
        echo '=== ACTIVE AUTOPILOT ROW ==='
        python3 - <<'PY'
        import sqlite3
        db='/srv/osho/library/catalog/catalog.sqlite'
        c=sqlite3.connect(f'file:{db}?mode=ro',uri=True,timeout=2); c.row_factory=sqlite3.Row
        rows=c.execute("SELECT * FROM osho_autopilot_state WHERE lower(status)='processing' ORDER BY updated_at DESC LIMIT 5").fetchall()
        for r in rows: print('ROW='+repr(dict(r)))
        for r in rows:
            sid=r['source_id']; d=c.execute('SELECT source_id,title,duration_seconds FROM discourses WHERE source_id=?',(sid,)).fetchone()
            if d: print('SOURCE='+repr(dict(d)))
        c.close()
        PY
        echo '=== ACTIVE SOURCE LOG FILES ==='
        sid=$(python3 - <<'PY'
        import sqlite3
        c=sqlite3.connect('file:/srv/osho/library/catalog/catalog.sqlite?mode=ro',uri=True); r=c.execute("SELECT source_id FROM osho_autopilot_state WHERE lower(status)='processing' ORDER BY updated_at DESC LIMIT 1").fetchone(); print(r[0] if r else '')
        PY
        )
        echo "ACTIVE_SOURCE=$sid"
        if [ -n "$sid" ]; then
          find /srv/osho -type f -name "${sid}*" -printf '%T@ %p\n' 2>/dev/null | sort -nr | head -40 || true
          for f in /srv/osho/logs/autopilot/${sid}-hook-v5.log /srv/osho/logs/autopilot/${sid}-retention-qa-v4.log; do
            [ -f "$f" ] || continue
            echo "--- $f tail ---"
            tail -80 "$f" || true
          done
        fi
      args:
        executable: /bin/bash
      register: diag
      changed_when: false
      failed_when: false

    - name: Show progress telemetry diagnosis
      ansible.builtin.debug:
        msg: "{{ diag.stdout_lines }}"
