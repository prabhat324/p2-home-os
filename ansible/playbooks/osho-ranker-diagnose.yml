---
- name: Diagnose stalled Project Osho autopilot stage
  hosts: compute-01
  gather_facts: false
  tasks:
    - name: Inspect autopilot runtime, service config and loop state
      ansible.builtin.shell: |
        set -o pipefail
        cd /srv/compose/osho-worker
        echo "NOW=$(date -Ins)"
        apid="$(systemctl show -p MainPID --value osho-autopilot.service 2>/dev/null || true)"
        echo "AUTOPILOT_PID=${apid:-none}"
        echo '=== SERVICE CONFIG ==='
        systemctl cat osho-autopilot.service --no-pager 2>/dev/null || true
        echo '=== PROCESS SNAPSHOT ==='
        if [ -n "$apid" ] && [ "$apid" != 0 ]; then
          ps -p "$apid" -o pid,ppid,etimes,time,%cpu,%mem,state,wchan:32,comm,args 2>/dev/null || true
          echo '--- children ---'
          ps -o pid,ppid,etimes,time,%cpu,state,wchan:32,comm,args --ppid "$apid" 2>/dev/null || true
          echo '--- open fds ---'
          ls -l "/proc/$apid/fd" 2>/dev/null | tail -40 || true
          echo '--- status ---'
          grep -E 'State|Threads|voluntary_ctxt_switches|nonvoluntary_ctxt_switches' "/proc/$apid/status" 2>/dev/null || true
          t1="$(awk '{print $14+$15}' /proc/$apid/stat 2>/dev/null || echo 0)"
          sleep 2
          t2="$(awk '{print $14+$15}' /proc/$apid/stat 2>/dev/null || echo 0)"
          echo "CPU_TICKS_DELTA=$((t2-t1))"
        fi
        echo '=== PROCESSING / PENDING HEAD ==='
        python3 - <<'PY'
        import sqlite3
        from pathlib import Path
        db=Path('/srv/osho/library/catalog/catalog.sqlite')
        c=sqlite3.connect(f'file:{db}?mode=ro&immutable=1',uri=True,timeout=2)
        c.row_factory=sqlite3.Row
        for status in ('processing','pending'):
            rows=c.execute("SELECT * FROM osho_autopilot_state WHERE lower(trim(status))=? ORDER BY source_number LIMIT 8",(status,)).fetchall()
            print(status.upper()+'_COUNT_SHOWN='+str(len(rows)))
            for r in rows: print(status.upper()+'_ROW='+repr(dict(r)))
        c.close()
        PY
        echo '=== AUTOPILOT LOOP CODE ==='
        grep -nE 'def main|while True|sleep\(|processing|pending|hook_ranker_v5|run_v5_and_qa|stop_llms' osho_autopilot.py | tail -100 || true
        echo '=== AUTOPILOT FILE TAIL ==='
        tail -180 osho_autopilot.py || true
        echo '=== POSSIBLE LOG FILES ==='
        find /srv/osho/logs -maxdepth 2 -type f -printf '%T@ %TY-%Tm-%TdT%TH:%TM:%TS %p\n' 2>/dev/null | sort -nr | head -30 || true
      args:
        executable: /bin/bash
      register: diag
      changed_when: false
      failed_when: false

    - name: Show stall diagnosis
      ansible.builtin.debug:
        msg: "{{ diag.stdout_lines }}"
