---
- name: Inspect Project Osho ranker JSON prompts
  hosts: compute-01
  gather_facts: false
  tasks:
    - name: Read scoring prompt constants
      ansible.builtin.shell: |
        set -o pipefail
        cd /srv/compose/osho-worker
        for key in HOOK_SYSTEM CLIP_SYSTEM; do
          echo "=== ${key} ==="
          start=$(grep -n "^${key} =" hook_ranker_v5.py | head -1 | cut -d: -f1)
          if [ -n "$start" ]; then
            end=$((start + 90))
            sed -n "${start},${end}p" hook_ranker_v5.py
          fi
        done
      args:
        executable: /bin/bash
      register: result
      changed_when: false
      failed_when: false

    - name: Show scoring prompts
      ansible.builtin.debug:
        msg: "{{ result.stdout_lines }}"
