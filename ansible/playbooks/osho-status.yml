---
- name: Inspect Project Osho ranker JSON generation path
  hosts: compute-01
  gather_facts: false
  tasks:
    - name: Read ranker JSON and scoring prompt sections
      ansible.builtin.shell: |
        set -o pipefail
        cd /srv/compose/osho-worker
        echo '=== OLLAMA JSON FUNCTION ==='
        sed -n '385,510p' hook_ranker_v5.py
        echo '=== ANCHOR SCORE FUNCTION ==='
        start=$(grep -n '^def model_score_anchor(' hook_ranker_v5.py | head -1 | cut -d: -f1)
        if [ -n "$start" ]; then
          end=$((start + 145))
          sed -n "${start},${end}p" hook_ranker_v5.py
        fi
        echo '=== CLIP SCORE FUNCTION ==='
        start=$(grep -n '^def model_score_clip(' hook_ranker_v5.py | head -1 | cut -d: -f1)
        if [ -n "$start" ]; then
          end=$((start + 180))
          sed -n "${start},${end}p" hook_ranker_v5.py
        fi
      args:
        executable: /bin/bash
      register: result
      changed_when: false
      failed_when: false

    - name: Show ranker JSON path
      ansible.builtin.debug:
        msg: "{{ result.stdout_lines }}"
