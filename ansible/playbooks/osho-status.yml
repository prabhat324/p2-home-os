---
- name: Inspect Project Osho growth template internals
  hosts: compute-01
  gather_facts: false
  tasks:
    - name: Read production renderer, visual planner, caption, and CTA blocks
      ansible.builtin.shell: |
        set -o pipefail
        cd /srv/compose/osho-worker
        echo "NOW=$(date -Ins)"
        echo '=== PRODUCTION RENDERER FUNCTIONS ==='
        grep -nE '^def |CAPTION|caption_|cta|CTA|endcard|scene|broll|visual|hook' production_renderer.py | head -220 || true
        echo '=== PRODUCTION RENDER CORE 1980-2175 ==='
        sed -n '1980,2175p' production_renderer.py
        echo '=== PRODUCTION SCENE BUILD 1560-1815 ==='
        sed -n '1560,1815p' production_renderer.py
        echo '=== AI VISUAL FINAL COMPOSE 450-550 ==='
        sed -n '450,550p' ai_visual_renderer.py
        echo '=== VISUAL PLANNER ==='
        sed -n '1,240p' visual_planner.py
        echo '=== WORKER CURRENT SHORTS FILTER 610-710 ==='
        sed -n '610,710p' app.py
        echo '=== METADATA STRATEGY 1220-1455 ==='
        sed -n '1220,1455p' app.py
        echo '=== LATEST ASS CAPTION SAMPLE ==='
        latest_ass=$(find /srv/osho/work -type f -name 'clip-*.ass' -printf '%T@ %p\n' 2>/dev/null | sort -nr | head -1 | cut -d' ' -f2-)
        echo "ASS=$latest_ass"
        [ -n "$latest_ass" ] && sed -n '1,120p' "$latest_ass" || true
      args:
        executable: /bin/bash
      register: result
      changed_when: false
      failed_when: false

    - name: Show growth template internals
      ansible.builtin.debug:
        msg: "{{ result.stdout_lines }}"
