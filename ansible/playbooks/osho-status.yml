---
- name: Capture exact Project Osho ranker patch anchors
  hosts: compute-01
  gather_facts: false
  tasks:
    - name: Read exact ranker sections
      ansible.builtin.shell: |
        cd /srv/compose/osho-worker
        echo '=== HEAD ==='
        sed -n '1,45p' hook_ranker_v5.py
        echo '=== OLLAMA ==='
        sed -n '315,455p' hook_ranker_v5.py
        echo '=== MAIN LOOPS ==='
        sed -n '1495,1685p' hook_ranker_v5.py
      args:
        executable: /bin/bash
      register: result
      changed_when: false
      failed_when: false

    - name: Show exact ranker sections
      ansible.builtin.debug:
        msg: "{{ result.stdout_lines }}"
