---
- name: Inspect Project Osho ranker for dual GPU execution
  hosts: osho_nodes
  gather_facts: false
  tasks:
    - name: Collect ranker execution structure
      ansible.builtin.shell: |
        set -o pipefail
        echo "HOST=$(hostname)"
        echo "OSHO_ROLE={{ osho_role | default('unknown') }}"
        echo "OLLAMA_ACTIVE=$(systemctl is-active ollama.service 2>/dev/null || true)"
        echo "OLLAMA_PORT=$(ss -lnt 2>/dev/null | awk '{print $4}' | grep -Eq ':11434$' && echo LISTENING || echo CLOSED)"
        nvidia-smi --query-gpu=name,utilization.gpu,memory.used,memory.total --format=csv,noheader 2>/dev/null || true

        if [ "$(hostname -s)" = "compute-01" ]; then
          echo '=== RANKER SIZE ==='
          wc -l /srv/compose/osho-worker/hook_ranker_v5.py 2>/dev/null || true
          echo '=== RANKER MODEL CALL ==='
          sed -n '300,460p' /srv/compose/osho-worker/hook_ranker_v5.py 2>/dev/null || true
          echo '=== RANKER MAIN LOOP A ==='
          sed -n '460,700p' /srv/compose/osho-worker/hook_ranker_v5.py 2>/dev/null || true
          echo '=== RANKER MAIN LOOP B ==='
          sed -n '700,980p' /srv/compose/osho-worker/hook_ranker_v5.py 2>/dev/null || true
        fi

        if [ "$(hostname -s)" = "compute-03" ]; then
          echo '=== COMPUTE03 MODEL MANIFESTS AS OLLAMA USER ==='
          sudo -n -u ollama find /usr/share/ollama/.ollama/models/manifests -type f -maxdepth 8 2>/dev/null \
            | sed 's#^.*/manifests/##' | grep -E 'qwen3|llama3' | head -30 || true
          echo '=== COMPUTE03 SERVICE STATE ==='
          systemctl show ollama.service -p ActiveState -p SubState -p User --no-pager 2>/dev/null || true
        fi
      args:
        executable: /bin/bash
      register: result
      changed_when: false
      failed_when: false

    - name: Show ranker execution structure
      ansible.builtin.debug:
        msg: "{{ result.stdout_lines }}"
