---
- name: Inspect Project Osho dual GPU readiness
  hosts: osho_nodes
  gather_facts: false
  tasks:
    - name: Collect dual GPU readiness
      ansible.builtin.shell: |
        set -o pipefail
        echo "HOST=$(hostname)"
        echo "OSHO_ROLE={{ osho_role | default('unknown') }}"
        echo "OLLAMA_ACTIVE=$(systemctl is-active ollama.service 2>/dev/null || true)"
        echo "OLLAMA_ENABLED=$(systemctl is-enabled ollama.service 2>/dev/null || true)"
        echo "OLLAMA_PORT=$(ss -lnt 2>/dev/null | awk '{print $4}' | grep -Eq ':11434$' && echo LISTENING || echo CLOSED)"
        echo '=== GPU ==='
        nvidia-smi --query-gpu=name,utilization.gpu,memory.used,memory.total,power.draw,temperature.gpu --format=csv,noheader 2>/dev/null || true
        echo '=== OLLAMA PROCESSES ==='
        pgrep -af 'ollama|llama-server' 2>/dev/null || true
        echo '=== MODEL STORE ==='
        ls -ld /usr/share/ollama/.ollama/models /usr/share/ollama/.ollama/models/manifests 2>/dev/null || true
        find /usr/share/ollama/.ollama/models/manifests -type f -maxdepth 8 2>/dev/null \
          | sed 's#^.*/manifests/##' | grep -E 'qwen3|llama3' | head -30 || true

        if [ "$(hostname -s)" = "compute-03" ]; then
          echo '=== COMPUTE03 OLLAMA SERVICE SAFE CONFIG ==='
          systemctl cat ollama.service 2>/dev/null \
            | grep -vEi 'token|secret|password|credential|api[_-]?key' | head -100 || true
          echo '=== P2OPS OLLAMA SUDO CAPABILITY ==='
          sudo -n -l 2>/dev/null | grep -E 'ollama|p2ops' | head -80 || true
        fi

        if [ "$(hostname -s)" = "compute-01" ]; then
          echo '=== REACH COMPUTE03 OLLAMA ==='
          curl -fsS --max-time 2 http://192.168.0.158:11434/api/tags 2>/dev/null \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); print("REMOTE_MODELS="+",".join(x.get("name","") for x in d.get("models",[])))' 2>/dev/null || echo REMOTE_OLLAMA_UNREACHABLE

          echo '=== HOOK RANKER OLLAMA CODE ==='
          sed -n '1,430p' /srv/compose/osho-worker/hook_ranker_v5.py 2>/dev/null \
            | grep -nE 'OLLAMA|urlopen|Request|def .*model|def .*score|for .*candidate|for .*anchor|timeout|model' | head -180 || true

          echo '=== BOUNDARY CONSENSUS OLLAMA CODE ==='
          sed -n '1,360p' /srv/compose/osho-worker/boundary_consensus.py 2>/dev/null \
            | grep -nE 'OLLAMA|MODELS|urlopen|Request|timeout|def .*model|for model' | head -140 || true
        fi
      args:
        executable: /bin/bash
      register: result
      changed_when: false
      failed_when: false

    - name: Show dual GPU readiness
      ansible.builtin.debug:
        msg: "{{ result.stdout_lines }}"
