---
- name: Inspect Project Osho boundary consensus inference path
  hosts: compute-01
  gather_facts: false
  tasks:
    - name: Read boundary consensus model and Ollama code
      ansible.builtin.shell: |
        set -o pipefail
        cd /srv/compose/osho-worker
        echo '=== MODEL AND URL REFERENCES ==='
        grep -nE 'qwen3:4b-instruct|llama3.1:8b|OLLAMA|api/chat|urlopen|timeout|def .*ollama|def .*model' boundary_consensus.py 2>/dev/null || true
        echo '=== RELEVANT SOURCE ==='
        sed -n '1,260p' boundary_consensus.py
      args:
        executable: /bin/bash
      register: result
      changed_when: false
      failed_when: false

    - name: Show boundary consensus path
      ansible.builtin.debug:
        msg: "{{ result.stdout_lines }}"
