---
- name: Trace Project Osho dual GPU request activity
  hosts: osho_nodes
  gather_facts: false
  tasks:
    - name: Inspect current ranker and remote inference activity
      ansible.builtin.shell: |
        set -o pipefail
        echo "HOST=$(hostname -s)"
        date -Ins
        echo '=== GPU SAMPLE ==='
        nvidia-smi --query-gpu=name,utilization.gpu,memory.used,memory.total,power.draw,temperature.gpu --format=csv,noheader 2>/dev/null || true

        if [ "$(hostname -s)" = "compute-01" ]; then
          echo '=== CURRENT RANKER ==='
          for pid in $(pgrep -f '^/usr/bin/python3 hook_ranker_v5.py|^/usr/bin/python3 /srv/compose/osho-worker/hook_ranker_v5.py' 2>/dev/null); do
            ps -p "$pid" -o pid=,lstart=,etime=,cmd= 2>/dev/null || true
          done

          echo '=== CURRENT SOURCE LOG FILES ==='
          find /srv/osho /srv/compose/osho-worker -type f \( -name '000010*hook*v5*.log' -o -name '000010*hook*.log' \) -printf '%T@ %p\n' 2>/dev/null \
            | sort -nr | head -8 | cut -d' ' -f2- | while read -r f; do
                echo "--- $f ---"
                tail -45 "$f" 2>/dev/null || true
              done

          echo '=== RECENT DUAL GPU MARKERS ANYWHERE ==='
          grep -RhsE 'DUAL GPU ENDPOINTS|MODEL WORKERS|compute-03|MODEL ENDPOINT FAILOVER' \
            /srv/osho /srv/compose/osho-worker 2>/dev/null | tail -60 || true
        fi

        if [ "$(hostname -s)" = "compute-03" ]; then
          echo '=== OLLAMA API ACTIVITY ==='
          journalctl -u ollama.service --since '10 minutes ago' --no-pager 2>/dev/null \
            | grep -E 'api/chat|POST|load|runner|qwen3:4b-instruct' | tail -80 || true

          echo '=== GPU 8-SECOND SAMPLE ==='
          for i in $(seq 1 8); do
            printf '%s ' "$(date +%H:%M:%S)"
            nvidia-smi --query-gpu=utilization.gpu,memory.used,power.draw --format=csv,noheader 2>/dev/null || true
            sleep 1
          done
        fi
      args:
        executable: /bin/bash
      register: result
      changed_when: false
      failed_when: false

    - name: Show dual GPU request activity
      ansible.builtin.debug:
        msg: "{{ result.stdout_lines }}"
