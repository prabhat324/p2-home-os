---
- name: Verify Project Osho Growth V1 deployment
  hosts: compute-01
  gather_facts: false
  tasks:
    - name: Inspect growth renderer and first artifact
      ansible.builtin.shell: |
        set -o pipefail
        cd /srv/compose/osho-worker
        echo "NOW=$(date -Ins)"
        echo '=== RENDER HELPER STATUS ==='
        if [ -x /usr/local/sbin/p2ops-osho-render-patch ]; then
          sudo -n /usr/local/sbin/p2ops-osho-render-patch status 2>&1 || true
        else
          echo 'RENDER_HELPER=missing'
        fi
        echo '=== LIVE GROWTH MARKERS ==='
        grep -nE 'OSHO_GROWTH_TEMPLATE_V1|osho-growth-v1|CAPTION_SIZE =|CTA_DURATION =|Roughly one new visual' production_renderer.py app.py | head -80 || true
        echo '=== PIPELINE ==='
        ps -eo pid,etimes,user,comm,args | awk '$3=="psquare" && $4=="python3" && ($0 ~ /osho_autopilot.py/ || $0 ~ /hook_ranker_v5.py/ || $0 ~ /retention_qa_v4.py/) {print}' || true
        echo '=== ACTIVE WORKER JOBS ==='
        python3 - <<'PY'
        import json,pathlib
        root=pathlib.Path('/srv/osho/work')
        terminal={'complete','completed','failed','cancelled','canceled','published','done'}
        active=[]
        for p in root.glob('*/job.json') if root.exists() else []:
            try: d=json.loads(p.read_text())
            except Exception: continue
            s=str(d.get('status') or d.get('stage') or '').lower()
            if s and s not in terminal: active.append((p.parent.name,s,d.get('source_id')))
        print('ACTIVE_COUNT='+str(len(active)))
        for row in active[:10]: print('ACTIVE_JOB='+'|'.join(str(x or '') for x in row))
        PY
        echo '=== FIRST GROWTH METADATA ==='
        python3 - <<'PY'
        import json,pathlib
        roots=[pathlib.Path('/srv/osho/metadata'),pathlib.Path('/srv/osho/work')]
        hits=[]
        for root in roots:
            if not root.exists(): continue
            for p in root.rglob('*.json'):
                try:
                    txt=p.read_text(errors='ignore')
                except Exception:
                    continue
                if 'osho-growth-v1' not in txt and 'OSHO_GROWTH_TEMPLATE_V1' not in txt:
                    continue
                try: d=json.loads(txt)
                except Exception: d={}
                hits.append((p.stat().st_mtime,p,d))
        hits.sort(key=lambda x:x[0])
        print('GROWTH_ARTIFACT_COUNT='+str(len(hits)))
        if hits:
            m,p,d=hits[0]
            print('FIRST_PATH='+str(p))
            print('FIRST_MTIME='+str(m))
            for k in ('source_id','reel_id','id','title','youtube_video_id','youtube_url','growth_template','production_profile','output'):
                if k in d: print(f'FIRST_{k.upper()}={d.get(k)}')
        for m,p,d in hits[-5:]:
            print('RECENT_GROWTH='+str(p))
        PY
        echo '=== RECENT PUBLISHED RECEIPTS ==='
        find /srv/osho -type f \( -iname '*receipt*.json' -o -path '*/published/*.json' \) -printf '%T@ %p\n' 2>/dev/null | sort -nr | head -12 || true
      args:
        executable: /bin/bash
      register: result
      changed_when: false
      failed_when: false

    - name: Show Growth V1 verification
      ansible.builtin.debug:
        msg: "{{ result.stdout_lines }}"

    - name: Diagnose dashboard current-job telemetry source
      ansible.builtin.shell: |
        set -o pipefail
        db=/srv/osho/library/catalog/catalog.sqlite
        echo '=== HEARTBEAT SERVICE ==='
        systemctl is-active osho-dashboard-heartbeat.service 2>/dev/null || true
        systemctl show osho-dashboard-heartbeat.service -p MainPID -p ActiveEnterTimestamp --no-pager 2>/dev/null || true
        echo '=== HEARTBEAT / AUTOPILOT PROCESSES ==='
        pgrep -af 'osho-dashboard-heartbeat|osho_autopilot|dashboard.*heartbeat' || true
        echo '=== DISCOURSES PROCESSING COLUMNS / ROWS ==='
        python3 - <<'PY'
        import sqlite3, pathlib
        p=pathlib.Path('/srv/osho/library/catalog/catalog.sqlite')
        if not p.exists():
            print('CATALOG=missing'); raise SystemExit
        conn=sqlite3.connect(f'file:{p}?mode=ro', uri=True)
        conn.row_factory=sqlite3.Row
        cols=[r['name'] for r in conn.execute('PRAGMA table_info(discourses)')]
        wanted=['source_id','title','processing_status','processing_phase','processing_worker','processing_job_id','processing_started_at']
        print('DISCOURSE_COLUMNS='+','.join(c for c in wanted if c in cols))
        present=[c for c in wanted if c in cols]
        if 'processing_status' in cols:
            q='SELECT '+','.join(present)+' FROM discourses WHERE lower(coalesce(processing_status,\'\'))=\'processing\' ORDER BY source_id LIMIT 10'
            rows=conn.execute(q).fetchall()
            print('DISCOURSE_PROCESSING_ROWS='+str(len(rows)))
            for r in rows: print('DISCOURSE_PROCESSING='+repr(dict(r)))
        print('=== AUTOPILOT STATE SCHEMA / ACTIVE ROWS ===')
        acols=[r['name'] for r in conn.execute('PRAGMA table_info(osho_autopilot_state)')]
        print('AUTOPILOT_COLUMNS='+','.join(acols))
        candidates=[c for c in ['source_id','status','stage','phase','progress','worker','job_id','updated_at','started_at','notes'] if c in acols]
        if candidates:
            where="lower(coalesce(status,'')) not in ('published','uploaded','failed','skipped','done','completed','complete')" if 'status' in acols else '1=1'
            q='SELECT '+','.join(candidates)+' FROM osho_autopilot_state WHERE '+where+' ORDER BY source_id LIMIT 15'
            rows=conn.execute(q).fetchall()
            print('AUTOPILOT_ACTIVE_ROWS='+str(len(rows)))
            for r in rows: print('AUTOPILOT_ACTIVE='+repr(dict(r)))
        conn.close()
        PY
        echo '=== DASHBOARD VIEW FROM COMPUTE-01 ==='
        curl -fsS --max-time 5 http://192.168.0.88:8787/api/dashboard 2>/dev/null | python3 -c '
        import json,sys
        try:d=json.load(sys.stdin)
        except Exception as e: print("DASHBOARD_PARSE_ERROR="+str(e)); raise SystemExit
        print("SUMMARY="+repr(d.get("summary")))
        print("CURRENT_JOB="+repr(d.get("current_job")))
        print("WORKERS="+repr([(w.get("name"),w.get("current_job"),w.get("stage"),w.get("progress"),w.get("telemetry_state")) for w in d.get("workers",[])]))
        '
      args:
        executable: /bin/bash
      register: progress_diag
      changed_when: false
      failed_when: false

    - name: Show dashboard current-job telemetry diagnosis
      ansible.builtin.debug:
        msg: "{{ progress_diag.stdout_lines }}"
