---
- name: Locate Project Osho worker job-state files
  hosts: compute-01
  gather_facts: false
  tasks:
    - name: Read worker job path helpers and live state files
      ansible.builtin.shell: |
        set -o pipefail
        cd /srv/compose/osho-worker
        echo "NOW=$(date -Ins)"
        echo '=== JOB PATH HELPERS ==='
        grep -nE 'def job_path|def write_job|JOB.*DIR|JOBS|job_path\(' app.py | head -120 || true
        echo '=== CONTEXT AROUND job_path ==='
        line=$(grep -n '^def job_path' app.py | head -1 | cut -d: -f1)
        [ -n "$line" ] && sed -n "$((line-15)),$((line+60))p" app.py || true
        echo '=== POSSIBLE JOB JSON FILES ==='
        find /srv/osho /srv/compose/osho-worker -maxdepth 4 -type f -name 'OSHO-*.json' -printf '%T@ %p\n' 2>/dev/null | sort -nr | head -30 || true
      args:
        executable: /bin/bash
      register: result
      changed_when: false
      failed_when: false

    - name: Show worker job-state locations
      ansible.builtin.debug:
        msg: "{{ result.stdout_lines }}"
