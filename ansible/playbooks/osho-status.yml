---
- name: Inspect Project Osho rendering and metadata pipeline
  hosts: compute-01
  gather_facts: false
  tasks:
    - name: Inspect renderer files, functions, and recent artifacts
      ansible.builtin.shell: |
        set -o pipefail
        cd /srv/compose/osho-worker
        echo "NOW=$(date -Ins)"
        echo '=== RENDER/METADATA FILES ==='
        find . -maxdepth 2 -type f \( \
          -iname '*render*' -o -iname '*reel*' -o -iname '*caption*' -o \
          -iname '*subtitle*' -o -iname '*metadata*' -o -iname '*upload*' \
        \) -printf '%p\n' | sort | head -120
        echo '=== CODE REFERENCES ==='
        grep -RInE --include='*.py' 'ffmpeg|drawtext|subtitles=|ass=|caption|subtitle|1080|1920|crop=|scale=|zoom|loudnorm|metadata|title|description|hashtags' . \
          | grep -vE '/backups?/|\.backup|__pycache__' \
          | head -260 || true
        echo '=== AUTOPILOT RENDER BLOCKS ==='
        grep -nE 'render|reel|caption|subtitle|metadata|upload' osho_autopilot.py | head -120 || true
        echo '=== RECENT RENDERS ==='
        find /srv/osho -type f \( -name '*.mp4' -o -name '*.ass' -o -name '*.srt' \) -printf '%T@ %p %s bytes\n' 2>/dev/null \
          | sort -nr | head -30
        echo '=== RECENT METADATA JSON ==='
        find /srv/osho -type f -name '*.json' -printf '%T@ %p\n' 2>/dev/null \
          | sort -nr | grep -Ei 'metadata|publish|reel|render|candidate' | head -30 || true
      args:
        executable: /bin/bash
      register: result
      changed_when: false
      failed_when: false

    - name: Show renderer inspection
      ansible.builtin.debug:
        msg: "{{ result.stdout_lines }}"
