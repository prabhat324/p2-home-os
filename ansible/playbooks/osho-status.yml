---
- name: Capture exact Project Osho boundary review block
  hosts: compute-01
  gather_facts: false
  tasks:
    - name: Read exact imports request and review loop
      ansible.builtin.shell: |
        set -o pipefail
        cd /srv/compose/osho-worker
        echo '=== IMPORTS AND CONSTANTS ==='
        sed -n '1,28p' boundary_consensus.py
        echo '=== ASK MODEL EXACT ==='
        start=$(grep -n '^def ask_model(' boundary_consensus.py | head -1 | cut -d: -f1)
        end=$(grep -n '^def validate_opening(' boundary_consensus.py | head -1 | cut -d: -f1)
        if [ -n "$start" ] && [ -n "$end" ]; then
          sed -n "${start},$((end-1))p" boundary_consensus.py
        fi
        echo '=== REVIEW LOOP EXACT ==='
        start=$(grep -n '^    results = \[\]' boundary_consensus.py | tail -1 | cut -d: -f1)
        end=$(grep -n '^    usable = \[' boundary_consensus.py | tail -1 | cut -d: -f1)
        if [ -n "$start" ] && [ -n "$end" ]; then
          sed -n "${start},$((end-1))p" boundary_consensus.py
        fi
      args:
        executable: /bin/bash
      register: result
      changed_when: false
      failed_when: false

    - name: Show exact boundary blocks
      ansible.builtin.debug:
        msg: "{{ result.stdout_lines }}"
