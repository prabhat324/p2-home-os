---
- name: Inspect Project Osho caption and scene timing functions
  hosts: compute-01
  gather_facts: false
  tasks:
    - name: Read exact caption and semantic beat logic
      ansible.builtin.shell: |
        set -o pipefail
        cd /srv/compose/osho-worker
        echo "NOW=$(date -Ins)"
        echo '=== CONSTANTS ==='
        sed -n '1,40p' production_renderer.py
        echo '=== MAKE CENTER ASS ==='
        start=$(grep -n '^def make_center_ass(' production_renderer.py | head -1 | cut -d: -f1)
        end=$(grep -n '^def safe_run(' production_renderer.py | head -1 | cut -d: -f1)
        [ -n "$start" ] && [ -n "$end" ] && sed -n "${start},$((end-1))p" production_renderer.py
        echo '=== SEMANTIC BEATS ==='
        start=$(grep -n '^def semantic_beats(' production_renderer.py | head -1 | cut -d: -f1)
        end=$(grep -n '^def semantic_query(' production_renderer.py | head -1 | cut -d: -f1)
        [ -n "$start" ] && [ -n "$end" ] && sed -n "${start},$((end-1))p" production_renderer.py
        echo '=== RENDER CALLERS ==='
        grep -RInE --include='*.py' 'make_center_ass\(|render_production_reel\(' . | grep -vE '/backups?/|\.bak|\.backup' | head -80 || true
      args:
        executable: /bin/bash
      register: result
      changed_when: false
      failed_when: false

    - name: Show caption and scene timing functions
      ansible.builtin.debug:
        msg: "{{ result.stdout_lines }}"
