---
- name: Verify Project Osho worker job-file host path
  hosts: compute-01
  gather_facts: false
  tasks:
    - name: Inspect WORK constant and persisted job states
      ansible.builtin.shell: |
        set -o pipefail
        cd /srv/compose/osho-worker
        echo "NOW=$(date -Ins)"
        echo '=== WORK CONSTANT ==='
        grep -nE '^WORK[[:space:]]*=|OSHO.*WORK|/data/work|/srv/osho/work' app.py | head -40 || true
        echo '=== HOST JOB FILES ==='
        python3 - <<'PY'
        import json, pathlib
        roots=[pathlib.Path('/srv/osho/work'), pathlib.Path('/srv/compose/osho-worker/work')]
        terminal={'complete','completed','failed','cancelled','canceled','published','done'}
        for root in roots:
            files=sorted(root.glob('*/job.json'), key=lambda p:p.stat().st_mtime, reverse=True) if root.exists() else []
            print(f'ROOT={root} EXISTS={root.exists()} JOB_FILES={len(files)}')
            active=[]
            for p in files[:20]:
                try: d=json.loads(p.read_text())
                except Exception: continue
                status=str(d.get('status') or d.get('stage') or '').lower()
                print(f'JOB={p.parent.name}|status={status}|mtime={p.stat().st_mtime}')
                if status and status not in terminal: active.append(p.parent.name+':'+status)
            print('ACTIVE=' + (','.join(active) if active else 'none'))
        PY
      args:
        executable: /bin/bash
      register: result
      changed_when: false
      failed_when: false

    - name: Show worker job-file state
      ansible.builtin.debug:
        msg: "{{ result.stdout_lines }}"
