---
- name: Inspect Project Osho rendering and growth-editing pipeline
  hosts: compute-01
  gather_facts: false
  tasks:
    - name: Inspect live renderer, captions, reframing, audio, metadata, and upload code
      ansible.builtin.shell: |
        set -o pipefail
        cd /srv/compose/osho-worker
        echo "NOW=$(date -Ins)"
        echo '=== PIPELINE FILES ==='
        find . -maxdepth 2 -type f \( -name '*.py' -o -name '*.sh' \) -printf '%p\n' | sort

        echo '=== RENDER / CAPTION / EDIT REFERENCES ==='
        grep -RniE --include='*.py' --include='*.sh' \
          'ffmpeg|subtitle|caption|ass|drawtext|crop|scale|1080|1920|reel|render|zoom|loudnorm|audio|fade|overlay|font|vertical' . \
          | head -260 || true

        echo '=== AUTOPILOT RENDER CALLS ==='
        grep -nE 'render|reel|caption|subtitle|metadata|title|upload|ffmpeg' osho_autopilot.py | head -180 || true

        echo '=== CANDIDATE RENDERER FILES ==='
        for f in $(grep -RIlE --include='*.py' 'ffmpeg|drawtext|subtitles|1080:1920|1920|render' . | head -12); do
          echo "----- FILE: $f -----"
          sed -n '1,260p' "$f" | head -260
        done

        echo '=== RECENT OUTPUT PROBE ==='
        latest=$(find /srv/osho -type f -name '*.mp4' -printf '%T@ %p\n' 2>/dev/null | sort -nr | head -1 | cut -d' ' -f2-)
        if [ -n "$latest" ]; then
          echo "LATEST_MP4=$latest"
          ffprobe -v error -show_entries format=duration:stream=index,codec_type,codec_name,width,height,r_frame_rate,bit_rate -of json "$latest" 2>/dev/null || true
        fi
      args:
        executable: /bin/bash
      register: result
      changed_when: false
      failed_when: false

    - name: Show render-growth inspection
      ansible.builtin.debug:
        msg: "{{ result.stdout_lines }}"
