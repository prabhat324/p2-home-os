---
- name: Inspect Project Osho worker job-state internals
  hosts: compute-01
  gather_facts: false
  tasks:
    - name: Read worker job routes and state storage
      ansible.builtin.shell: |
        set -o pipefail
        cd /srv/compose/osho-worker
        echo "NOW=$(date -Ins)"
        echo '=== JOB ROUTES ==='
        sed -n '1920,2075p' app.py
        echo '=== JOB STATE SYMBOLS ==='
        grep -nE '(^|[^A-Za-z_])(jobs|JOBS|job_state|job_status|active_job|current_job|JOB_)' app.py | head -160 || true
        echo '=== RECENT WORKER LOGS ==='
        docker logs --tail 120 osho-worker 2>&1 | tail -120 || true
      args:
        executable: /bin/bash
      register: result
      changed_when: false
      failed_when: false

    - name: Show worker job-state internals
      ansible.builtin.debug:
        msg: "{{ result.stdout_lines }}"
