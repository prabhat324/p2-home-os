---
- name: Dry-run Project Osho growth template manifest
  hosts: compute-01
  gather_facts: false
  tasks:
    - name: Validate every growth replacement against live source
      ansible.builtin.shell: |
        set -o pipefail
        cd /srv/compose/osho-worker
        echo "NOW=$(date -Ins)"
        tmp=$(mktemp)
        trap 'rm -f "$tmp"' EXIT
        curl -fsSL --max-time 15 "https://raw.githubusercontent.com/prabhat324/p2-home-os/master/services/osho-render-managed/patches.json?cb=$(date +%s)" -o "$tmp"
        python3 - "$tmp" /srv/compose/osho-worker <<'PY'
        import json, pathlib, sys
        manifest=json.load(open(sys.argv[1],encoding='utf-8'))
        code=pathlib.Path(sys.argv[2])
        ok=True
        print('PATCH_COUNT=' + str(len(manifest.get('patches',[]))))
        for patch in manifest.get('patches',[]):
            print('PATCH=' + str(patch.get('id')))
            marker=patch.get('marker',''); marker_file=patch.get('marker_file','')
            marker_text=(code/marker_file).read_text(encoding='utf-8')
            print('MARKER_PRESENT=' + ('yes' if marker and marker in marker_text else 'no'))
            for i,item in enumerate(patch.get('replacements',[]),1):
                name=item['file']; expected=item.get('count',1)
                text=(code/name).read_text(encoding='utf-8')
                actual=text.count(item['old'])
                print(f'REPLACEMENT_{i}={name}|expected={expected}|actual={actual}')
                if actual != expected: ok=False
        print('DRY_RUN=' + ('pass' if ok else 'fail'))
        if not ok: raise SystemExit(7)
        PY
        echo '=== HELPER STATE ==='
        if [ -x /usr/local/sbin/p2ops-osho-render-patch ]; then
          echo 'RENDER_HELPER=installed'
          sudo -n /usr/local/sbin/p2ops-osho-render-patch status 2>&1 || true
        else
          echo 'RENDER_HELPER=not-installed'
        fi
        echo '=== PIPELINE ==='
        ps -eo pid,etimes,user,comm,args | awk '$3=="psquare" && $4=="python3" && ($0 ~ /osho_autopilot.py/ || $0 ~ /hook_ranker_v5.py/ || $0 ~ /retention_qa_v4.py/) {print}' || true
      args:
        executable: /bin/bash
      register: result
      changed_when: false
      failed_when: false

    - name: Show growth manifest dry-run
      ansible.builtin.debug:
        msg: "{{ result.stdout_lines }}"
