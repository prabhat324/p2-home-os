---
- name: Locate Project Osho ranker scoring loops
  hosts: compute-01
  gather_facts: false
  tasks:
    - name: Inspect exact scoring loops
      ansible.builtin.shell: |
        set -o pipefail
        cd /srv/compose/osho-worker
        echo '=== LOOP MARKERS ==='
        grep -nE 'HOOK [0-9]|HOOK \{|FULL CLIPS TO SCORE|CLIP [0-9]|CLIP \{|model_score_anchor\(|model_score_clip\(|score_clip\(|anchor_pool|scored_anchors|survivors' hook_ranker_v5.py 2>/dev/null || true
        echo '=== MAIN TAIL 1200-1873 ==='
        sed -n '1200,1873p' hook_ranker_v5.py 2>/dev/null || true
      args:
        executable: /bin/bash
      register: result
      changed_when: false
      failed_when: false

    - name: Show exact scoring loops
      ansible.builtin.debug:
        msg: "{{ result.stdout_lines }}"
