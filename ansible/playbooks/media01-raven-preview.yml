---
- name: Render Raven podcast 60-second speaker-caption proof V3
  hosts: media-01
  gather_facts: false
  vars:
    source: /srv/media-production/inbox/raven-podcast-01/master.mp4
    clip: /srv/media-production/work/raven-podcast-01-preview/source-60s.mp4
    base_transcript: /srv/media-production/work/raven-podcast-01-preview/analysis-v2/transcript.json
    analysis: /srv/media-production/work/raven-podcast-01-preview/analysis-v3
    transcript: /srv/media-production/work/raven-podcast-01-preview/analysis-v3/transcript.json
    manifest: /srv/media-production/work/raven-podcast-01-preview/preview-manifest-v3.json
    ass: /srv/media-production/review/raven-podcast-01/speaker-captions-60s-v3.ass
    assignments: /srv/media-production/review/raven-podcast-01/speaker-assignments-60s-v3.json
    output: /srv/media-production/review/raven-podcast-01/preview-60s-captioned-v3.mp4
  tasks:
    - name: Verify source and first-minute working files exist
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - "{{ source }}"
        - "{{ clip }}"
        - "{{ base_transcript }}"
      register: required
      failed_when: not required.stat.exists

    - name: Deploy V3 caption tools
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../../services/media01/{{ item }}"
        dest: "/home/p2ops/media01/{{ item }}"
        mode: "0755"
      loop:
        - podcast_captions.py
        - transcript_patch.py

    - name: Verify V3 tool syntax
      ansible.builtin.command:
        argv:
          - /home/p2ops/media01/venv-v2/bin/python
          - -m
          - py_compile
          - "/home/p2ops/media01/{{ item }}"
      loop:
        - podcast_captions.py
        - transcript_patch.py
      changed_when: false

    - name: Create V3 analysis directory
      ansible.builtin.file:
        path: "{{ analysis }}"
        state: directory
        mode: "0775"

    - name: Recover skipped Raven sentence and trim duplicate ASR tail
      ansible.builtin.command:
        argv:
          - /home/p2ops/media01/venv-v2/bin/python
          - /home/p2ops/media01/transcript_patch.py
          - "{{ base_transcript }}"
          - "{{ transcript }}"
          - --insert-start
          - "23.68"
          - --insert-end
          - "30.28"
          - --insert-text
          - "I moved to Wasaga Beach in 2016 after a long marriage."
          - --trim-segment-start
          - "30.0"
          - --trim-through
          - "30.31"
          - --source-note
          - "targeted non-silent 22-31 second CPU Whisper recovery, reviewed against interview context"
      register: transcript_patch
      changed_when: true

    - name: Write V3 caption manifest
      ansible.builtin.copy:
        dest: "{{ manifest }}"
        mode: "0644"
        content: |
          {
            "mode": "podcast",
            "language": "en",
            "podcast_captions": {
              "enabled": true,
              "show_speaker_names": false,
              "words_per_caption": 8,
              "font": "DejaVu Sans",
              "font_size": 72,
              "margin_v": 48,
              "outline": 2.8,
              "shadow": 4.0,
              "shadow_alpha": "20",
              "outline_alpha": "30",
              "text_color": "#000000",
              "analysis_fps": 5.0,
              "analysis_width": 640,
              "initial_speaker": "right",
              "confidence_threshold": 0.055,
              "turn_switch_confidence": 0.28,
              "close_turn_switch_confidence": 0.38,
              "close_turn_gap_seconds": 1.0,
              "bridge_caption_gap_seconds": 0.55,
              "caption_tail_pad_seconds": 0.12,
              "caption_lead_pad_seconds": 0.04,
              "speaker_overrides": [
                {"start": 0.0, "end": 23.20, "side": "right", "reason": "reviewed Prabhat intro and complete question turn"},
                {"start": 23.50, "end": 60.30, "side": "left", "reason": "reviewed Raven answer turn"}
              ],
              "left": {"name": "Raven", "text_color": "#000000", "shadow_color": "#8EF2A0"},
              "right": {"name": "Prabhat", "text_color": "#000000", "shadow_color": "#8FD6FF"}
            }
          }

    - name: Clear only V3 proof outputs
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ ass }}"
        - "{{ assignments }}"
        - "{{ output }}"

    - name: Generate V3 speaker-turn captions
      ansible.builtin.command:
        argv:
          - /home/p2ops/media01/venv-v2/bin/python
          - /home/p2ops/media01/podcast_captions.py
          - "{{ clip }}"
          - --transcript
          - "{{ transcript }}"
          - --manifest
          - "{{ manifest }}"
          - --ass
          - "{{ ass }}"
          - --assignments
          - "{{ assignments }}"
      register: caption_generation
      changed_when: true

    - name: Enforce V3 colour, recovered-speech, and coverage contracts
      ansible.builtin.shell: |
        set -euo pipefail
        jq -e '([.cues[] | select(.start < 23.2 and .side != "right")] | length) == 0' "{{ assignments }}" >/dev/null
        jq -e '([.cues[] | select(.start >= 23.5 and .side != "left")] | length) == 0' "{{ assignments }}" >/dev/null
        jq -e '([.cues[] | select(.recovered == true)] | length) > 0' "{{ assignments }}" >/dev/null
        jq -e 'any(.cues[]; (.recovered == true) and (.text | contains("moved to Wasaga Beach in 2016")))' "{{ assignments }}" >/dev/null
        jq -e '(.caption_gaps_over_0_60s | length) == 0' "{{ assignments }}" >/dev/null
        grep -q '^Style: Left,.*&H00000000,&H00000000,' "{{ ass }}"
        grep -q '^Style: Right,.*&H00000000,&H00000000,' "{{ ass }}"
      args:
        executable: /bin/bash
      changed_when: false

    - name: Burn V3 black captions with speaker-coloured shadows
      ansible.builtin.shell: |
        set -euo pipefail
        rm -f "{{ output }}.partial.mp4"
        ffmpeg -nostdin -hide_banner -loglevel error -y -i "{{ clip }}" \
          -vf "ass='{{ ass }}'" \
          -map 0:v:0 -map 0:a:0 \
          -c:v h264_nvenc -preset p6 -tune hq -rc vbr -cq 18 -b:v 30M -maxrate 45M -bufsize 90M -profile:v high \
          -c:a copy -movflags +faststart "{{ output }}.partial.mp4"
        mv "{{ output }}.partial.mp4" "{{ output }}"
      args:
        executable: /bin/bash
      changed_when: true

    - name: Validate V3 output file
      ansible.builtin.shell: |
        set -euo pipefail
        test -s "{{ output }}"
        d="$(ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 "{{ output }}")"
        awk -v d="$d" 'BEGIN { if (d < 59.0 || d > 60.5) exit 1 }'
        echo "duration=$d"
        du -h "{{ output }}"
        jq '{captions:(.cues|length),turns:(.turns|length),prabhat_right:([.cues[]|select(.side=="right")]|length),raven_left:([.cues[]|select(.side=="left")]|length),recovered:([.cues[]|select(.recovered==true)]|length),gaps:.caption_gaps_over_0_60s}' "{{ assignments }}"
      args:
        executable: /bin/bash
      register: proof
      changed_when: false

    - name: Report Raven V3 caption proof
      ansible.builtin.debug:
        msg:
          transcript_patch: "{{ transcript_patch.stdout }}"
          caption_generation: "{{ caption_generation.stdout }}"
          proof: "{{ proof.stdout }}"
          preview: "{{ output }}"
