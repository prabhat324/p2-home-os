---
- name: Render Raven podcast 60-second speaker-caption proof V2
  hosts: media-01
  gather_facts: false
  vars:
    source: /srv/media-production/inbox/raven-podcast-01/master.mp4
    work: /srv/media-production/work/raven-podcast-01-preview
    review: /srv/media-production/review/raven-podcast-01
    clip: /srv/media-production/work/raven-podcast-01-preview/source-60s.mp4
    clip_partial: /srv/media-production/work/raven-podcast-01-preview/source-60s.partial.mp4
    manifest: /srv/media-production/work/raven-podcast-01-preview/preview-manifest-v2.json
    analysis: /srv/media-production/work/raven-podcast-01-preview/analysis-v2
    ass: /srv/media-production/review/raven-podcast-01/speaker-captions-60s-v2.ass
    assignments: /srv/media-production/review/raven-podcast-01/speaker-assignments-60s-v2.json
    output: /srv/media-production/review/raven-podcast-01/preview-60s-captioned-v2.mp4
  tasks:
    - name: Verify uploaded Raven source exists
      ansible.builtin.stat:
        path: "{{ source }}"
      register: raven_source
      failed_when: not raven_source.stat.exists or raven_source.stat.size | int < 1048576

    - name: Deploy current podcast caption and transcription components
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../../services/media01/{{ item }}"
        dest: "/home/p2ops/media01/{{ item }}"
        mode: "0755"
      loop:
        - podcast_captions.py
        - content_analyzer.py

    - name: Verify caption and transcription syntax
      ansible.builtin.command:
        argv:
          - /home/p2ops/media01/venv-v2/bin/python
          - -m
          - py_compile
          - "/home/p2ops/media01/{{ item }}"
      loop:
        - podcast_captions.py
        - content_analyzer.py
      changed_when: false

    - name: Create isolated preview directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0775"
      loop:
        - "{{ work }}"
        - "{{ review }}"
        - "{{ analysis }}"

    - name: Create exactly first 60 seconds without changing master
      ansible.builtin.shell: |
        set -euo pipefail
        rm -f "{{ clip_partial }}"
        ffmpeg -nostdin -hide_banner -loglevel error -y -i "{{ source }}" -t 60 \
          -map 0:v:0 -map 0:a:0 -c copy -movflags +faststart "{{ clip_partial }}"
        mv "{{ clip_partial }}" "{{ clip }}"
        d="$(ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 "{{ clip }}")"
        python3 - "$d" <<'PY'
        import sys
        d=float(sys.argv[1])
        if not 59.0 <= d <= 60.5: raise SystemExit(f'Preview duration out of range: {d}')
        print(f'preview source duration={d:.3f}')
        PY
      args:
        executable: /bin/bash
      register: clip_result
      changed_when: true

    - name: Write V2 caption proof manifest
      ansible.builtin.copy:
        dest: "{{ manifest }}"
        mode: "0644"
        content: |
          {
            "mode": "podcast",
            "language": "en",
            "podcast_captions": {
              "enabled": true,
              "show_speaker_names": false,
              "words_per_caption": 8,
              "font": "DejaVu Sans",
              "font_size": 72,
              "margin_v": 48,
              "outline": 2.8,
              "shadow": 4.0,
              "shadow_alpha": "20",
              "outline_alpha": "30",
              "text_color": "#000000",
              "analysis_fps": 5.0,
              "analysis_width": 640,
              "face_motion_detection": true,
              "face_scan_seconds": 30,
              "face_scan_fps": 1.0,
              "initial_speaker": "right",
              "confidence_threshold": 0.075,
              "speaker_hold_seconds": 2.5,
              "isolated_flip_confidence": 0.34,
              "short_run_seconds": 2.0,
              "short_run_confidence": 0.30,
              "bridge_caption_gap_seconds": 0.30,
              "caption_tail_pad_seconds": 0.12,
              "caption_lead_pad_seconds": 0.04,
              "left": {
                "name": "Raven",
                "text_color": "#000000",
                "shadow_color": "#8EF2A0"
              },
              "right": {
                "name": "Prabhat",
                "text_color": "#000000",
                "shadow_color": "#8FD6FF"
              }
            }
          }

    - name: Clear only old V2 first-minute proof artifacts
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ analysis }}/transcript.json"
        - "{{ analysis }}/content-report.json"
        - "{{ ass }}"
        - "{{ assignments }}"
        - "{{ output }}"

    - name: Transcribe first 60 seconds with GPU Whisper without VAD suppression
      ansible.builtin.command:
        argv:
          - /home/p2ops/media01/venv-v2/bin/python
          - /home/p2ops/media01/content_analyzer.py
          - "{{ clip }}"
          - --output-dir
          - "{{ analysis }}"
          - --model
          - large-v3-turbo
          - --language
          - en
          - --disable-vad
      register: transcription
      changed_when: true

    - name: Generate face-mouth speaker caption ASS
      ansible.builtin.command:
        argv:
          - /home/p2ops/media01/venv-v2/bin/python
          - /home/p2ops/media01/podcast_captions.py
          - "{{ clip }}"
          - --transcript
          - "{{ analysis }}/transcript.json"
          - --manifest
          - "{{ manifest }}"
          - --ass
          - "{{ ass }}"
          - --assignments
          - "{{ assignments }}"
      register: caption_generation
      changed_when: true

    - name: Verify V2 ASS uses black primary text and colored speaker shadows
      ansible.builtin.shell: |
        set -euo pipefail
        grep -q '^Style: Left,.*&H00000000,&H00000000,' "{{ ass }}"
        grep -q '^Style: Right,.*&H00000000,&H00000000,' "{{ ass }}"
        grep -q '^Style: Left,.*&H20' "{{ ass }}"
        grep -q '^Style: Right,.*&H20' "{{ ass }}"
      args:
        executable: /bin/bash
      changed_when: false

    - name: Burn V2 captions into first-minute proof
      ansible.builtin.shell: |
        set -euo pipefail
        rm -f "{{ output }}.partial.mp4"
        ffmpeg -nostdin -hide_banner -loglevel error -y -i "{{ clip }}" \
          -vf "ass='{{ ass }}'" \
          -map 0:v:0 -map 0:a:0 \
          -c:v h264_nvenc -preset p6 -tune hq -rc vbr -cq 18 -b:v 30M -maxrate 45M -bufsize 90M -profile:v high \
          -c:a copy -movflags +faststart "{{ output }}.partial.mp4"
        mv "{{ output }}.partial.mp4" "{{ output }}"
      args:
        executable: /bin/bash
      changed_when: true

    - name: Validate V2 preview and summarize coverage and speaker assignments
      ansible.builtin.shell: |
        set -euo pipefail
        /home/p2ops/media01/venv-v2/bin/python - <<'PY'
        import json,subprocess
        from pathlib import Path
        out=Path('{{ output }}'); ass=Path('{{ ass }}'); assignments=Path('{{ assignments }}'); transcript=Path('{{ analysis }}/transcript.json')
        if not out.exists() or out.stat().st_size < 1024*1024: raise SystemExit('Preview output missing or too small')
        a=json.load(open(assignments)); cues=a.get('cues',[]); t=json.load(open(transcript))
        if not cues: raise SystemExit('No caption cues generated')
        if t.get('vad_filter') is not False: raise SystemExit('V2 proof did not disable VAD')
        duration=float(subprocess.check_output(['ffprobe','-v','error','-show_entries','format=duration','-of','default=nw=1:nk=1',str(out)],text=True).strip())
        if not 59.0 <= duration <= 60.5: raise SystemExit(f'Output duration out of range: {duration}')
        repaired=[c for c in cues if c.get('speaker_repair')]
        gaps=a.get('caption_gaps_over_0_35s',[])
        print(json.dumps({
          'preview':str(out),
          'duration_seconds':round(duration,3),
          'size_mb':round(out.stat().st_size/1024/1024,1),
          'transcript_segments':len(t.get('segments',[])),
          'vad_filter':t.get('vad_filter'),
          'captions':len(cues),
          'raven_left':sum(c.get('side')=='left' for c in cues),
          'prabhat_right':sum(c.get('side')=='right' for c in cues),
          'low_confidence':sum(float(c.get('speaker_confidence',0))<0.075 for c in cues),
          'speaker_repairs':len(repaired),
          'caption_gaps_over_0_35s':gaps,
          'analysis_mode':a.get('analysis_regions',{}).get('mode'),
          'analysis_regions':a.get('analysis_regions'),
          'caption_file':str(ass),
          'speaker_assignments':str(assignments)
        },indent=2))
        PY
      args:
        executable: /bin/bash
      register: proof_summary
      changed_when: false

    - name: Report Raven V2 caption proof
      ansible.builtin.debug:
        msg:
          clip: "{{ clip_result.stdout }}"
          transcription: "{{ transcription.stdout }}"
          caption_generation: "{{ caption_generation.stdout }}"
          proof: "{{ proof_summary.stdout }}"
