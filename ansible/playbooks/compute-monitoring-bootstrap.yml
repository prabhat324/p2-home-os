---
- name: Install unprivileged Glances monitoring on compute-03
  hosts: compute-03
  gather_facts: false
  tasks:
    - name: Install and start Glances under p2ops
      ansible.builtin.shell: |
        set -euo pipefail
        base="$HOME/.local/opt/glances-monitor"
        venv="$base/venv"
        bin="$HOME/.local/bin"
        start="$bin/start-glances-web"
        log="$HOME/.local/state/glances-web.log"
        mkdir -p "$base" "$bin" "$HOME/.local/state"

        if [ ! -x "$venv/bin/python" ]; then
          python3 -m venv "$venv"
        fi

        "$venv/bin/python" -m pip install --upgrade pip setuptools wheel
        "$venv/bin/python" -m pip install --upgrade 'glances[web,gpu]'

        cat > "$start" <<'SH'
        #!/usr/bin/env bash
        set -euo pipefail
        VENV="$HOME/.local/opt/glances-monitor/venv"
        LOG="$HOME/.local/state/glances-web.log"
        if pgrep -u "$(id -u)" -f "$VENV/bin/glances.*-w.*61208" >/dev/null 2>&1; then
          exit 0
        fi
        nohup "$VENV/bin/glances" -w -B 0.0.0.0 -p 61208 >>"$LOG" 2>&1 </dev/null &
        SH
        chmod 0755 "$start"

        current="$(crontab -l 2>/dev/null || true)"
        filtered="$(printf '%s\n' "$current" | grep -v 'start-glances-web' || true)"
        { printf '%s\n' "$filtered"; echo '@reboot $HOME/.local/bin/start-glances-web'; } | sed '/^[[:space:]]*$/d' | crontab -

        "$start"

        for i in $(seq 1 30); do
          if curl -fsS --max-time 2 http://127.0.0.1:61208/api/4/status >/dev/null 2>&1; then
            break
          fi
          sleep 1
        done

        echo "STATUS=$(curl -fsS --max-time 5 http://127.0.0.1:61208/api/4/status)"
        echo "CPU=$(curl -fsS --max-time 5 http://127.0.0.1:61208/api/4/cpu | head -c 500)"
        echo "MEM=$(curl -fsS --max-time 5 http://127.0.0.1:61208/api/4/mem | head -c 500)"
        echo "GPU=$(curl -fsS --max-time 5 http://127.0.0.1:61208/api/4/gpu | head -c 1000 || true)"
        echo "PORT=$(ss -lnt | awk '$4 ~ /:61208$/ {print $4; exit}')"
        echo "CRON=$(crontab -l 2>/dev/null | grep 'start-glances-web' || true)"
      args:
        executable: /bin/bash
      register: monitoring
      changed_when: true

    - name: Show monitoring bootstrap result
      ansible.builtin.debug:
        msg: "{{ monitoring.stdout_lines }}"
