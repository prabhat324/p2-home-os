---
- name: Deploy Project Osho 29-minute publisher gate
  hosts: compute-01
  gather_facts: false
  tasks:
    - name: Apply publisher patch through existing privileged idle-safe helper
      ansible.builtin.shell: |
        set -euo pipefail
        sudo -n /usr/local/sbin/p2ops-osho-render-patch apply-if-idle

        echo '=== PUBLISHER GATE VERIFY ==='
        grep -n 'OSHO_GLOBAL_UPLOAD_MIN_INTERVAL_V1\|YOUTUBE GLOBAL COOLDOWN' \
          /srv/compose/osho-worker/app.py
        python3 -m py_compile /srv/compose/osho-worker/app.py
        echo 'APP_PY_COMPILE=ok'

        echo "AUTOPILOT_SERVICE=$(systemctl is-active osho-autopilot.service 2>/dev/null || true)"
        echo -n 'WORKER_HEALTH='
        curl -fsS http://127.0.0.1:8800/health
      args:
        executable: /bin/bash
      register: fix
      changed_when: true

    - name: Show publisher fix result
      ansible.builtin.debug:
        msg: "{{ fix.stdout_lines }}"
