---
- name: Trace Project Osho Growth V1 handoff on compute-01
  hosts: compute-01
  gather_facts: false
  tasks:
    - name: Inspect live selection to render handoff
      ansible.builtin.shell: |
        set -o pipefail
        cd /srv/compose/osho-worker
        echo "NOW=$(date -Ins)"
        echo '=== AUTOPILOT RENDER REFERENCES ==='
        grep -nEi 'render|production_renderer|/jobs|8800|ready_to_upload|ready|approved|approval|retention|metadata' osho_autopilot.py | head -360 || true
        echo '=== AUTOPILOT RENDER CONTEXT ==='
        python3 - <<'PY'
        from pathlib import Path
        p=Path('osho_autopilot.py')
        lines=p.read_text(errors='ignore').splitlines()
        needles=('render','ready_to_upload','production_renderer','retention_qa','approval','approved','job.json','8800')
        hits=[i for i,l in enumerate(lines) if any(n in l.lower() for n in needles)]
        shown=[]
        for i in hits:
            a=max(0,i-10); b=min(len(lines),i+22)
            if any(abs(a-x[0])<8 for x in shown): continue
            shown.append((a,b))
            print(f'--- L{a+1}-L{b} ---')
            for n in range(a,b): print(f'{n+1}: {lines[n]}')
        PY
        echo '=== RENDERER ENTRYPOINTS ==='
        grep -nEi 'def .*render|@app\.(post|get).*render|production_renderer|render_production|render_job|growth' app.py production_renderer.py | head -320 || true
        echo '=== RECENT APPROVAL / READY FILES ==='
        find /srv/osho -type f \( -iname '*approved*' -o -iname '*candidate*.json' -o -iname '*metadata*.json' -o -name 'job.json' \) -printf '%T@ %p\n' 2>/dev/null | sort -nr | head -80 || true
        echo '=== RECENT AUTOPILOT LOG SIGNALS ==='
        journalctl -u osho-autopilot.service --since '3 hours ago' --no-pager 2>/dev/null | grep -Ei 'APPROV|SAFE|RENDER|READY|UPLOAD|SKIP|QA|candidate' | tail -220 || true
        echo '=== STATE COUNTS ==='
        python3 - <<'PY'
        import sqlite3
        db='/srv/osho/library/catalog/catalog.sqlite'
        c=sqlite3.connect(f'file:{db}?mode=ro',uri=True,timeout=2)
        for row in c.execute("SELECT status,COUNT(*) FROM osho_autopilot_state GROUP BY status ORDER BY status"):
            print('STATE_COUNT='+repr(row))
        print('RECENT_NONSKIPPED=')
        for row in c.execute("SELECT source_id,status,note,last_error,updated_at FROM osho_autopilot_state WHERE lower(status) NOT IN ('skipped','pending') ORDER BY updated_at DESC LIMIT 25"):
            print(repr(row))
        c.close()
        PY
      args:
        executable: /bin/bash
      register: diag
      changed_when: false
      failed_when: false

    - name: Show Growth V1 handoff diagnosis
      ansible.builtin.debug:
        msg: "{{ diag.stdout_lines }}"
