---
- name: Deploy autonomous media-01 creative and QA pipeline
  hosts: media-01
  gather_facts: false
  tasks:
    - name: Deploy autonomous worker components
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../../services/media01/{{ item }}"
        dest: "/home/p2ops/media01/{{ item }}"
        mode: "0755"
      loop:
        - media_worker.py
        - content_analyzer.py
        - editorial.py
        - creative_planner.py
        - creative_qa.py
        - podcast_captions.py
        - qa_gate.py
        - auto_repair.py
        - test_pipeline.py

    - name: Deploy quality and autonomy profile
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../../services/media01/quality-profile.json"
        dest: /home/p2ops/media01/quality-profile.json
        mode: "0644"

    - name: Configure current BeSquare interview as two-person podcast
      ansible.builtin.shell: |
        set -eu
        p=/srv/media-production/inbox/besquare-demo-01/project.json
        if [ -f "$p" ]; then
          python3 - "$p" <<'PY'
        import json,sys,tempfile,os
        p=sys.argv[1]
        with open(p) as f:d=json.load(f)
        d['mode']='podcast'
        d['podcast_captions']={
          'enabled':True,
          'left':{'name':'Raven','color':'#7DFF95'},
          'right':{'name':'Prabhat','color':'#83D9FF'},
          'font':'DejaVu Sans','font_size':78,'outline':2.2,'shadow':3.2,
          'margin_v':115,'words_per_caption':12
        }
        tmp=p+'.tmp'
        with open(tmp,'w') as f:json.dump(d,f,indent=2)
        os.replace(tmp,p)
        PY
        fi
      changed_when: true

    - name: Verify autonomous worker contracts
      ansible.builtin.command:
        argv:
          - /home/p2ops/media01/venv-v2/bin/python
          - /home/p2ops/media01/test_pipeline.py
      register: contracts
      changed_when: false

    - name: Verify FFmpeg ASS renderer is available
      ansible.builtin.shell: "ffmpeg -hide_banner -filters 2>/dev/null | grep -qE '(^| )ass +V->V'"
      changed_when: false

    - name: Install user watchdog for worker self-recovery
      ansible.builtin.shell: |
        set -eu
        current="$(crontab -l 2>/dev/null | grep -v 'MEDIA01_WORKER_WATCHDOG' || true)"
        {
          printf '%s\n' "$current"
          echo "* * * * * pgrep -f '^/home/p2ops/media01/venv-v2/bin/python /home/p2ops/media01/media_worker.py --watch$' >/dev/null || setsid -f /home/p2ops/media01/venv-v2/bin/python /home/p2ops/media01/media_worker.py --watch >>/srv/media-production/logs/media01-worker-watchdog.log 2>&1 # MEDIA01_WORKER_WATCHDOG"
          echo "@reboot pgrep -f '^/home/p2ops/media01/venv-v2/bin/python /home/p2ops/media01/media_worker.py --watch$' >/dev/null || setsid -f /home/p2ops/media01/venv-v2/bin/python /home/p2ops/media01/media_worker.py --watch >>/srv/media-production/logs/media01-worker-watchdog.log 2>&1 # MEDIA01_WORKER_WATCHDOG"
        } | crontab -
      changed_when: true

    - name: Force old worker to fail so systemd may restart it
      ansible.builtin.shell: "pkill -KILL -f '^/home/p2ops/media01/venv-v2/bin/python /home/p2ops/media01/media_worker.py --watch$' || true"
      changed_when: true

    - name: Give systemd restart policy a chance
      ansible.builtin.pause:
        seconds: 12

    - name: Start worker directly when system service did not recover
      ansible.builtin.shell: |
        if ! pgrep -f '^/home/p2ops/media01/venv-v2/bin/python /home/p2ops/media01/media_worker.py --watch$' >/dev/null; then
          setsid -f /home/p2ops/media01/venv-v2/bin/python /home/p2ops/media01/media_worker.py --watch >>/srv/media-production/logs/media01-worker-watchdog.log 2>&1
        fi
      changed_when: true

    - name: Verify autonomous worker is alive
      ansible.builtin.shell: "pgrep -a -f '^/home/p2ops/media01/venv-v2/bin/python /home/p2ops/media01/media_worker.py --watch$' | head -1"
      register: worker
      until: worker.rc == 0 and worker.stdout | length > 0
      retries: 20
      delay: 3
      changed_when: false

    - name: Allow worker to claim updated podcast job
      ansible.builtin.pause:
        seconds: 15

    - name: Read BeSquare state after autonomous restart
      ansible.builtin.shell: "cat /srv/media-production/logs/besquare-demo-01.status.json 2>/dev/null || true"
      register: besquare_status
      changed_when: false

    - name: Report autonomous deployment
      ansible.builtin.debug:
        msg:
          tests: "{{ contracts.stdout }}"
          worker: "{{ worker.stdout }}"
          besquare_status: "{{ besquare_status.stdout }}"
