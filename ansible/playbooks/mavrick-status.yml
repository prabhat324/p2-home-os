---
- name: Check whether Project Mavrick is live and ready
  hosts: compute-04
  gather_facts: false
  tasks:
    - name: Inspect Mavrick readiness
      ansible.builtin.shell: |
        set -o pipefail
        echo "MAVRICK_SERVICE=$(systemctl is-active mavrick.service 2>/dev/null || true)"
        echo "MAVRICK_ENABLED=$(systemctl is-enabled mavrick.service 2>/dev/null || true)"
        echo "MAVRICK_CAMERA=$(readlink -f /dev/v4l/by-id/*C930e*video-index0 2>/dev/null || echo missing)"
        echo "MAVRICK_MIC_PROCESS=$(pgrep -af 'arecord.*C930e' | head -1 || true)"
        echo -n "MAVRICK_MODEL="
        curl -fsS --max-time 10 http://127.0.0.1:11434/api/tags 2>/dev/null           | jq -r 'if [.models[]? | select(.name == "qwen3-vl:2b" or .model == "qwen3-vl:2b")] | length > 0 then "ready" else "missing" end'
        echo -n "MAVRICK_RUNTIME_STATUS="
        cat /run/mavrick/status.json 2>/dev/null || echo missing
        echo
        echo "MAVRICK_MIXER_MASTER=$(amixer -c sofhdadsp get Master | awk '/Mono: Playback/{print $4,$5,$6}')"
        echo "MAVRICK_MIXER_HEADPHONE=$(amixer -c sofhdadsp get Headphone | awk '/Front Left: Playback/{print $5,$6,$7}')"
        echo "MAVRICK_MIXER_SPEAKER=$(amixer -c sofhdadsp get Speaker | awk '/Front Left: Playback/{print $5,$6,$7}')"
        echo "MAVRICK_MODEL_PULL_PID=$(cat /home/p2ops/.local/state/mavrick-model-pull.pid 2>/dev/null || echo missing)"
        pull_pid="$(cat /home/p2ops/.local/state/mavrick-model-pull.pid 2>/dev/null || true)"
        if [[ -n "$pull_pid" ]] && kill -0 "$pull_pid" 2>/dev/null; then
          echo "MAVRICK_MODEL_PULL_PROCESS=running"
        else
          echo "MAVRICK_MODEL_PULL_PROCESS=stopped"
        fi
        echo "MAVRICK_MODEL_PULL_PROGRESS"
        tr '\r' '\n' < /home/p2ops/.local/state/mavrick-model-pull.log 2>/dev/null | tail -n 12 || true
        echo "MAVRICK_RECENT_LOGS"
        journalctl -u mavrick.service -n 8 --no-pager 2>/dev/null || true
      args:
        executable: /bin/bash
      register: status
      changed_when: false

    - name: Show Mavrick readiness
      ansible.builtin.debug:
        msg: "{{ status.stdout_lines }}"
