---
- name: Diagnose the dashboard.home.arpa path end to end
  hosts: core-01
  gather_facts: false
  tasks:
    - name: Test backend, Caddy route and local DNS
      ansible.builtin.shell: |
        set -o pipefail
        echo '=== DNS ==='
        getent hosts dashboard.home.arpa || true
        echo '=== ADGUARD_DIRECT ==='
        if command -v dig >/dev/null 2>&1; then
          dig +short @127.0.0.1 dashboard.home.arpa A || true
          dig +short @192.168.0.203 dashboard.home.arpa A || true
        else
          nslookup dashboard.home.arpa 127.0.0.1 2>&1 || true
          nslookup dashboard.home.arpa 192.168.0.203 2>&1 || true
        fi
        echo '=== BACKEND ==='
        curl -sS -o /dev/null -w 'BACKEND_HTTP=%{http_code}\n' --max-time 5 http://192.168.0.88:8787/ || true
        echo '=== COMPUTE04_GLANCES_PROXY ==='
        curl -sS -o /dev/null -w 'COMPUTE04_CPU_HTTP=%{http_code}\n' --max-time 6 http://192.168.0.88:8787/api/glances/compute-04/api/4/cpu || true
        curl -sS -o /dev/null -w 'COMPUTE04_MEM_HTTP=%{http_code}\n' --max-time 6 http://192.168.0.88:8787/api/glances/compute-04/api/4/mem || true
        curl -sS -o /dev/null -w 'COMPUTE04_FS_HTTP=%{http_code}\n' --max-time 6 http://192.168.0.88:8787/api/glances/compute-04/api/4/fs || true
        echo '=== CADDY_HOST_HEADER ==='
        curl -sS -o /dev/null -w 'CADDY_HTTP=%{http_code}\n' --max-time 5 -H 'Host: dashboard.home.arpa' http://127.0.0.1/ || true
        echo '=== NAMED_URL ==='
        curl -sS -o /dev/null -w 'NAMED_HTTP=%{http_code}\n' --max-time 5 http://dashboard.home.arpa/ || true
        echo '=== OSHO_DASHBOARD_STATE ==='
        curl -fsS --max-time 5 http://192.168.0.88:8787/api/dashboard 2>/dev/null |
          python3 -c 'import json,sys; d=json.load(sys.stdin); s=d.get("summary") or {}; j=d.get("current_job") or {}; r=d.get("state_reconciliation") or {}; print("PROCESSING="+str(s.get("processing"))); print("CURRENT_JOB="+str(j.get("id") or j.get("job_id") or j.get("source_id") or "")); print("CURRENT_STATUS="+str(j.get("status") or j.get("stage") or "")); print("CURRENT_UPDATED="+str(j.get("updated_at") or "")); print("RECONCILIATION_FRESH="+str(r.get("fresh"))); print("RECONCILIATION_RECEIVED="+str(r.get("received_at") or "")); print("STATUS_COUNTS="+json.dumps(r.get("status_counts") or {},sort_keys=True))' || true
        echo '=== ROUTE_COUNT ==='
        grep -c '^http://dashboard\.home\.arpa {' /opt/docker/compose/caddy/Caddyfile 2>/dev/null || true
        echo '=== CONTAINERS ==='
        docker ps --format '{% raw %}{{.Names}}|{{.Status}}{% endraw %}' 2>/dev/null | grep -E '^(caddy|homepage)\|' || true
      args:
        executable: /bin/bash
      register: diagnose
      changed_when: false
      failed_when: false

    - name: Print dashboard diagnosis
      ansible.builtin.debug:
        msg: "{{ diagnose.stdout_lines }}"
