---
- name: Factory-clean and provision APC G50 #2
  hosts: core-01
  gather_facts: false
  tasks:
    - name: Confirm G50 #2 is reachable before changes
      ansible.builtin.command:
        argv:
          - python3
          - -c
          - >-
            import socket; s=socket.create_connection(('192.168.0.240',80),3); s.close(); print('G50_02_HTTP_REACHABLE')
      changed_when: false

    - name: Provision G50 #2 through the P2 manager
      ansible.builtin.command:
        argv:
          - python3
          - ../ops/g50_manager.py
          - provision
          - --device
          - p2-g50-02
          - --host
          - 192.168.0.240
          - --mac
          - 28:29:86:19:72:bc
          - --factory-clean
      register: g50_provision
      changed_when: "'G50_PROVISION_OK' in g50_provision.stdout"

    - name: Show sanitized G50 provisioning result
      ansible.builtin.debug:
        var: g50_provision.stdout_lines

    - name: Assert G50 #2 provisioned successfully
      ansible.builtin.assert:
        that:
          - "'G50_PROVISION_OK' in g50_provision.stdout"
          - "'ports=21:closed,22:closed,23:closed,80:open' in g50_provision.stdout"
        fail_msg: "G50 #2 did not reach the expected managed state"
