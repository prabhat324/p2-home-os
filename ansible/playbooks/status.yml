---
- name: Attempt safe core media mount recovery
  hosts: all
  gather_facts: false
  tasks:
    - name: Attempt non-destructive media mount recovery on core-01
      ansible.builtin.shell: |
        set +e
        echo "HOST=$(hostname)"
        if [ "$(hostname)" != "core-01" ]; then
          echo 'RECOVERY_SKIPPED=not-core-01'
          exit 0
        fi
        echo '=== BEFORE ==='
        findmnt -T /mnt/media -o SOURCE,FSTYPE,TARGET,OPTIONS -n 2>&1 || true
        systemctl is-active mnt-media.mount 2>&1 || true
        systemctl is-active nfs-server.service 2>&1 || true

        echo '=== TRY SYSTEMD MOUNT ==='
        systemctl start mnt-media.mount 2>&1
        echo "SYSTEMD_MOUNT_RC=$?"
        findmnt -T /mnt/media -o SOURCE,FSTYPE,TARGET,OPTIONS -n 2>&1 || true

        if ! findmnt -T /mnt/media -n -o SOURCE 2>/dev/null | grep -qE 'sda2|3C80209F8020621E'; then
          echo '=== TRY UDISKS MOUNT ==='
          udisksctl mount -b /dev/sda2 2>&1
          echo "UDISKS_MOUNT_RC=$?"
          findmnt -T /mnt/media -o SOURCE,FSTYPE,TARGET,OPTIONS -n 2>&1 || true
          findmnt -S /dev/sda2 -o SOURCE,FSTYPE,TARGET,OPTIONS -n 2>&1 || true
        fi

        if findmnt -T /mnt/media -n -o SOURCE 2>/dev/null | grep -qE 'sda2|3C80209F8020621E'; then
          echo 'MEDIA_MOUNT=ready'
          echo '=== TRY NFS START ==='
          systemctl start nfs-server.service 2>&1
          echo "NFS_START_RC=$?"
        else
          echo 'MEDIA_MOUNT=not-ready'
          echo 'NFS_START_SKIPPED=media-not-mounted'
        fi

        echo '=== AFTER ==='
        findmnt -T /mnt/media -o SOURCE,FSTYPE,SIZE,USED,AVAIL,TARGET,OPTIONS 2>&1 || true
        systemctl status mnt-media.mount --no-pager -l 2>&1 | tail -40 || true
        systemctl status nfs-server.service --no-pager -l 2>&1 | tail -40 || true
        ss -lnt 2>&1 | grep -E '(:2049[[:space:]]|Local Address)' || true
      args:
        executable: /bin/bash
      register: recovery
      changed_when: false

    - name: Show recovery attempt
      ansible.builtin.debug:
        msg: "{{ recovery.stdout_lines }}"
