---
- name: One-time requested reboot of core-01
  hosts: core-01
  gather_facts: false
  tasks:
    - name: Schedule core-01 reboot
      ansible.builtin.shell: |
        set -eu
        echo "HOST=$(hostname)"
        echo "REBOOT_REQUESTED=yes"
        sync
        nohup /bin/sh -c 'sleep 3; /usr/bin/systemctl reboot --no-block' >/tmp/p2-core-reboot.log 2>&1 </dev/null &
        echo "REBOOT_SCHEDULED=yes"
      args:
        executable: /bin/bash
      changed_when: true

    - name: Show reboot scheduling result
      ansible.builtin.debug:
        msg: "{{ ansible_facts | default({}) }}"
