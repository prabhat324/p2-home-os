---
- name: Verify clean power-off capability before physical relocation
  hosts: core-01:compute_nodes
  gather_facts: false
  ignore_unreachable: true
  tasks:
    - name: Check power-off authorization without changing state
      ansible.builtin.shell: |
        set -u
        echo "HOST=$(hostname -s)"
        echo "USER=$(id -un)"
        if command -v busctl >/dev/null 2>&1; then
          printf 'CAN_POWEROFF='
          busctl call org.freedesktop.login1 /org/freedesktop/login1 org.freedesktop.login1.Manager CanPowerOff 2>/dev/null || echo unavailable
        else
          echo 'CAN_POWEROFF=busctl-unavailable'
        fi
        printf 'SUDO_NONINTERACTIVE='; sudo -n true >/dev/null 2>&1 && echo yes || echo no
        sync
      args:
        executable: /bin/bash
      register: power_audit
      changed_when: false

    - name: Print safe power-off capability
      ansible.builtin.debug:
        var: power_audit.stdout_lines
