---
- name: Deploy pSquare proactive node availability watchdog
  hosts: core-01
  gather_facts: false
  vars:
    watchdog_src: "{{ playbook_dir }}/../../services/psquare-discord/psquare_node_watchdog.py"
    watchdog_bin: /home/p2runner/.local/bin/psquare-node-watchdog.py
    watchdog_state_dir: /home/p2runner/.local/state
    watchdog_pidfile: /home/p2runner/.local/state/psquare-node-watchdog.pid
    watchdog_log: /home/p2runner/.local/state/psquare-node-watchdog.log
    discord_config: /home/p2runner/.config/psquare-discord.env

  tasks:
    - name: Ensure watchdog directories exist
      become: true
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: directory
        owner: p2runner
        group: p2runner
        mode: "{{ item.mode }}"
      loop:
        - { path: "/home/p2runner/.local/bin", mode: "0755" }
        - { path: "{{ watchdog_state_dir }}", mode: "0700" }

    - name: Verify existing Discord bot configuration is present
      ansible.builtin.stat:
        path: "{{ discord_config }}"
      register: discord_cfg

    - name: Require protected Discord configuration
      ansible.builtin.assert:
        that:
          - discord_cfg.stat.exists
          - discord_cfg.stat.mode == '0600'
        fail_msg: Existing pSquare Discord configuration is missing or not mode 0600

    - name: Install node watchdog
      become: true
      ansible.builtin.copy:
        src: "{{ watchdog_src }}"
        dest: "{{ watchdog_bin }}"
        owner: p2runner
        group: p2runner
        mode: "0755"

    - name: Validate watchdog Python and current node probes
      ansible.builtin.shell: |
        set -eu
        python3 -m py_compile "{{ watchdog_bin }}"
        runuser -u p2runner -- "{{ watchdog_bin }}" --once
      args:
        executable: /bin/bash
      register: watchdog_probe
      changed_when: false

    - name: Keep node watchdog running after core-01 reboot
      become: true
      ansible.builtin.cron:
        name: pSquare node availability watchdog
        special_time: reboot
        user: p2runner
        job: "/usr/bin/nohup {{ watchdog_bin }} >> {{ watchdog_log }} 2>&1 &"

    - name: Restart pSquare node watchdog
      become: true
      ansible.builtin.shell: |
        set -eu
        pidfile="{{ watchdog_pidfile }}"
        if [ -s "$pidfile" ]; then
          oldpid="$(cat "$pidfile")"
          if kill -0 "$oldpid" 2>/dev/null; then
            kill "$oldpid" || true
            for n in 1 2 3 4 5; do
              kill -0 "$oldpid" 2>/dev/null || break
              sleep 1
            done
          fi
        fi
        for pid in $(pgrep -f '^python3 /home/p2runner/.local/bin/psquare-node-watchdog.py$' 2>/dev/null || true); do
          kill "$pid" 2>/dev/null || true
        done
        env -u RUNNER_TRACKING_ID runuser -u p2runner -- nohup "{{ watchdog_bin }}" >> "{{ watchdog_log }}" 2>&1 </dev/null &
        newpid=$!
        echo "$newpid" > "$pidfile"
        chown p2runner:p2runner "$pidfile"
        chmod 600 "$pidfile"
        sleep 3
        kill -0 "$newpid"
        echo WATCHDOG_STATUS=running
        echo WATCHDOG_PID=$newpid
        echo '=== CURRENT PROBE ==='
        runuser -u p2runner -- "{{ watchdog_bin }}" --once
        echo '=== CRON ==='
        crontab -l -u p2runner | grep 'psquare-node-watchdog.py'
      args:
        executable: /bin/bash
      register: watchdog_start
      changed_when: true

    - name: Show watchdog deployment status
      ansible.builtin.debug:
        msg:
          - "{{ watchdog_probe.stdout_lines }}"
          - "{{ watchdog_start.stdout_lines }}"
          - "WATCHDOG_POLICY=60s checks, 3 consecutive failures before DOWN alert, automatic recovery alert"
          - "MONITORED_NODES=compute-01,compute-02,compute-03,compute-04,storage-01"
