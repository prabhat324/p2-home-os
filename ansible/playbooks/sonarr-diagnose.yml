---
- name: Diagnose Sonarr root-folder access on core-01
  hosts: core-01
  gather_facts: false
  tasks:
    - name: Collect Sonarr container, mount, path, and permission evidence
      ansible.builtin.shell: |
        set -o pipefail
        echo '=== HOST ==='
        hostname
        id
        echo '=== MEDIA MOUNT ==='
        findmnt -T '/mnt/media/TV Shows' -o TARGET,SOURCE,FSTYPE,OPTIONS 2>&1 || true
        stat -c '%U:%G %u:%g %a %n' /mnt/media '/mnt/media/TV Shows' /mnt/media/Downloads 2>&1 || true
        echo '=== DOCKER ACCESS PATH ==='
        getent group docker 2>&1 || true
        stat -c '%U:%G %u:%g %a %n' /var/run/docker.sock /opt/docker/compose/sonarr /opt/docker/compose/sonarr/docker-compose.yml 2>&1 || true
        test -w /opt/docker/compose/sonarr/docker-compose.yml && echo COMPOSE_WRITABLE=yes || echo COMPOSE_WRITABLE=no
        sg docker -c 'docker ps --filter name=sonarr' 2>&1 || true
        echo '=== SUDO ACCESS ==='
        sudo -n -l 2>&1 || true
        echo '=== SONARR CONTAINER ==='
        sudo -n docker ps -a --filter name=sonarr 2>&1 || true
        echo '=== SONARR MOUNTS ==='
        sudo -n docker inspect sonarr 2>/dev/null | python3 -c '
        import json,sys
        try:
            rows=json.load(sys.stdin)
        except Exception as e:
            print("INSPECT_ERROR="+str(e))
            rows=[]
        for m in (rows[0].get("Mounts",[]) if rows else []):
            print("%s -> %s RW=%s" % (m.get("Source"),m.get("Destination"),m.get("RW")))
        ' || true
        echo '=== SONARR ID AND PATHS ==='
        sudo -n docker exec sonarr sh -c 'id; for p in /tv "/mnt/media/TV Shows" /downloads; do echo "--- $p"; ls -ld "$p" 2>&1 || true; done' 2>&1 || true
        echo '=== WRITE PROBES ==='
        sudo -n docker exec sonarr sh -c '
          for p in /tv "/mnt/media/TV Shows"; do
            if [ -d "$p" ]; then
              probe="$p/.p2-sonarr-write-probe"
              if touch "$probe" 2>/tmp/p2-probe-error; then
                rm -f "$probe"
                echo "WRITE_OK=$p"
              else
                echo "WRITE_FAIL=$p"
                cat /tmp/p2-probe-error
              fi
            fi
          done
        ' 2>&1 || true
        echo '=== SONARR API ==='
        python3 - <<'PY'
        import json, urllib.request, urllib.error, xml.etree.ElementTree as ET
        cfg='/opt/docker/compose/sonarr/config/config.xml'
        try:
            root=ET.parse(cfg).getroot()
            key=(root.findtext('ApiKey') or '').strip()
            port=(root.findtext('Port') or '8989').strip()
            urlbase=(root.findtext('UrlBase') or '').strip().strip('/')
            base='http://127.0.0.1:'+port+('/'+urlbase if urlbase else '')
            if not key:
                raise RuntimeError('API key missing')
            for endpoint in ('system/status','health','rootfolder'):
                req=urllib.request.Request(base+'/api/v3/'+endpoint,headers={'X-Api-Key':key})
                try:
                    with urllib.request.urlopen(req,timeout=8) as r:
                        data=json.load(r)
                    if endpoint=='system/status':
                        keep={k:data.get(k) for k in ('appName','version','isLinux','isDocker','startupPath','appData','authentication')}
                        print('SYSTEM='+json.dumps(keep,sort_keys=True))
                    elif endpoint=='health':
                        print('HEALTH='+json.dumps(data,sort_keys=True))
                    else:
                        safe=[]
                        for x in data:
                            safe.append({k:x.get(k) for k in ('id','path','accessible','freeSpace')})
                        print('ROOTFOLDERS='+json.dumps(safe,sort_keys=True))
                except Exception as e:
                    print(endpoint.upper().replace('/','_')+'_ERROR='+str(e))
        except Exception as e:
            print('SONARR_API_SETUP_ERROR='+str(e))
        PY
        echo '=== COMPOSE FILE ==='
        sed -n '1,220p' /opt/docker/compose/sonarr/docker-compose.yml 2>&1 || true
        echo '=== RECENT SONARR LOGS ==='
        sudo -n docker logs --tail 160 sonarr 2>&1 || true
      args:
        executable: /bin/bash
      register: sonarr_diagnose
      changed_when: false

    - name: Print Sonarr diagnostic evidence
      ansible.builtin.debug:
        msg: "{{ sonarr_diagnose.stdout_lines }}"
