---
- name: Diagnose Project Osho notification paths
  hosts: compute-01
  gather_facts: false
  tasks:
    - name: Inspect notification implementation and psquare bot runtime
      ansible.builtin.shell: |
        set -o pipefail
        echo "NOW=$(date -Ins)"
        echo "=== OSHO SERVICE ==="
        systemctl show osho-autopilot.service -p ActiveState -p SubState --no-pager 2>/dev/null || true
        echo "=== DISCORD PROCESSES ==="
        pgrep -af 'osho-discord-notifier|osho-discord-bot' || true
        echo "=== DISCORD API PROBE ==="
        python3 - <<'PY'
        import json, pathlib, urllib.request
        cfg={}
        for raw in pathlib.Path('/home/p2ops/.config/osho-discord-bot.env').read_text().splitlines():
            if '=' in raw:
                k,v=raw.split('=',1); cfg[k]=v
        token=cfg.get('DISCORD_BOT_TOKEN','')
        cid=cfg.get('DISCORD_CHANNEL_ID','')
        headers={'Authorization':'Bot '+token,'User-Agent':'psquare-diag/1.0'}
        def get(path):
            req=urllib.request.Request('https://discord.com/api/v10'+path,headers=headers)
            with urllib.request.urlopen(req,timeout=15) as r:
                return json.loads(r.read().decode())
        me=get('/users/@me')
        ch=get('/channels/'+cid)
        msgs=get('/channels/'+cid+'/messages?limit=10')
        print('BOT_AUTH=yes')
        print('BOT_NAME='+str(me.get('username','')))
        print('CHANNEL_NAME='+str(ch.get('name','')))
        print('READ_MESSAGES=yes COUNT='+str(len(msgs) if isinstance(msgs,list) else 0))
        human=0; human_empty=0
        for m in (msgs if isinstance(msgs,list) else []):
            a=m.get('author') or {}
            isbot=bool(a.get('bot',False))
            content=str(m.get('content') or '')
            if not isbot:
                human += 1
                if not content: human_empty += 1
            print('MSG id='+str(m.get('id',''))+' author='+str(a.get('username',''))+' bot='+str(isbot).lower()+' content_len='+str(len(content)))
        print('HUMAN_MESSAGES='+str(human))
        print('HUMAN_EMPTY_CONTENT='+str(human_empty))
        state=pathlib.Path('/home/p2ops/.local/state/osho-discord-bot-state.json')
        if state.exists():
            try: print('CURSOR_LAST_MESSAGE_ID='+str(json.loads(state.read_text()).get('last_message_id','')))
            except Exception as e: print('CURSOR_PARSE_ERROR='+type(e).__name__)
        PY
        echo "=== DISCORD BOT LOG ==="
        tail -n 80 /home/p2ops/.local/state/osho-discord-bot.log 2>/dev/null || true
      args:
        executable: /bin/bash
      register: notification_diag
      changed_when: false
      failed_when: false

    - name: Show notification diagnosis
      ansible.builtin.debug:
        msg: "{{ notification_diag.stdout_lines }}"
