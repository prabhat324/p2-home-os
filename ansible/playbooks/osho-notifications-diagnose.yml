---
- name: Diagnose Project Osho notification paths
  hosts: compute-01
  gather_facts: false
  tasks:
    - name: Inspect notification implementation and psquare bot runtime
      ansible.builtin.shell: |
        set -o pipefail
        echo "NOW=$(date -Ins)"
        echo "=== OSHO SERVICE ==="
        systemctl show osho-autopilot.service -p ActiveState -p SubState --no-pager 2>/dev/null || true
        echo "=== DISCORD PROCESSES ==="
        pgrep -af 'osho-discord-notifier|osho-discord-bot' || true
        echo "=== DISCORD BOT PID ==="
        pidfile=/home/p2ops/.local/state/osho-discord-bot.pid
        if [ -s "$pidfile" ]; then
          pid=$(cat "$pidfile")
          echo "PID=$pid"
          if kill -0 "$pid" 2>/dev/null; then echo "BOT_PROCESS=running"; else echo "BOT_PROCESS=dead"; fi
        else
          echo "BOT_PROCESS=no-pidfile"
        fi
        echo "=== DISCORD BOT CONFIG SAFETY ==="
        stat -c 'CONFIG_MODE=%a CONFIG_OWNER=%U:%G' /home/p2ops/.config/osho-discord-bot.env 2>/dev/null || true
        grep -E '^DISCORD_CHANNEL_ID=' /home/p2ops/.config/osho-discord-bot.env 2>/dev/null | sed 's/=.*/=<configured>/' || true
        echo "=== DISCORD BOT LOG ==="
        tail -n 80 /home/p2ops/.local/state/osho-discord-bot.log 2>/dev/null || true
        echo "=== DISCORD NOTIFIER LOG ==="
        tail -n 30 /home/p2ops/.local/state/osho-discord-notifier.log 2>/dev/null || true
      args:
        executable: /bin/bash
      register: notification_diag
      changed_when: false
      failed_when: false

    - name: Show notification diagnosis
      ansible.builtin.debug:
        msg: "{{ notification_diag.stdout_lines }}"
