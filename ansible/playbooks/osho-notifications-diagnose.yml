---
- name: Diagnose Project Osho notification paths
  hosts: compute-01
  gather_facts: false
  tasks:
    - name: Inspect notification implementation and psquare bot runtime
      ansible.builtin.shell: |
        set -o pipefail
        echo "NOW=$(date -Ins)"
        echo "=== OSHO SERVICE ==="
        systemctl show osho-autopilot.service -p ActiveState -p SubState --no-pager 2>/dev/null || true
        echo "=== DISCORD PROCESSES ==="
        pgrep -af 'osho-discord-notifier|osho-discord-bot' || true
        echo "=== DISCORD API PROBE ==="
        python3 - <<'PY'
        import json, pathlib, urllib.request
        cfg={}
        for raw in pathlib.Path('/home/p2ops/.config/osho-discord-bot.env').read_text().splitlines():
            if '=' in raw:
                k,v=raw.split('=',1); cfg[k]=v
        token=cfg.get('DISCORD_BOT_TOKEN','')
        cid=cfg.get('DISCORD_CHANNEL_ID','')
        headers={'Authorization':'Bot '+token,'User-Agent':'psquare-diag/1.0'}
        def get(path):
            req=urllib.request.Request('https://discord.com/api/v10'+path,headers=headers)
            with urllib.request.urlopen(req,timeout=15) as r:
                return json.loads(r.read().decode())
        me=get('/users/@me')
        ch=get('/channels/'+cid)
        msgs=get('/channels/'+cid+'/messages?limit=10')
        print('BOT_AUTH=yes')
        print('BOT_NAME='+str(me.get('username','')))
        print('CHANNEL_NAME='+str(ch.get('name','')))
        print('READ_MESSAGES=yes COUNT='+str(len(msgs) if isinstance(msgs,list) else 0))
        human=0; human_empty=0
        for m in (msgs if isinstance(msgs,list) else []):
            a=m.get('author') or {}
            isbot=bool(a.get('bot',False))
            content=str(m.get('content') or '')
            if not isbot:
                human += 1
                if not content: human_empty += 1
            print('MSG id='+str(m.get('id',''))+' author='+str(a.get('username',''))+' bot='+str(isbot).lower()+' content_len='+str(len(content)))
        print('HUMAN_MESSAGES='+str(human))
        print('HUMAN_EMPTY_CONTENT='+str(human_empty))
        state=pathlib.Path('/home/p2ops/.local/state/osho-discord-bot-state.json')
        if state.exists():
            try: print('CURSOR_LAST_MESSAGE_ID='+str(json.loads(state.read_text()).get('last_message_id','')))
            except Exception as e: print('CURSOR_PARSE_ERROR='+type(e).__name__)
        PY
        echo "=== DISCORD BOT LOG ==="
        tail -n 80 /home/p2ops/.local/state/osho-discord-bot.log 2>/dev/null || true
      args:
        executable: /bin/bash
      register: notification_diag
      changed_when: false
      failed_when: false

    - name: Show notification diagnosis
      ansible.builtin.debug:
        msg: "{{ notification_diag.stdout_lines }}"

    - name: Measure Osho productivity SLA evidence
      ansible.builtin.shell: |
        set -o pipefail
        echo "=== PRODUCTIVITY SLA ==="
        echo "AUTOPILOT=$(systemctl is-active osho-autopilot.service 2>/dev/null || true)"
        echo "=== BUFFER STATUS ==="
        sudo -n /usr/local/sbin/p2ops-osho-buffer status 2>&1 || true
        echo "=== ACTIVE PIPELINE ==="
        pgrep -af 'hook_ranker_v5|retention_qa|ffmpeg|production_renderer|osho_autopilot' || true
        echo "=== GPU ==="
        nvidia-smi --query-gpu=name,utilization.gpu,memory.used,memory.total,temperature.gpu,power.draw --format=csv,noheader,nounits 2>/dev/null || true
        python3 - <<'PY'
        import json, pathlib, sqlite3
        from datetime import datetime, timezone
        now=datetime.now(timezone.utc)
        def parse(v):
            if not v: return None
            try:
                d=datetime.fromisoformat(str(v).replace('Z','+00:00'))
                if d.tzinfo is None: d=d.replace(tzinfo=timezone.utc)
                return d.astimezone(timezone.utc)
            except Exception: return None
        rows=[]
        root=pathlib.Path('/srv/osho/youtube/receipts')
        if root.is_dir():
            for p in root.glob('*.json'):
                try:d=json.loads(p.read_text(encoding='utf-8'))
                except Exception:continue
                if not isinstance(d,dict):continue
                vid=d.get('video_id') or d.get('youtube_video_id') or d.get('id')
                ts=parse(d.get('published_at') or d.get('uploaded_at') or d.get('created_at'))
                status=str(d.get('status') or d.get('upload_status') or '').lower()
                if vid and ts and (not status or status in {'published','uploaded','complete','success','public'}): rows.append((ts,p,d))
        rows.sort(key=lambda x:x[0],reverse=True)
        print('PUBLIC_RECEIPT_COUNT='+str(len(rows)))
        if rows:
            ts,p,d=rows[0]
            print(f'NEWEST_PUBLIC_AGE_MIN={(now-ts).total_seconds()/60:.1f}')
            print('NEWEST_PUBLIC='+json.dumps({'file':p.name,'published_at':ts.isoformat(),'video_id':d.get('video_id') or d.get('youtube_video_id') or d.get('id'),'title':d.get('title') or d.get('youtube_title')},ensure_ascii=False,sort_keys=True))
        db=pathlib.Path('/srv/osho/library/catalog/catalog.sqlite')
        if db.exists():
            con=sqlite3.connect(f'file:{db}?mode=ro',uri=True); con.row_factory=sqlite3.Row
            try:
                print('STATE_COUNTS='+json.dumps(dict(con.execute('select status,count(*) from osho_autopilot_state group by status').fetchall()),sort_keys=True))
                for r in con.execute('select source_id,status,attempts,last_error,note,started_at,finished_at,updated_at from osho_autopilot_state order by source_number desc limit 20'):
                    print('RECENT_STATE='+json.dumps(dict(r),ensure_ascii=False,sort_keys=True))
            finally: con.close()
        PY
        echo "=== RECENT FLOW ==="
        journalctl -u osho-autopilot.service --since '90 minutes ago' --no-pager -o short-iso 2>/dev/null | grep -Ei 'candidate|approval|SAFE|queue|submit|render|complete|fail|error|upload|publish|skip|reject|retention|rank' | tail -220 || true
      args:
        executable: /bin/bash
      register: sla_diag
      changed_when: false
      failed_when: false

    - name: Show productivity SLA evidence
      ansible.builtin.debug:
        msg: "{{ sla_diag.stdout_lines }}"
