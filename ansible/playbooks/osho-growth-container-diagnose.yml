---
- name: Compare host and live worker Growth V1 code on compute-01
  hosts: compute-01
  gather_facts: false
  tasks:
    - name: Inspect container code, mounts, image, and compose configuration
      ansible.builtin.shell: |
        set -o pipefail
        cd /srv/compose/osho-worker
        echo "NOW=$(date -Ins)"
        echo '=== HOST CODE ==='
        sha256sum app.py production_renderer.py 2>/dev/null || true
        grep -nE 'osho-growth-v1|OSHO_GROWTH_TEMPLATE_V1' app.py production_renderer.py | head -40 || true
        echo '=== CONTAINER INSPECT ==='
        docker inspect osho-worker 2>/dev/null | python3 -c '
        import json,sys
        try:d=json.load(sys.stdin)[0]
        except Exception as e: print("INSPECT_ERROR="+str(e)); raise SystemExit
        print("ID="+str(d.get("Id")))
        print("IMAGE="+str(d.get("Image")))
        print("CREATED="+str(d.get("Created")))
        print("STARTED="+str((d.get("State") or {}).get("StartedAt")))
        for m in d.get("Mounts",[]): print("MOUNT="+str(m.get("Source"))+" -> "+str(m.get("Destination"))+" RW="+str(m.get("RW")))
        ' || true
        echo '=== CONTAINER CODE LOCATIONS ==='
        docker exec osho-worker sh -lc '
          pwd
          find / -maxdepth 3 -type f \( -name app.py -o -name production_renderer.py \) 2>/dev/null | sort
          for f in /app/app.py /app/production_renderer.py /srv/compose/osho-worker/app.py /srv/compose/osho-worker/production_renderer.py; do
            [ -f "$f" ] || continue
            echo "--- $f ---"
            sha256sum "$f" || true
            grep -nE "osho-growth-v1|OSHO_GROWTH_TEMPLATE_V1" "$f" | head -30 || true
          done
        ' 2>/dev/null || true
        echo '=== COMPOSE CONFIG ==='
        docker compose config 2>/dev/null | sed -n '1,260p' || true
        echo '=== IMAGE HISTORY ==='
        docker inspect osho-worker 2>/dev/null | python3 -c '
        import json,sys,subprocess
        try:d=json.load(sys.stdin)[0]; img=d.get("Image")
        except Exception as e: print("IMAGE_LOOKUP_ERROR="+str(e)); raise SystemExit
        if img:
            p=subprocess.run(["docker","image","inspect",img],text=True,capture_output=True)
            try:x=json.loads(p.stdout)[0]; print("IMAGE_CREATED="+str(x.get("Created"))); print("IMAGE_TAGS="+repr(x.get("RepoTags")))
            except Exception as e: print("IMAGE_INSPECT_ERROR="+str(e))
        ' || true
      args:
        executable: /bin/bash
      register: diag
      changed_when: false
      failed_when: false

    - name: Show host versus container diagnosis
      ansible.builtin.debug:
        msg: "{{ diag.stdout_lines }}"
