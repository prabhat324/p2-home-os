---
- name: Inventory Project Mavrick hardware and runtime
  hosts: compute-02
  gather_facts: false
  tasks:
    - name: Inspect camera audio compute and services without capturing media
      ansible.builtin.shell: |
        set -o pipefail
        echo "NOW=$(date -Ins)"
        echo "=== HOST ==="
        hostnamectl 2>/dev/null || true
        uname -a
        uptime
        free -h
        df -h /
        echo "=== CPU GPU ==="
        lscpu | grep -E "Model name|Socket|Core|Thread|CPU.s" || true
        lspci -nn | grep -Ei "vga|3d|display|audio" || true
        command -v vainfo >/dev/null && vainfo 2>&1 | head -80 || true
        echo "=== USB ==="
        lsusb 2>/dev/null || true
        echo "=== VIDEO DEVICES ==="
        command -v v4l2-ctl >/dev/null && v4l2-ctl --list-devices 2>&1 || true
        ls -l /dev/video* /dev/media* 2>/dev/null || true
        for d in /dev/video*; do
          [ -e "$d" ] || continue
          echo "DEVICE=$d"
          udevadm info --query=property --name="$d" 2>/dev/null | grep -E "ID_VENDOR|ID_MODEL|ID_SERIAL|ID_V4L|DEVNAME" || true
          command -v v4l2-ctl >/dev/null && v4l2-ctl -d "$d" --all 2>&1 | grep -E "Driver name|Card type|Bus info|Video input|Width/Height|Pixel Format" || true
        done
        echo "=== ALSA ==="
        command -v arecord >/dev/null && arecord -l 2>&1 || true
        command -v aplay >/dev/null && aplay -l 2>&1 || true
        cat /proc/asound/cards 2>/dev/null || true
        echo "=== PIPEWIRE PULSE ==="
        command -v pactl >/dev/null && pactl info 2>&1 || true
        command -v pactl >/dev/null && pactl list short sources 2>&1 || true
        command -v pactl >/dev/null && pactl list short sinks 2>&1 || true
        command -v wpctl >/dev/null && wpctl status 2>&1 || true
        echo "=== ACCESS ==="
        id
        getent group video || true
        getent group audio || true
        loginctl list-sessions --no-legend 2>/dev/null || true
        echo "=== SOFTWARE ==="
        for c in python3 docker ffmpeg ffprobe v4l2-ctl arecord aplay pactl wpctl; do
          printf "%s=" "$c"
          command -v "$c" 2>/dev/null || echo missing
        done
        docker ps --format "table {{'{{'}}.Names{{'}}'}}\t{{'{{'}}.Status{{'}}'}}\t{{'{{'}}.Ports{{'}}'}}" 2>/dev/null || true
        systemctl --no-pager --type=service --state=running 2>/dev/null | grep -Ei "docker|pipewire|pulse|glances|osho|ollama|n8n" || true
        echo "=== NETWORK LISTENERS ==="
        ss -lntup 2>/dev/null | grep -E ":(5678|61208|8787|11434|8800)\b" || true
      args:
        executable: /bin/bash
      register: mavrick_inventory
      changed_when: false
      failed_when: false

    - name: Show Project Mavrick inventory
      ansible.builtin.debug:
        msg: "{{ mavrick_inventory.stdout_lines }}"
