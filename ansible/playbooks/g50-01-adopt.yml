---
- name: Adopt primary APC G50 into P2 Home OS
  hosts: core-01
  gather_facts: false
  tasks:
    - name: Confirm primary G50 is reachable before changes
      ansible.builtin.command:
        argv:
          - python3
          - -c
          - >-
            import socket; s=socket.create_connection(('192.168.0.236',80),3); s.close(); print('G50_01_HTTP_REACHABLE')
      changed_when: false

    - name: Finish G50 #1 reconciliation after protocol changes
      ansible.builtin.command:
        argv:
          - python3
          - "{{ playbook_dir }}/../../ops/g50_finish.py"
          - --device
          - p2-g50-01
          - --host
          - 192.168.0.236
          - --mac
          - 28:29:86:19:72:b8
      register: g50_adopt
      changed_when: "'G50_PROVISION_OK' in g50_adopt.stdout"

    - name: Show sanitized G50 #1 provisioning result
      ansible.builtin.debug:
        var: g50_adopt.stdout_lines

    - name: Assert G50 #1 reached the expected managed state
      ansible.builtin.assert:
        that:
          - "'G50_PROVISION_OK' in g50_adopt.stdout"
          - "'ports=21:closed,22:closed,23:closed,80:open,443:closed' in g50_adopt.stdout"
        fail_msg: "G50 #1 did not reach the expected P2-managed state"

    - name: Remove obsolete temporary G50 #1 password staging file
      ansible.builtin.file:
        path: /home/p2runner/.config/p2-home-os/g50-01-temp-password
        state: absent
