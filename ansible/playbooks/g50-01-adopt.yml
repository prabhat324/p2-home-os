---
- name: Adopt primary APC G50 into P2 Home OS
  hosts: core-01
  gather_facts: false
  tasks:
    - name: Confirm primary G50 is reachable before changes
      ansible.builtin.command:
        argv:
          - python3
          - -c
          - >-
            import socket; s=socket.create_connection(('192.168.0.236',80),3); s.close(); print('G50_01_HTTP_REACHABLE')
      changed_when: false

    - name: Probe legacy TLS handshake without credentials
      ansible.builtin.command:
        argv:
          - python3
          - "{{ playbook_dir }}/../../ops/g50_tls_probe.py"
      register: tls_probe
      changed_when: false

    - name: Show sanitized legacy TLS handshake result
      ansible.builtin.debug:
        var: tls_probe.stdout_lines

    - name: Recover legacy management access and normalize G50 #1 without touching outlet power
      ansible.builtin.command:
        argv:
          - python3
          - "{{ playbook_dir }}/../../ops/g50_01_adopt_v6.py"
      register: g50_adopt
      changed_when: "'G50_01_ADOPT_OK' in g50_adopt.stdout"

    - name: Show sanitized G50 #1 adoption result
      ansible.builtin.debug:
        var: g50_adopt.stdout_lines

    - name: Assert G50 #1 reached the expected managed state
      ansible.builtin.assert:
        that:
          - "'G50_01_ADOPT_OK' in g50_adopt.stdout"
          - "'ports=21:closed,22:closed,23:closed,80:open,443:closed' in g50_adopt.stdout"
          - "'temporary_password_file=removed' in g50_adopt.stdout"
        fail_msg: "G50 #1 did not reach the expected P2-managed state"
