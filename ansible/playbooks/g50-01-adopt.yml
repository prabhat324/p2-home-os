---
- name: Adopt primary APC G50 into P2 Home OS
  hosts: core-01
  gather_facts: false
  tasks:
    - name: Confirm primary G50 is reachable before changes
      ansible.builtin.command:
        argv:
          - python3
          - -c
          - >-
            import socket; s=socket.create_connection(('192.168.0.236',80),3); s.close(); print('G50_01_HTTP_REACHABLE')
      changed_when: false

    - name: Probe corrected credential and legacy transports without touching outlet power
      ansible.builtin.command:
        argv:
          - python3
          - "{{ playbook_dir }}/../../ops/g50_01_adopt_v3.py"
      register: g50_adopt
      changed_when: false
      failed_when: g50_adopt.rc not in [0,3]

    - name: Show sanitized G50 #1 probe result
      ansible.builtin.debug:
        var: g50_adopt.stdout_lines

    - name: Assert credential was accepted by either HTTP or FTP path
      ansible.builtin.assert:
        that:
          - "'G50_01_FTP_PROBE_OK' in g50_adopt.stdout or 'G50_01_ADOPT_OK' in g50_adopt.stdout"
        fail_msg: "G50 #1 credential or legacy transport probe did not succeed"
