---
- name: Restore documented persistent LAN address
  hosts: all
  gather_facts: false
  vars:
    desired_ip_map:
      compute-02: 192.168.0.88
      compute-03: 192.168.0.158
      compute-04: 192.168.0.177
  tasks:
    - name: Refuse unsupported host
      ansible.builtin.assert:
        that:
          - inventory_hostname in desired_ip_map
        fail_msg: "network-static-fix is restricted to compute-02, compute-03, and compute-04"

    - name: Install current scoped helper on compute-04
      become: true
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../../scripts/p2ops-network-static"
        dest: /usr/local/sbin/p2ops-network-static
        owner: root
        group: root
        mode: "0755"
      when: inventory_hostname == 'compute-04'

    - name: Install scoped sudo rule on compute-04
      become: true
      ansible.builtin.copy:
        content: |
          # P2 Home OS - narrowly scoped persistent LAN address management.
          p2ops ALL=(root) NOPASSWD: /usr/local/sbin/p2ops-network-static status
          p2ops ALL=(root) NOPASSWD: /usr/local/sbin/p2ops-network-static apply
        dest: /etc/sudoers.d/p2ops-network-static
        owner: root
        group: root
        mode: "0440"
        validate: /usr/sbin/visudo -cf %s
      when: inventory_hostname == 'compute-04'

    - name: Verify scoped helper is installed
      ansible.builtin.command: sudo -n /usr/local/sbin/p2ops-network-static status
      register: network_status
      changed_when: false

    - name: Print pre-change network status
      ansible.builtin.debug:
        var: network_status.stdout_lines

    - name: Apply persistent network address in detached process
      ansible.builtin.shell: >-
        nohup sudo -n /usr/local/sbin/p2ops-network-static apply
        >/tmp/p2-network-static-apply.log 2>&1 </dev/null &
      changed_when: true

    - name: Wait for SSH on documented production address
      ansible.builtin.wait_for:
        host: "{{ desired_ip_map[inventory_hostname] }}"
        port: 22
        state: started
        delay: 4
        timeout: 90
      delegate_to: localhost
      vars:
        ansible_connection: local

    - name: Confirm restored production address
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }} is reachable on {{ desired_ip_map[inventory_hostname] }}:22"
