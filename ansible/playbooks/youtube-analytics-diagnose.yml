---
- name: Audit Project Osho 24h view history
  hosts: compute-01
  gather_facts: false
  tasks:
    - name: Calculate channel and tracked-video history
      ansible.builtin.shell: |
        set -eu
        python3 - <<'PY'
        import sqlite3
        from datetime import datetime, timedelta
        db='/srv/osho/analytics/analytics.sqlite'
        c=sqlite3.connect(db); c.row_factory=sqlite3.Row
        latest=c.execute('select max(collected_at) t from video_history').fetchone()['t']
        print('LATEST='+str(latest))
        if latest:
            lt=datetime.fromisoformat(latest)
            target=lt-timedelta(hours=24)
            raw=[r['collected_at'] for r in c.execute('select distinct collected_at from video_history order by collected_at')]
            times=[datetime.fromisoformat(x) for x in raw]
            base=min(times, key=lambda t: abs((t-target).total_seconds())) if times else None
            latest_rows=c.execute('select video_id,reel_id,title,uploaded_at,public_views from video_history where collected_at=?',(latest,)).fetchall()
            print('LATEST_VIDEO_ROWS='+str(len(latest_rows)))
            print('LATEST_TRACKED_TOTAL='+str(sum(int(r['public_views'] or 0) for r in latest_rows)))
            print('OLDEST_UPLOAD='+str(min((r['uploaded_at'] for r in latest_rows if r['uploaded_at']), default=None)))
            if base:
                base_iso=base.isoformat()
                base_map={r['video_id']:int(r['public_views'] or 0) for r in c.execute('select video_id,public_views from video_history where collected_at=?',(base_iso,))}
                delta=sum(max(0,int(r['public_views'] or 0)-base_map.get(r['video_id'],0)) for r in latest_rows)
                print('BASE='+base_iso)
                print('WINDOW_HOURS='+str(round((lt-base).total_seconds()/3600,2)))
                print('TRACKED_24H_DELTA='+str(delta))
            ch=c.execute('select collected_at,subscriber_count,video_count,public_view_count from channel_history order by collected_at desc limit 1').fetchone()
            if ch:
                print('CHANNEL_VIDEO_COUNT='+str(ch['video_count']))
                print('CHANNEL_PUBLIC_VIEW_COUNT='+str(ch['public_view_count']))
        c.close()
        PY
      args:
        executable: /bin/bash
      register: diag
      changed_when: false
    - name: Show audit
      ansible.builtin.debug:
        msg: "{{ diag.stdout_lines }}"
