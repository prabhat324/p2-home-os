---
- name: Inspect Project Osho analytics 24h view source
  hosts: compute-01
  gather_facts: false
  tasks:
    - name: Inspect reporter and calculate historical view deltas
      ansible.builtin.shell: |
        set -eu
        echo '=== REPORTER SOURCE ==='
        python3 - <<'PY'
        from pathlib import Path
        p=Path('/srv/osho/analytics/dashboard_reporter.py')
        if not p.exists():
            print('MISSING')
        else:
            for n,line in enumerate(p.read_text(errors='replace').splitlines(),1):
                if any(k in line.lower() for k in ('payload','video','channel','sqlite','post','analytics')):
                    if any(s in line.lower() for s in ('token','secret','authorization','credential')):
                        continue
                    print(f'{n}: {line}')
        PY
        echo '=== 24H HISTORY ==='
        python3 - <<'PY'
        import sqlite3, json
        from datetime import datetime, timezone, timedelta
        db='/srv/osho/analytics/analytics.sqlite'
        c=sqlite3.connect(db); c.row_factory=sqlite3.Row
        latest=c.execute('select max(collected_at) t from video_history').fetchone()['t']
        print('LATEST='+str(latest))
        if latest:
            lt=datetime.fromisoformat(latest); target=lt-timedelta(hours=24)
            rows=c.execute('select distinct collected_at from video_history order by collected_at').fetchall()
            times=[datetime.fromisoformat(r['collected_at']) for r in rows]
            base=max((t for t in times if t<=target), default=min(times) if times else None)
            print('TARGET='+target.isoformat())
            print('BASE='+str(base.isoformat() if base else None))
            def total_at(ts):
                if ts is None:return 0
                return c.execute('select coalesce(sum(public_views),0) s from video_history where collected_at=?',(ts.isoformat(),)).fetchone()['s']
            latest_total=total_at(lt); base_total=total_at(base)
            print('LATEST_TRACKED_TOTAL='+str(latest_total))
            print('BASE_TRACKED_TOTAL='+str(base_total))
            print('DELTA='+str(max(0,latest_total-base_total)))
            print('WINDOW_HOURS='+str(round((lt-base).total_seconds()/3600,2) if base else None))
            print('LATEST_VIDEO_ROWS='+str(c.execute('select count(*) n from video_history where collected_at=?',(latest,)).fetchone()['n']))
        c.close()
        PY
      args:
        executable: /bin/bash
      register: diag
      changed_when: false
    - name: Show diagnostic
      ansible.builtin.debug:
        msg: "{{ diag.stdout_lines }}"
