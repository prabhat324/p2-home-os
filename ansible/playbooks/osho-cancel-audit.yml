---
- name: Audit Project Osho services before cancellation
  hosts:
    - compute-01
    - compute-03
  gather_facts: false
  tasks:
    - name: Collect Osho services, processes, containers and active jobs
      ansible.builtin.shell: |
        set -o pipefail
        echo "HOST=$(hostname)"
        echo '=== SUDO ALLOWLIST ==='
        sudo -n -l 2>&1 || true
        echo '=== STORAGE PERMISSIONS ==='
        id || true
        stat -c 'PATH=%n OWNER=%U GROUP=%G MODE=%a' /srv /srv/compose 2>/dev/null || true
        if [[ -w /srv ]]; then echo 'SRV_WRITABLE=yes'; else echo 'SRV_WRITABLE=no'; fi
        if [[ -w /srv/compose ]]; then echo 'SRV_COMPOSE_WRITABLE=yes'; else echo 'SRV_COMPOSE_WRITABLE=no'; fi
        echo '=== ROOTLESS RUNTIME READINESS ==='
        echo "PODMAN=$(command -v podman 2>/dev/null || echo missing)"
        echo "DOCKER=$(command -v docker 2>/dev/null || echo missing)"
        echo "NEWUIDMAP=$(command -v newuidmap 2>/dev/null || echo missing)"
        echo "NEWGIDMAP=$(command -v newgidmap 2>/dev/null || echo missing)"
        grep '^p2ops:' /etc/subuid 2>/dev/null | sed 's/^/SUBUID=/' || echo 'SUBUID=missing'
        grep '^p2ops:' /etc/subgid 2>/dev/null | sed 's/^/SUBGID=/' || echo 'SUBGID=missing'
        systemctl --user is-enabled docker.service 2>/dev/null | sed 's/^/ROOTLESS_DOCKER_ENABLED=/' || true
        systemctl --user is-active docker.service 2>/dev/null | sed 's/^/ROOTLESS_DOCKER_ACTIVE=/' || true
        echo '=== UNIT FILES ==='
        systemctl list-unit-files --no-pager | grep -Ei 'osho|youtube|publish' || true
        echo '=== ACTIVE UNITS ==='
        systemctl list-units --type=service --all --no-pager | grep -Ei 'osho|youtube|publish|ollama' || true
        echo '=== PROCESSES ==='
        ps -eo pid,user,etimes,comm,args | grep -Ei 'osho|hook_ranker|retention_qa|youtube.*upload|publisher' | grep -vE 'grep|ansible' || true
        echo '=== CONTAINERS ==='
        docker ps -a --format '{{ "{{.Names}}" }}|{{ "{{.Status}}" }}|{{ "{{.Image}}" }}' 2>/dev/null | grep -Ei 'osho|ollama' || true
        echo '=== ACTIVE JOB COUNT ==='
        python3 - <<'PY'
        import json,pathlib
        root=pathlib.Path('/srv/osho/work')
        terminal={'complete','completed','failed','cancelled','canceled','published','done','skipped'}
        active=[]
        for p in root.glob('*/job.json') if root.exists() else []:
            try:d=json.loads(p.read_text())
            except Exception:continue
            s=str(d.get('status') or d.get('stage') or '').lower()
            if s and s not in terminal:active.append((p.parent.name,s))
        print('ACTIVE_COUNT='+str(len(active)))
        for x in active[:20]:print('ACTIVE_JOB='+x[0]+'|'+x[1])
        PY
      args:
        executable: /bin/bash
      register: audit
      changed_when: false
      failed_when: false

    - name: Print Osho cancellation audit
      ansible.builtin.debug:
        msg: "{{ audit.stdout_lines }}"
