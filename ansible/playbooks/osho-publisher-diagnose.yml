---
- name: Diagnose Project Osho bounded patch helpers
  hosts: compute-01
  gather_facts: false
  tasks:
    - name: Inspect managed and render patch helpers
      ansible.builtin.shell: |
        set -o pipefail
        for helper in \
          /usr/local/sbin/p2ops-osho-managed-patch \
          /usr/local/sbin/p2ops-osho-render-patch \
          /usr/local/sbin/p2ops-osho-qa-fix \
          /usr/local/sbin/p2ops-osho-dual-gpu-ranker; do
          echo "=== $helper ==="
          ls -l "$helper" 2>&1 || true
          if [ -r "$helper" ]; then
            sed -n '1,420p' "$helper"
          else
            echo 'HELPER_READABLE=no'
          fi
        done
      args:
        executable: /bin/bash
      register: diag
      changed_when: false
      failed_when: false

    - name: Show patch-helper diagnostic
      ansible.builtin.debug:
        msg: "{{ diag.stdout_lines }}"
