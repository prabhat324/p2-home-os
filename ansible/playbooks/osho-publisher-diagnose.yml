---
- name: Find first Project Osho Growth Template V1 video
  hosts: compute-01
  gather_facts: false
  tasks:
    - name: Scan renderer metadata and YouTube receipts
      ansible.builtin.shell: |
        set -o pipefail
        python3 - <<'PY'
        from pathlib import Path
        import json
        from datetime import datetime, timezone

        ROOTS = [Path('/srv/osho'), Path('/srv/compose/osho-worker')]
        TARGET = 'osho-growth-v1'

        def parse_time(v):
            if not v:
                return None
            try:
                d = datetime.fromisoformat(str(v).replace('Z', '+00:00'))
                if d.tzinfo is None:
                    d = d.replace(tzinfo=timezone.utc)
                return d.astimezone(timezone.utc)
            except Exception:
                return None

        def walk(obj, path=''):
            if isinstance(obj, dict):
                for k, v in obj.items():
                    p = f'{path}.{k}' if path else str(k)
                    yield p, v
                    yield from walk(v, p)
            elif isinstance(obj, list):
                for i, v in enumerate(obj):
                    yield from walk(v, f'{path}[{i}]')

        def first(obj, keys):
            if not isinstance(obj, dict):
                return None
            for k in keys:
                if obj.get(k) not in (None, ''):
                    return obj.get(k)
            # nested fallback
            for p, v in walk(obj):
                leaf = p.rsplit('.', 1)[-1]
                if leaf in keys and v not in (None, ''):
                    return v
            return None

        matches = []
        seen = set()
        for root in ROOTS:
            if not root.exists():
                continue
            for p in root.rglob('*.json'):
                sp = str(p)
                if sp in seen:
                    continue
                seen.add(sp)
                try:
                    if p.stat().st_size > 5_000_000:
                        continue
                    text = p.read_text(encoding='utf-8', errors='replace')
                except Exception:
                    continue
                if TARGET not in text:
                    continue
                try:
                    obj = json.loads(text)
                except Exception:
                    continue
                markers = []
                for path, value in walk(obj):
                    if path.rsplit('.',1)[-1] in {'growth_template','production_profile','render_profile'} and str(value) == TARGET:
                        markers.append(path)
                if not markers:
                    continue

                yt = obj.get('youtube') if isinstance(obj, dict) else None
                if not isinstance(yt, dict):
                    yt = {}
                reel = first(obj, {'reel_id','reel','id'})
                source = first(obj, {'source_id','source_number','source'})
                title = first(yt, {'title','youtube_title'}) or first(obj, {'youtube_title','title'})
                vid = first(yt, {'video_id','youtube_video_id','id'}) or first(obj, {'youtube_video_id','video_id'})
                publish = first(yt, {'published_at','uploaded_at','publish_time','published_time'}) or first(obj, {'published_at','uploaded_at','publish_time'})
                rendered = first(obj, {'rendered_at','render_finished_at','completed_at','created_at','timestamp'})
                status = first(obj, {'status','render_status'})
                matches.append({
                    'file': sp,
                    'markers': markers,
                    'reel_id': reel,
                    'source_id': source,
                    'title': title,
                    'video_id': vid,
                    'published_at': publish,
                    'rendered_at': rendered,
                    'status': status,
                    '_sort': parse_time(publish) or parse_time(rendered),
                })

        # Cross-reference durable YouTube receipts for matching reel/source ids.
        receipt_dir = Path('/srv/osho/youtube/receipts')
        receipts = []
        if receipt_dir.is_dir():
            for p in receipt_dir.glob('*.json'):
                try:
                    o = json.loads(p.read_text(encoding='utf-8'))
                    if isinstance(o, dict):
                        receipts.append(o)
                except Exception:
                    pass

        for m in matches:
            for r in receipts:
                rid = first(r, {'reel_id','reel'})
                sid = first(r, {'source_id','source_number','source'})
                if (m['reel_id'] and rid and str(m['reel_id']) == str(rid)) or (m['source_id'] and sid and str(m['source_id']) == str(sid)):
                    m['video_id'] = m['video_id'] or first(r, {'video_id','youtube_video_id','id'})
                    m['title'] = m['title'] or first(r, {'title','youtube_title'})
                    m['published_at'] = m['published_at'] or first(r, {'published_at','uploaded_at','publish_time'})
                    m['_sort'] = parse_time(m['published_at']) or m['_sort']
                    break

        matches.sort(key=lambda m: m['_sort'] or datetime.max.replace(tzinfo=timezone.utc))
        print('GROWTH_V1_COUNT=' + str(len(matches)))
        if matches:
            m = matches[0]
            print('FIRST_GROWTH_V1=' + json.dumps({k:v for k,v in m.items() if k != '_sort'}, ensure_ascii=False, sort_keys=True))
        else:
            print('FIRST_GROWTH_V1=null')
        PY
      args:
        executable: /bin/bash
      register: diag
      changed_when: false
      failed_when: false

    - name: Show Growth Template V1 diagnostic
      ansible.builtin.debug:
        msg: "{{ diag.stdout_lines }}"
