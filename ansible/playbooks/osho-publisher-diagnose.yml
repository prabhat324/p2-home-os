---
- name: Snapshot Project Osho live upload block
  hosts: compute-01
  gather_facts: false
  tasks:
    - name: Read exact app upload block
      ansible.builtin.shell: |
        cd /srv/compose/osho-worker || exit 1
        echo '=== APP IMPORTS ==='
        sed -n '1,90p' app.py
        echo '=== APP UPLOAD BLOCK ==='
        sed -n '1855,1920p' app.py
      args:
        executable: /bin/bash
      register: diag
      changed_when: false

    - name: Show live upload block
      ansible.builtin.debug:
        msg: "{{ diag.stdout_lines }}"
