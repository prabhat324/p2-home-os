---
- name: Inspect Project Osho buffer manager CLI
  hosts: compute-01
  gather_facts: false
  tasks:
    - name: Inspect buffer manager without modifying state
      ansible.builtin.shell: |
        set -o pipefail
        cd /srv/compose/osho-worker || exit 1
        echo "NOW=$(date -Ins)"
        echo '=== BUFFER MANAGER HELP ==='
        python3 buffer_manager.py --help 2>&1 || true
        echo '=== BUFFER MANAGER SOURCE ==='
        sed -n '1,140p;200,380p;430,620p' buffer_manager.py
      args:
        executable: /bin/bash
      register: diag
      changed_when: false
      failed_when: false

    - name: Show buffer manager inspection
      ansible.builtin.debug:
        msg: "{{ diag.stdout_lines }}"
