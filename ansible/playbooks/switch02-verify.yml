---
- name: Verify Juniper switch-02 management plane
  hosts: switch-02
  gather_facts: false
  connection: ansible.netcommon.netconf
  tasks:
    - name: Gather Junos facts
      junipernetworks.junos.junos_facts:
        gather_subset:
          - min

    - name: Confirm Junos hostname
      ansible.builtin.assert:
        that:
          - ansible_net_hostname == 'switch-02'
        fail_msg: "Juniper hostname is {{ ansible_net_hostname | default('unknown') }}, expected switch-02"
        success_msg: "Juniper hostname is switch-02"

    - name: Read committed configuration
      junipernetworks.junos.junos_command:
        commands:
          - show configuration system host-name
          - show configuration system services
          - show configuration system phone-home
          - show configuration chassis
          - show interfaces terse
      register: switch_verify

    - name: Display verification
      ansible.builtin.debug:
        var: switch_verify.stdout_lines
