---
- name: Recover and verify media-01 worker
  hosts: media-01
  gather_facts: false
  tasks:
    - name: Verify corrected worker is deployed
      ansible.builtin.command:
        argv:
          - grep
          - -n
          - Content analyzer failed
          - /home/p2ops/media01/media_worker.py
      register: worker_fix
      changed_when: false

    - name: Prepare writable model cache
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: p2ops
        group: mediaops
        mode: "2775"
      loop:
        - /srv/media-production/cache
        - /srv/media-production/cache/huggingface

    - name: Ask current worker process to exit for systemd restart
      ansible.builtin.command:
        argv:
          - pkill
          - -TERM
          - -f
          - /home/p2ops/media01/media_worker.py --watch
      changed_when: true

    - name: Allow worker to start retry
      ansible.builtin.pause:
        seconds: 20

    - name: Read worker service state
      ansible.builtin.command:
        argv: [systemctl, is-active, media01-worker.service]
      register: service_state
      changed_when: false

    - name: Verify replacement worker process
      ansible.builtin.command:
        argv:
          - pgrep
          - -a
          - -f
          - /home/p2ops/media01/media_worker.py --watch
      register: worker_process
      changed_when: false

    - name: Read demo status
      ansible.builtin.slurp:
        src: /srv/media-production/logs/besquare-demo-01.status.json
      register: demo_status

    - name: Report recovery state
      ansible.builtin.debug:
        msg:
          worker_fix: "{{ worker_fix.stdout }}"
          service: "{{ service_state.stdout }}"
          process: "{{ worker_process.stdout }}"
          job: "{{ demo_status.content | b64decode | from_json }}"
