---
- name: Inventory homelab dashboard and live resources
  hosts: all
  gather_facts: false
  tasks:
    - name: Collect safe dashboard and service inventory
      ansible.builtin.shell: |
        set -u
        echo "HOST=$(hostname)"

        echo 'DASHBOARD_DNS_BEGIN'
        getent hosts dashboard.home.arpa 2>/dev/null || true
        echo 'DASHBOARD_DNS_END'

        echo 'DASHBOARD_HTTP_BEGIN'
        if command -v curl >/dev/null 2>&1; then
          code="$(curl -sS -o /tmp/p2-home-dashboard.$$.html -w '%{http_code}' --max-time 3 http://dashboard.home.arpa/ 2>/dev/null || true)"
          echo "HTTP_CODE=${code:-unavailable}"
          rm -f /tmp/p2-home-dashboard.$$.html
        fi
        echo 'DASHBOARD_HTTP_END'

        echo 'LISTENING_PORTS_BEGIN'
        ss -lnt 2>/dev/null | awk 'NR>1 {addr=$4; sub(/^.*:/,"",addr); if (addr ~ /^[0-9]+$/) print addr}' | sort -n -u | paste -sd, - || true
        echo 'LISTENING_PORTS_END'

        echo 'RUNNING_RELEVANT_SERVICES_BEGIN'
        systemctl list-units --type=service --state=running --no-legend 2>/dev/null \
          | awk '{print $1}' \
          | grep -Ei 'docker|containerd|jellyfin|ollama|immich|home-assistant|homeassistant|tailscale|smb|samba|nfs|caddy|nginx|apache|homepage|homarr|dashy|homer|osho|piper|whisper' \
          | sort -u || true
        echo 'RUNNING_RELEVANT_SERVICES_END'

        echo 'COMPOSE_FILES_BEGIN'
        find /srv/compose /opt /home -maxdepth 5 -type f \( -name 'compose.yml' -o -name 'compose.yaml' -o -name 'docker-compose.yml' -o -name 'docker-compose.yaml' \) 2>/dev/null \
          | sort | head -120 || true
        echo 'COMPOSE_FILES_END'

        homepage='/opt/docker/compose/homepage/config/services.yaml'
        echo 'HOMEPAGE_CONFIG_BEGIN'
        if [ -f "$homepage" ]; then
          stat -c 'CONFIG_OWNER=%U CONFIG_GROUP=%G CONFIG_MODE=%a' "$homepage" 2>/dev/null || true
          [ -w "$homepage" ] && echo 'CONFIG_WRITABLE=yes' || echo 'CONFIG_WRITABLE=no'
          python3 - "$homepage" <<'PY'
        from pathlib import Path
        import re, sys
        p=Path(sys.argv[1])
        secret_key=re.compile(r'(password|passwd|secret|token|api[_-]?key|apikey|authorization|bearer|username|credential)', re.I)
        for raw in p.read_text(errors='replace').splitlines():
            stripped=raw.lstrip()
            key=stripped.split(':',1)[0] if ':' in stripped else ''
            if secret_key.search(key):
                indent=raw[:len(raw)-len(stripped)]
                print(indent + key + ': [REDACTED]')
            else:
                print(raw)
        PY
        else
          echo 'CONFIG_MISSING=yes'
        fi
        echo 'HOMEPAGE_CONFIG_END'

        if [ "$(hostname)" = "media-server" ]; then
          echo 'CADDY_ROUTES_BEGIN'
          for f in /opt/docker/compose/caddy/Caddyfile /opt/docker/compose/caddy/config/Caddyfile; do
            if [ -f "$f" ]; then
              echo "CADDYFILE=$f"
              python3 - "$f" <<'PY'
        from pathlib import Path
        import re, sys
        secret=re.compile(r'(password|secret|token|api[_-]?key|authorization|bearer|basic_auth)', re.I)
        for line in Path(sys.argv[1]).read_text(errors='replace').splitlines():
            if secret.search(line):
                print('[REDACTED SENSITIVE CADDY LINE]')
            else:
                print(line)
        PY
            fi
          done
          echo 'CADDY_ROUTES_END'

          echo 'CORE_COMPOSE_SUMMARY_BEGIN'
          for f in /opt/docker/compose/*/docker-compose.y*ml /opt/docker/compose/*/compose.y*ml; do
            [ -f "$f" ] || continue
            echo "FILE=$f"
            grep -E '^[[:space:]]*(image:|container_name:|-[[:space:]]*"?[0-9]+:[0-9]+|-[[:space:]]*[0-9]+:[0-9]+)' "$f" 2>/dev/null | head -30 || true
          done
          echo 'CORE_COMPOSE_SUMMARY_END'
        fi
      args:
        executable: /bin/bash
      register: inventory
      changed_when: false

    - name: Print safe dashboard inventory
      ansible.builtin.debug:
        msg: "{{ inventory.stdout_lines }}"
