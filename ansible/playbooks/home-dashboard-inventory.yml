---
- name: Inventory homelab dashboard and live resources
  hosts: all
  gather_facts: false
  tasks:
    - name: Collect safe dashboard and service inventory
      ansible.builtin.shell: |
        set -u
        echo "HOST=$(hostname)"

        echo 'LISTENING_PORTS_BEGIN'
        ss -lnt 2>/dev/null | awk 'NR>1 {addr=$4; sub(/^.*:/,"",addr); if (addr ~ /^[0-9]+$/) print addr}' | sort -n -u | paste -sd, - || true
        echo 'LISTENING_PORTS_END'

        echo 'RUNNING_RELEVANT_SERVICES_BEGIN'
        systemctl list-units --type=service --state=running --no-legend 2>/dev/null \
          | awk '{print $1}' \
          | grep -Ei 'docker|containerd|jellyfin|ollama|immich|home-assistant|homeassistant|tailscale|smb|samba|nfs|caddy|nginx|apache|homepage|homarr|dashy|homer|osho|piper|whisper|glances' \
          | sort -u || true
        echo 'RUNNING_RELEVANT_SERVICES_END'

        if [ "$(hostname)" = "compute-03" ]; then
          echo 'MONITORING_PERMISSION_BEGIN'
          if docker ps >/dev/null 2>&1; then echo 'DOCKER_ACCESS=yes'; else echo 'DOCKER_ACCESS=no'; fi
          if sudo -n true >/dev/null 2>&1; then echo 'SUDO_NONINTERACTIVE=yes'; else echo 'SUDO_NONINTERACTIVE=no'; fi
          sudo -n -l 2>&1 | sed -E 's/(password|passwd|secret|token|api[_-]?key)[^ ,:]*/[REDACTED]/Ig' | head -80 || true
          command -v python3 >/dev/null && python3 --version || true
          python3 -m pip --version 2>/dev/null || echo 'PIP=missing'
          python3 -m venv --help >/dev/null 2>&1 && echo 'VENV=yes' || echo 'VENV=no'
          command -v crontab >/dev/null 2>&1 && echo 'CRONTAB=yes' || echo 'CRONTAB=no'
          echo 'MONITORING_PERMISSION_END'
        fi

        echo 'COMPOSE_SUMMARY_BEGIN'
        for f in /srv/compose/*/compose.y*ml /srv/compose/*/docker-compose.y*ml /opt/docker/compose/*/compose.y*ml /opt/docker/compose/*/docker-compose.y*ml; do
          [ -f "$f" ] || continue
          echo "FILE=$f"
          grep -E '^[[:space:]]*(image:|container_name:|-[[:space:]]*"?[0-9]+:[0-9]+|-[[:space:]]*[0-9]+:[0-9]+)' "$f" 2>/dev/null | head -40 || true
        done
        echo 'COMPOSE_SUMMARY_END'

        homepage='/opt/docker/compose/homepage/config/services.yaml'
        echo 'HOMEPAGE_CONFIG_BEGIN'
        if [ -f "$homepage" ]; then
          stat -c 'CONFIG_OWNER=%U CONFIG_GROUP=%G CONFIG_MODE=%a' "$homepage" 2>/dev/null || true
          [ -w "$homepage" ] && echo 'CONFIG_WRITABLE=yes' || echo 'CONFIG_WRITABLE=no'
          python3 - "$homepage" <<'PY'
        from pathlib import Path
        import re, sys
        p=Path(sys.argv[1])
        secret_key=re.compile(r'(password|passwd|secret|token|api[_-]?key|apikey|authorization|bearer|username|credential)', re.I)
        for raw in p.read_text(errors='replace').splitlines():
            stripped=raw.lstrip()
            key=stripped.split(':',1)[0] if ':' in stripped else ''
            if secret_key.search(key):
                indent=raw[:len(raw)-len(stripped)]
                print(indent + key + ': [REDACTED]')
            else:
                print(raw)
        PY
        else
          echo 'CONFIG_MISSING=yes'
        fi
        echo 'HOMEPAGE_CONFIG_END'

        if [ "$(hostname)" = "media-server" ]; then
          echo 'CADDY_ROUTES_BEGIN'
          for f in /opt/docker/compose/caddy/Caddyfile /opt/docker/compose/caddy/config/Caddyfile; do
            if [ -f "$f" ]; then
              echo "CADDYFILE=$f"
              python3 - "$f" <<'PY'
        from pathlib import Path
        import re, sys
        secret=re.compile(r'(password|secret|token|api[_-]?key|authorization|bearer|basic_auth)', re.I)
        for line in Path(sys.argv[1]).read_text(errors='replace').splitlines():
            if secret.search(line):
                print('[REDACTED SENSITIVE CADDY LINE]')
            else:
                print(line)
        PY
            fi
          done
          echo 'CADDY_ROUTES_END'
        fi
      args:
        executable: /bin/bash
      register: inventory
      changed_when: false

    - name: Print safe dashboard inventory
      ansible.builtin.debug:
        msg: "{{ inventory.stdout_lines }}"
