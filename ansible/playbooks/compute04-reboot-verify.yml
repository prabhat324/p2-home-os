---
- name: Reboot and verify compute-04 foundation
  hosts: compute-04
  gather_facts: false
  tasks:
    - name: Reboot compute-04
      become: true
      ansible.builtin.reboot:
        reboot_timeout: 420
        connect_timeout: 10
        post_reboot_delay: 15
        test_command: hostname

    - name: Verify Docker, NVIDIA, FFmpeg, and disks
      ansible.builtin.shell: |
        set -o pipefail
        echo "HOST=$(hostname)"
        echo "UPTIME=$(uptime -p)"
        echo "DOCKER=$(systemctl is-active docker 2>&1)"
        echo "FFMPEG=$(ffmpeg -version 2>/dev/null | head -1)"
        echo '=== NVIDIA ==='
        nvidia-smi --query-gpu=name,driver_version,memory.total,temperature.gpu,power.limit --format=csv,noheader 2>&1 || true
        echo '=== NVIDIA CONTAINER ==='
        sudo -n docker run --rm --gpus all ubuntu nvidia-smi --query-gpu=name,memory.total --format=csv,noheader 2>&1 || true
        echo '=== DISKS ==='
        lsblk -o NAME,SIZE,FSTYPE,LABEL,MOUNTPOINTS,MODEL
      args:
        executable: /bin/bash
      register: verify
      changed_when: false

    - name: Print compute-04 verification
      ansible.builtin.debug:
        msg: "{{ verify.stdout_lines }}"
