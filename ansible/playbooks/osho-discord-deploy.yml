---
- name: Retire legacy Project Osho Discord alerts
  hosts: compute-01
  gather_facts: false
  become: false
  vars:
    notifier_bin: /home/p2ops/.local/bin/osho-discord-notifier.py
    notifier_config: /home/p2ops/.config/osho-discord.env
    notifier_state: /home/p2ops/.local/state
  tasks:
    - name: Stop legacy Project Osho notifier process
      ansible.builtin.shell: |
        set -eu
        pkill -TERM -f '{{ notifier_bin }}' 2>/dev/null || true
        sleep 1
        pgrep -af '{{ notifier_bin }}' >/dev/null 2>&1 && pkill -KILL -f '{{ notifier_bin }}' 2>/dev/null || true
      args:
        executable: /bin/bash
      changed_when: true
      failed_when: false

    - name: Remove Project Osho notifier reboot entry
      ansible.builtin.cron:
        name: Project Osho Discord notifier
        state: absent

    - name: Remove Project Osho Discord webhook configuration
      ansible.builtin.file:
        path: '{{ notifier_config }}'
        state: absent

    - name: Remove stale Project Osho notifier pid file
      ansible.builtin.file:
        path: '{{ notifier_state }}/osho-discord-notifier.pid'
        state: absent

    - name: Verify Project Osho Discord alerts are disabled
      ansible.builtin.shell: |
        set -u
        if pgrep -af '{{ notifier_bin }}' >/dev/null 2>&1; then
          echo 'notifier_process=present'
          exit 1
        else
          echo 'notifier_process=absent'
        fi
        if crontab -l 2>/dev/null | grep -Fq 'Project Osho Discord notifier'; then
          echo 'notifier_cron=present'
          exit 1
        else
          echo 'notifier_cron=absent'
        fi
        if [ -f '{{ notifier_config }}' ]; then
          echo 'notifier_config=present'
          exit 1
        else
          echo 'notifier_config=absent'
        fi
      args:
        executable: /bin/bash
      register: notifier_verify
      changed_when: false

    - name: Show Project Osho Discord alert state
      ansible.builtin.debug:
        msg: '{{ notifier_verify.stdout_lines }}'
