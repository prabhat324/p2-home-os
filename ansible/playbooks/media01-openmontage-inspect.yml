---
- name: Inspect media-01 OpenMontage render inputs
  hosts: media-01
  gather_facts: false
  become: true
  vars:
    source_video: /home/psquare/storage/reolink_drop/BeSquare_DEMO/2025-12-10_EMC_Raven_Master.mp4
    prior_dir: /home/psquare/R/Data/Project_2/openmontage_demo
  tasks:
    - name: Verify source and OpenMontage install
      ansible.builtin.shell: |
        set -euo pipefail
        echo '=== HOST ==='
        hostname
        echo '=== SOURCE ==='
        stat -c '%n | %s bytes | %y | mode=%a owner=%U:%G' '{{ source_video }}'
        ffprobe -v error -show_entries format=duration,size -show_entries stream=index,codec_name,codec_type,width,height,r_frame_rate -of json '{{ source_video }}'
        echo '=== OPENMONTAGE ==='
        git -C /srv/openmontage/repo rev-parse HEAD
        /srv/openmontage/.venv/bin/python -V
        ls -lah /srv/openmontage/repo/tools | sed -n '1,160p'
      args:
        executable: /bin/bash
      register: base
      changed_when: false

    - name: Show prior caption artifacts and renderer
      ansible.builtin.shell: |
        set -euo pipefail
        echo '=== PRIOR TREE ==='
        if [ -d '{{ prior_dir }}' ]; then
          find '{{ prior_dir }}' -maxdepth 2 -type f -printf '%p | %s bytes\n' | sort | sed -n '1,260p'
        else
          echo 'PRIOR_DIR_MISSING'
        fi
        echo '=== RENDER SCRIPT ==='
        if [ -f '{{ prior_dir }}/render_captions.py' ]; then
          sed -n '1,360p' '{{ prior_dir }}/render_captions.py'
        else
          echo 'RENDER_SCRIPT_MISSING'
        fi
        echo '=== CAPTION FILE SAMPLES ==='
        if [ -d '{{ prior_dir }}/captions' ]; then
          for f in '{{ prior_dir }}'/captions/*; do
            [ -f "$f" ] || continue
            echo "--- $f ---"
            sed -n '1,80p' "$f"
          done
        fi
      args:
        executable: /bin/bash
      register: prior
      changed_when: false

    - name: Probe agent CLIs as psquare
      ansible.builtin.shell: |
        set -uo pipefail
        export HOME=/home/psquare
        echo '=== PATH ==='
        echo "$PATH"
        for c in codex claude kimi opencode qwen openmontage; do
          echo "=== $c ==="
          command -v "$c" || true
          "$c" --version 2>&1 | head -20 || true
        done
        echo '=== CODEX EXEC HELP ==='
        codex exec --help 2>&1 | sed -n '1,220p' || true
        echo '=== PROVIDER FLAGS ==='
        for v in OPENAI_API_KEY ANTHROPIC_API_KEY OPENROUTER_API_KEY GEMINI_API_KEY; do
          if [ -n "${!v:-}" ]; then echo "$v=set"; else echo "$v=unset"; fi
        done
      args:
        executable: /bin/bash
      become_user: psquare
      register: agents
      changed_when: false

    - name: Print inspection
      ansible.builtin.debug:
        msg:
          - "{{ base.stdout }}"
          - "{{ prior.stdout }}"
          - "{{ agents.stdout }}"
