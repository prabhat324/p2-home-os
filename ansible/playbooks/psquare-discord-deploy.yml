---
- name: Deploy shared pSquare Discord overseer
  hosts: compute-01
  gather_facts: false
  vars:
    discord_bot_token: "{{ lookup('env', 'DISCORD_BOT_TOKEN') }}"
    discord_channel_id: "{{ lookup('env', 'DISCORD_CHANNEL_ID') }}"
    discord_allowed_user_id: "{{ lookup('env', 'DISCORD_ALLOWED_USER_ID') }}"
    discord_webhook_url: "{{ lookup('env', 'DISCORD_WEBHOOK_URL') }}"
    psquare_bin: /home/p2runner/.local/bin/psquare-discord-bot.py
    psquare_ai_bin: /home/p2runner/.local/bin/psquare_ai.py
    psquare_config: /home/p2runner/.config/psquare-discord.env
    psquare_inventory: /home/p2runner/.config/psquare/hosts.yml
    psquare_state: /home/p2runner/.local/state
  tasks:
    - name: Remove legacy Osho interactive bot reboot job
      ansible.builtin.cron:
        name: Project Osho two-way Discord bot
        user: p2ops
        state: absent

    - name: Stop legacy Osho interactive bot without touching webhook notifier
      ansible.builtin.shell: |
        set -eu
        pidfile=/home/p2ops/.local/state/osho-discord-bot.pid
        if [ -s "$pidfile" ]; then
          pid="$(cat "$pidfile")"
          if kill -0 "$pid" 2>/dev/null; then kill "$pid"; fi
          rm -f "$pidfile"
        fi
        for pid in $(pgrep -f '^python3 /home/p2ops/.local/bin/osho-discord-bot.py$' 2>/dev/null || true); do
          kill "$pid" 2>/dev/null || true
        done
        echo LEGACY_INTERACTIVE_BOT=stopped
        echo OSHO_NOTIFIER_COUNT="$(pgrep -fc '^python3 /home/p2ops/.local/bin/osho-discord-notifier.py$' || true)"
      args:
        executable: /bin/bash
      register: legacy_stop
      changed_when: true

    - name: Use explicitly configured Discord channel when present
      ansible.builtin.set_fact:
        effective_discord_channel_id: "{{ discord_channel_id }}"
      when: discord_channel_id | length > 0
      no_log: true

    - name: Resolve Discord channel from existing webhook when needed
      ansible.builtin.uri:
        url: "{{ discord_webhook_url }}"
        method: GET
        return_content: true
        status_code: 200
      register: discord_webhook_info
      when: discord_channel_id | length == 0
      no_log: true
      delegate_to: core-01

    - name: Use webhook channel ID
      ansible.builtin.set_fact:
        effective_discord_channel_id: "{{ discord_webhook_info.json.channel_id }}"
      when: discord_channel_id | length == 0
      no_log: true

    - name: Validate pSquare Discord credentials
      ansible.builtin.assert:
        that:
          - discord_bot_token | length > 40
          - effective_discord_channel_id is match('^[0-9]{10,25}$')
          - discord_allowed_user_id | length == 0 or discord_allowed_user_id is match('^[0-9]{10,25}$')
        fail_msg: pSquare Discord token/channel configuration is invalid
      no_log: true

    - name: Create pSquare directories on core-01
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: directory
        owner: p2runner
        group: p2runner
        mode: "{{ item.mode }}"
      loop:
        - { path: "/home/p2runner/.local/bin", mode: "0755" }
        - { path: "/home/p2runner/.local/state", mode: "0700" }
        - { path: "/home/p2runner/.local/state/psquare-jobs", mode: "0700" }
        - { path: "/home/p2runner/.config", mode: "0700" }
        - { path: "/home/p2runner/.config/psquare", mode: "0700" }
      delegate_to: core-01

    - name: Install pSquare Discord gateway on core-01
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../../services/psquare-discord/psquare_discord_bot.py"
        dest: "{{ psquare_bin }}"
        owner: p2runner
        group: p2runner
        mode: "0755"
      delegate_to: core-01

    - name: Install pSquare local AI helper on core-01
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../../services/psquare-discord/psquare_ai.py"
        dest: "{{ psquare_ai_bin }}"
        owner: p2runner
        group: p2runner
        mode: "0644"
      delegate_to: core-01

    - name: Install managed inventory snapshot for pSquare
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../inventory/hosts.yml"
        dest: "{{ psquare_inventory }}"
        owner: p2runner
        group: p2runner
        mode: "0600"
      delegate_to: core-01

    - name: Install pSquare Discord credentials
      ansible.builtin.copy:
        content: |
          DISCORD_BOT_TOKEN={{ discord_bot_token }}
          DISCORD_CHANNEL_ID={{ effective_discord_channel_id }}
          DISCORD_ALLOWED_USER_ID={{ discord_allowed_user_id }}
        dest: "{{ psquare_config }}"
        owner: p2runner
        group: p2runner
        mode: "0600"
      no_log: true
      delegate_to: core-01

    - name: Validate pSquare Python and Ansible runtime on core-01
      ansible.builtin.shell: |
        set -eu
        python3 -m py_compile "{{ psquare_bin }}" "{{ psquare_ai_bin }}"
        command -v ansible
        test -r /home/p2runner/.ssh/id_ed25519_p2homeos
        echo RUNTIME_VALID=yes
      args:
        executable: /bin/bash
      register: runtime_check
      changed_when: false
      delegate_to: core-01

    - name: Validate compute-01 local AI and image prerequisites
      ansible.builtin.shell: |
        set -eu
        command -v ffmpeg >/dev/null
        command -v curl >/dev/null
        curl -fsS --max-time 8 http://127.0.0.1:11434/api/tags >/tmp/psquare-ollama-tags.json
        python3 - <<'PY'
        import json
        p='/tmp/psquare-ollama-tags.json'
        d=json.load(open(p))
        names={str(x.get('name') or x.get('model') or '') for x in d.get('models',[])}
        print('TEXT_MODEL=' + ('ready' if 'qwen3:8b' in names else 'missing'))
        print('VISION_MODEL=' + ('ready' if 'qwen3-vl:2b' in names else 'missing'))
        raise SystemExit(0 if 'qwen3:8b' in names else 3)
        PY
      args:
        executable: /bin/bash
      register: psquare_compute01_prereq
      changed_when: false

    - name: Check whether pSquare vision model is installed on compute-01
      ansible.builtin.shell: |
        curl -fsS --max-time 8 http://127.0.0.1:11434/api/tags | python3 -c 'import json,sys; d=json.load(sys.stdin); n={str(x.get("name") or x.get("model") or "") for x in d.get("models",[])}; raise SystemExit(0 if "qwen3-vl:2b" in n else 1)'
      args:
        executable: /bin/bash
      register: psquare_vision_present
      changed_when: false
      failed_when: false

    - name: Pull pSquare vision model on compute-01 when missing
      ansible.builtin.shell: |
        set -eu
        curl -fsS --max-time 1800 http://127.0.0.1:11434/api/pull \
          -H 'Content-Type: application/json' \
          -d '{"model":"qwen3-vl:2b","stream":false}' >/tmp/psquare-vision-pull.json
        python3 - <<'PY'
        import json
        d=json.load(open('/tmp/psquare-vision-pull.json'))
        print('VISION_PULL_STATUS=' + str(d.get('status','unknown')))
        PY
      args:
        executable: /bin/bash
      when: psquare_vision_present.rc != 0
      register: psquare_vision_pull
      changed_when: true

    - name: Verify pSquare compute-01 AI models
      ansible.builtin.shell: |
        set -eu
        curl -fsS --max-time 8 http://127.0.0.1:11434/api/tags | python3 -c 'import json,sys; d=json.load(sys.stdin); n={str(x.get("name") or x.get("model") or "") for x in d.get("models",[])}; print("TEXT_MODEL=" + ("ready" if "qwen3:8b" in n else "missing")); print("VISION_MODEL=" + ("ready" if "qwen3-vl:2b" in n else "missing")); raise SystemExit(0 if {"qwen3:8b","qwen3-vl:2b"} <= n else 2)'
        command -v ffmpeg >/dev/null
        echo IMAGE_EDIT_ENGINE=ready
      args:
        executable: /bin/bash
      register: psquare_ai_verify
      changed_when: false

    - name: Keep pSquare running after core-01 reboot
      ansible.builtin.cron:
        name: pSquare Discord overseer
        special_time: reboot
        user: p2runner
        job: "/usr/bin/nohup {{ psquare_bin }} >> {{ psquare_state }}/psquare-discord.log 2>&1 &"
      delegate_to: core-01

    - name: Restart pSquare overseer on core-01
      ansible.builtin.shell: |
        set -eu
        pidfile="{{ psquare_state }}/psquare-discord.pid"
        if [ -s "$pidfile" ]; then
          oldpid="$(cat "$pidfile")"
          if kill -0 "$oldpid" 2>/dev/null; then
            kill "$oldpid"
            for n in 1 2 3 4 5; do
              kill -0 "$oldpid" 2>/dev/null || break
              sleep 1
            done
          fi
        fi
        for pid in $(pgrep -f '^python3 /home/p2runner/.local/bin/psquare-discord-bot.py$' 2>/dev/null || true); do
          kill "$pid" 2>/dev/null || true
        done
        env -u RUNNER_TRACKING_ID nohup "{{ psquare_bin }}" >> "{{ psquare_state }}/psquare-discord.log" 2>&1 </dev/null &
        newpid=$!
        echo "$newpid" > "$pidfile"
        sleep 5
        kill -0 "$newpid"
        echo PSQUARE_STATUS=running
        echo PSQUARE_PID=$newpid
        echo CONFIG_MODE="$(stat -c %a "{{ psquare_config }}")"
        echo INVENTORY_MODE="$(stat -c %a "{{ psquare_inventory }}")"
        tail -n 12 "{{ psquare_state }}/psquare-discord.log" 2>/dev/null || true
      args:
        executable: /bin/bash
      register: psquare_start
      changed_when: true
      delegate_to: core-01

    - name: Verify pSquare read-only Ansible reachability from core-01
      ansible.builtin.shell: |
        set -o pipefail
        ansible all -i "{{ psquare_inventory }}" -m ping -o 2>&1 | sed -E 's/(SUCCESS|UNREACHABLE|FAILED).*/\1/'
      args:
        executable: /bin/bash
      register: psquare_ping
      changed_when: false
      failed_when: false
      delegate_to: core-01

    - name: Show pSquare deployment status
      ansible.builtin.debug:
        msg:
          - "{{ psquare_start.stdout_lines }}"
          - "COMPUTE01_AI={{ psquare_ai_verify.stdout_lines }}"
          - "MANAGED_NODE_PROBE={{ psquare_ping.stdout_lines }}"
          - "PSQUARE_CAPABILITIES=text_qa,photo_qa,basic_image_edit,network_status"
          - "OSHO_WEBHOOK_NOTIFIER=preserved"
