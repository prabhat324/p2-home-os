---
- name: Install permanent BeSquare V6.1 knowledge-video standard on media-01
  hosts: core-01
  gather_facts: false
  vars:
    compute_host: 192.168.0.31
    media_host: 192.168.0.6
    ssh_key: "{{ lookup('env', 'HOME') }}/.ssh/id_ed25519_p2homeos"
    source_master: /srv/media-production/inbox/wasaga-report-v6.1/output/wasaga-report-2026-V6.1-youtube-master.mp4
    source_support: /srv/media-production/inbox/besquare-v61-benchmark-support.tar.gz
    standard_root: /srv/media-production/standards/besquare-knowledge-v1
    reference_dir: /srv/media-production/standards/besquare-knowledge-v1/reference
    support_dir: /srv/media-production/standards/besquare-knowledge-v1/support
    tools_dir: /srv/media-production/standards/besquare-knowledge-v1/tools
    backup_dir: /srv/media-production/standards/besquare-knowledge-v1/backups/install-{{ lookup('pipe','date +%Y%m%d-%H%M%S') }}
    target_master: /srv/media-production/standards/besquare-knowledge-v1/reference/wasaga-report-2026-V6.1-youtube-master.mp4
    target_support_archive: /srv/media-production/standards/besquare-knowledge-v1/support/benchmark-support.tar.gz
    expected_master_sha256: c7ab41d20af7c760f4e9f13a4b955bb4f78775d202827ca22aea6bbf1366a860
    expected_master_size: 3051279914
    expected_support_sha256: 859163a0ee78a1360ed77845e372a9f84d49981f65ab07da6210cfc87143455f
    expected_support_size: 1390703

  tasks:
    - name: Verify V6.1 benchmark source exists on compute-01
      ansible.builtin.stat:
        path: "{{ source_master }}"
        get_checksum: false
      delegate_to: compute-01
      register: source_master_stat

    - name: Verify support archive source exists on compute-01
      ansible.builtin.stat:
        path: "{{ source_support }}"
        get_checksum: false
      delegate_to: compute-01
      register: source_support_stat

    - name: Assert benchmark source sizes before transfer
      ansible.builtin.assert:
        that:
          - source_master_stat.stat.exists
          - source_master_stat.stat.size == expected_master_size
          - source_support_stat.stat.exists
          - source_support_stat.stat.size == expected_support_size
        fail_msg: V6.1 benchmark source/support package is missing or changed on compute-01

    - name: Create canonical standard directories on media-01
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: p2ops
        group: mediaops
        mode: '0775'
      become: true
      delegate_to: media-01
      loop:
        - "{{ standard_root }}"
        - "{{ reference_dir }}"
        - "{{ support_dir }}"
        - "{{ support_dir }}/raw"
        - "{{ support_dir }}/v61"
        - "{{ support_dir }}/v61/work"
        - "{{ support_dir }}/v61/qc"
        - "{{ support_dir }}/v61/logs"
        - "{{ support_dir }}/v61/motion"
        - "{{ support_dir }}/v6"
        - "{{ support_dir }}/v6/work"
        - "{{ support_dir }}/v6/qc"
        - "{{ tools_dir }}"
        - "{{ backup_dir }}"

    - name: Check whether benchmark master is already present with expected size
      ansible.builtin.stat:
        path: "{{ target_master }}"
        get_checksum: false
      delegate_to: media-01
      register: target_master_stat

    - name: Transfer exact V6.1 master compute-01 to media-01 through core-01
      ansible.builtin.shell: |
        set -euo pipefail
        tmp='{{ target_master }}.partial'
        ssh -i '{{ ssh_key }}' -o BatchMode=yes -o StrictHostKeyChecking=yes p2ops@{{ compute_host }} \
          "cat '{{ source_master }}'" \
          | ssh -i '{{ ssh_key }}' -o BatchMode=yes -o StrictHostKeyChecking=yes p2ops@{{ media_host }} \
          "cat > '$tmp' && mv '$tmp' '{{ target_master }}'"
      args:
        executable: /bin/bash
      when: not target_master_stat.stat.exists or target_master_stat.stat.size != expected_master_size
      changed_when: true

    - name: Check whether support archive is already present with expected size
      ansible.builtin.stat:
        path: "{{ target_support_archive }}"
        get_checksum: false
      delegate_to: media-01
      register: target_support_stat

    - name: Transfer V6/V6.1 support package compute-01 to media-01 through core-01
      ansible.builtin.shell: |
        set -euo pipefail
        tmp='{{ target_support_archive }}.partial'
        ssh -i '{{ ssh_key }}' -o BatchMode=yes -o StrictHostKeyChecking=yes p2ops@{{ compute_host }} \
          "cat '{{ source_support }}'" \
          | ssh -i '{{ ssh_key }}' -o BatchMode=yes -o StrictHostKeyChecking=yes p2ops@{{ media_host }} \
          "cat > '$tmp' && mv '$tmp' '{{ target_support_archive }}'"
      args:
        executable: /bin/bash
      when: not target_support_stat.stat.exists or target_support_stat.stat.size != expected_support_size
      changed_when: true

    - name: Verify transferred benchmark SHA-256 on media-01
      ansible.builtin.command:
        argv: [sha256sum, "{{ target_master }}"]
      delegate_to: media-01
      register: master_sha
      changed_when: false

    - name: Verify transferred support SHA-256 on media-01
      ansible.builtin.command:
        argv: [sha256sum, "{{ target_support_archive }}"]
      delegate_to: media-01
      register: support_sha
      changed_when: false

    - name: Assert transferred checksums match compute-01 benchmark package
      ansible.builtin.assert:
        that:
          - master_sha.stdout.split()[0] == expected_master_sha256
          - support_sha.stdout.split()[0] == expected_support_sha256
        fail_msg: Benchmark checksum verification failed; worker guardrail will not be installed

    - name: Reset raw support extraction directory
      ansible.builtin.file:
        path: "{{ support_dir }}/raw"
        state: absent
      become: true
      delegate_to: media-01

    - name: Recreate raw support extraction directory
      ansible.builtin.file:
        path: "{{ support_dir }}/raw"
        state: directory
        owner: p2ops
        group: mediaops
        mode: '0775'
      become: true
      delegate_to: media-01

    - name: Extract benchmark support package
      ansible.builtin.unarchive:
        src: "{{ target_support_archive }}"
        dest: "{{ support_dir }}/raw"
        remote_src: true
        owner: p2ops
        group: mediaops
      become: true
      delegate_to: media-01

    - name: Arrange V6.1 and V6 support files into canonical folders
      ansible.builtin.shell: |
        set -euo pipefail
        root='{{ support_dir }}'
        raw="$root/raw"
        rm -rf "$root/v61/work" "$root/v61/qc" "$root/v61/logs" "$root/v61/motion" "$root/v6/work" "$root/v6/qc"
        mkdir -p "$root/v61/work" "$root/v61/qc" "$root/v61/logs" "$root/v61/motion" "$root/v6/work" "$root/v6/qc"
        for f in camera-plan-v61.csv camera-v61-eased.cmd captions-v61.srt cut-info.txt filter-v61.txt orchestrate-v61.sh render-v61-final.sh v61-timeline.tsv; do
          test -f "$raw/work/$f" && cp -a "$raw/work/$f" "$root/v61/work/"
        done
        test -d "$raw/logs" && cp -a "$raw/logs/." "$root/v61/logs/"
        test -d "$raw/motion" && cp -a "$raw/motion/." "$root/v61/motion/"
        if test -d "$raw/qc"; then
          find "$raw/qc" -mindepth 1 -maxdepth 1 ! -name 'V6-YOUTUBE-READY-RUBRIC.md' ! -name 'V6_VISUAL_QC_COMPLETE.txt' -exec cp -a {} "$root/v61/qc/" \;
          test -f "$raw/qc/V6-YOUTUBE-READY-RUBRIC.md" && cp -a "$raw/qc/V6-YOUTUBE-READY-RUBRIC.md" "$root/v6/qc/"
          test -f "$raw/qc/V6_VISUAL_QC_COMPLETE.txt" && cp -a "$raw/qc/V6_VISUAL_QC_COMPLETE.txt" "$root/v6/qc/"
        fi
        for f in v6-timeline.tsv camera-plan-v6.csv render-v6-final.sh orchestrate-v6.sh; do
          test -f "$raw/work/$f" && cp -a "$raw/work/$f" "$root/v6/work/"
        done
        chown -R p2ops:mediaops "$root/v61" "$root/v6"
      args:
        executable: /bin/bash
      become: true
      delegate_to: media-01
      changed_when: true

    - name: Install canonical standard JSON
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../files/besquare-knowledge-standard-v1.json"
        dest: "{{ standard_root }}/standard.json"
        owner: p2ops
        group: mediaops
        mode: '0644'
      become: true
      delegate_to: media-01

    - name: Install human-readable editing standard
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../files/BESQUARE_EDITING_STANDARD_V1.md"
        dest: "{{ standard_root }}/BESQUARE_EDITING_STANDARD_V1.md"
        owner: p2ops
        group: mediaops
        mode: '0644'
      become: true
      delegate_to: media-01

    - name: Install V6.1 guardrail into media worker app
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../files/besquare_guardrail.py"
        dest: /home/p2ops/media01/besquare_guardrail.py
        owner: p2ops
        group: mediaops
        mode: '0755'
      become: true
      delegate_to: media-01

    - name: Install worker patch tool in standard tools directory
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../files/install_besquare_standard.py"
        dest: "{{ tools_dir }}/install_besquare_standard.py"
        owner: p2ops
        group: mediaops
        mode: '0755'
      become: true
      delegate_to: media-01

    - name: Install OpenMontage asset-only driver
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../files/media01_openmontage_asset_driver.py"
        dest: /home/p2ops/openmontage-lab/run_asset_request.py
        owner: p2ops
        group: mediaops
        mode: '0755'
      become: true
      delegate_to: media-01

    - name: Create benchmark verification marker after full SHA check
      ansible.builtin.copy:
        dest: "{{ standard_root }}/benchmark-verification.json"
        owner: p2ops
        group: mediaops
        mode: '0644'
        content: |
          {
            "standard_id": "besquare-knowledge-v1",
            "benchmark_sha256": "{{ expected_master_sha256 }}",
            "benchmark_size_bytes": {{ expected_master_size }},
            "support_sha256": "{{ expected_support_sha256 }}",
            "support_size_bytes": {{ expected_support_size }},
            "verified_by": "core-01-ansible",
            "verified_at_epoch": {{ lookup('pipe','date +%s') }}
          }
      become: true
      delegate_to: media-01

    - name: Back up worker and quality profile before policy patch
      ansible.builtin.shell: |
        set -euo pipefail
        cp -a /home/p2ops/media01/media_worker.py '{{ backup_dir }}/media_worker.py'
        cp -a /home/p2ops/media01/quality-profile.json '{{ backup_dir }}/quality-profile.json'
        test -f /home/p2ops/media01/creative_qa.py && cp -a /home/p2ops/media01/creative_qa.py '{{ backup_dir }}/creative_qa.py'
      args:
        executable: /bin/bash
      become: true
      delegate_to: media-01
      changed_when: true

    - name: Apply idempotent V6.1 worker/profile policy patch
      ansible.builtin.command:
        argv: [/usr/bin/python3, "{{ tools_dir }}/install_besquare_standard.py"]
      become: true
      delegate_to: media-01
      register: install_result
      changed_when: true

    - name: Normalize ownership after worker policy patch
      ansible.builtin.file:
        path: "{{ item }}"
        owner: p2ops
        group: mediaops
      become: true
      delegate_to: media-01
      loop:
        - /home/p2ops/media01/media_worker.py
        - /home/p2ops/media01/quality-profile.json
        - /home/p2ops/media01/besquare_guardrail.py
        - /home/p2ops/openmontage-lab/run_asset_request.py

    - name: Create synthetic knowledge-video guardrail smoke inputs
      ansible.builtin.copy:
        dest: "{{ standard_root }}/{{ item.name }}"
        owner: p2ops
        group: mediaops
        mode: '0644'
        content: "{{ item.content }}"
      become: true
      delegate_to: media-01
      loop:
        - name: smoke-manifest.json
          content: |
            {"mode":"explainer","title":"Guardrail smoke test","openmontage":{"mode":"asset_only"}}
        - name: smoke-timeline.json
          content: |
            {"duration_seconds":120,"events":[{"kind":"zoom","start":10,"end":13,"from_scale":1.0,"to_scale":1.06},{"kind":"chart","start":45,"end":55,"title":"Example sourced comparison","source_label":"benchmark smoke test","data":[{"label":"A","value":1},{"label":"B","value":2}]}]}

    - name: Run V6.1 knowledge-video guardrail smoke test
      ansible.builtin.command:
        argv:
          - /usr/bin/python3
          - /home/p2ops/media01/besquare_guardrail.py
          - --manifest
          - "{{ standard_root }}/smoke-manifest.json"
          - --timeline
          - "{{ standard_root }}/smoke-timeline.json"
          - --standard
          - "{{ standard_root }}/standard.json"
          - --verification
          - "{{ standard_root }}/benchmark-verification.json"
          - --report
          - "{{ standard_root }}/smoke-guardrail-report.json"
      become: true
      become_user: p2ops
      delegate_to: media-01
      register: guardrail_smoke
      changed_when: false

    - name: Compile OpenMontage asset-only driver
      ansible.builtin.command:
        argv: [/usr/bin/python3, -m, py_compile, /home/p2ops/openmontage-lab/run_asset_request.py]
      become: true
      become_user: p2ops
      delegate_to: media-01
      changed_when: false

    - name: Restart media worker with permanent V6.1 policy loaded
      ansible.builtin.systemd:
        name: media01-worker.service
        state: restarted
        daemon_reload: false
      become: true
      delegate_to: media-01

    - name: Verify worker is active after guardrail installation
      ansible.builtin.command:
        argv: [systemctl, is-active, media01-worker.service]
      delegate_to: media-01
      register: worker_active
      changed_when: false
      failed_when: worker_active.stdout.strip() != 'active'

    - name: Verify installed standard, benchmark, worker hook, and OpenMontage policy
      ansible.builtin.shell: |
        set -euo pipefail
        test -s '{{ target_master }}'
        test -s '{{ standard_root }}/standard.json'
        test -s '{{ standard_root }}/benchmark-verification.json'
        test -s '{{ standard_root }}/support/v61/work/camera-plan-v61.csv'
        test -s '{{ standard_root }}/support/v61/work/v61-timeline.tsv'
        test -s '{{ standard_root }}/support/v6/qc/V6-YOUTUBE-READY-RUBRIC.md'
        grep -q 'def knowledge_gate' /home/p2ops/media01/media_worker.py
        grep -q "KNOWLEDGE_REVIEW_REQUIRED" /home/p2ops/media01/media_worker.py
        jq -e '.editing_standard.id == "besquare-knowledge-v1"' /home/p2ops/media01/quality-profile.json >/dev/null
        jq -e '.openmontage.production_role == "asset_only" and .openmontage.full_video_editor_allowed == false' /home/p2ops/media01/quality-profile.json >/dev/null
        jq -e '.status == "PASS"' '{{ standard_root }}/smoke-guardrail-report.json' >/dev/null
        echo 'BESQUARE_V61_STANDARD_INSTALLED=1'
        echo 'BENCHMARK={{ target_master }}'
        echo 'BENCHMARK_SHA256={{ expected_master_sha256 }}'
        echo 'OPENMONTAGE_ROLE=asset_only'
        echo 'WORKER_STATE='$(systemctl is-active media01-worker.service)
      args:
        executable: /bin/bash
      delegate_to: media-01
      register: verification
      changed_when: false

    - name: Report completed BeSquare standard installation
      ansible.builtin.debug:
        msg:
          install: "{{ install_result.stdout_lines }}"
          guardrail_smoke: "{{ guardrail_smoke.stdout_lines }}"
          verification: "{{ verification.stdout_lines }}"
