---
- name: Generate the fixed Video2 audio-verified SRT
  hosts: compute-01
  gather_facts: false
  tasks:
    - name: Run root-owned fixed-action transcription helper
      ansible.builtin.command:
        argv:
          - sudo
          - -n
          - /usr/local/sbin/p2ops-transcribe-srt
          - video2-20260903
      register: transcription
      changed_when: true

    - name: Return verified SRT payload
      ansible.builtin.debug:
        msg: "{{ transcription.stdout_lines }}"
