---
- name: Verify dashboard storage proxy
  hosts: compute-02
  gather_facts: false
  tasks:
    - name: Query dashboard version and core-01 filesystem proxy
      ansible.builtin.shell: |
        set -o pipefail
        base='http://127.0.0.1:8787'
        echo '=== HEALTH ==='
        curl -fsS "${base}/health"
        echo
        echo '=== CORE-01 FILESYSTEMS ==='
        curl -fsS "${base}/api/glances/core-01/api/4/fs" | python3 -c '
        import json,sys
        rows=json.load(sys.stdin)
        for x in rows if isinstance(rows,list) else []:
            print("|".join(str(x.get(k,"")) for k in ("mnt_point","device_name","fs_type","size","used","free","percent")))
        '
      args:
        executable: /bin/bash
      register: result
      changed_when: false

    - name: Show storage proxy verification
      ansible.builtin.debug:
        msg: "{{ result.stdout_lines }}"
