---
- name: Diagnose SentinelX installer on compute-03
  hosts: compute-03
  gather_facts: false
  tasks:
    - name: Run SentinelX install diagnostics
      ansible.builtin.shell: |
        set -euo pipefail
        echo "HOST=$(hostname -s)"
        echo "USER=$(id -un)"
        echo "=== CONNECTIVITY ==="
        getent ahosts get.sentinelx.app | head -n 5 || true
        curl -I -L --max-time 15 https://get.sentinelx.app 2>&1 | sed -n '1,20p' || true
        echo "=== DISPATCHER ==="
        tmp=$(mktemp)
        if curl -fsSL --max-time 20 -o "$tmp" https://get.sentinelx.app; then
          echo "DISPATCH_DOWNLOAD=ok"
          echo "DISPATCH_BYTES=$(wc -c < "$tmp")"
          echo "DISPATCH_FIRST_LINE=$(head -n 1 "$tmp")"
          echo "DISPATCH_SYNTAX=$(bash -n "$tmp" >/dev/null 2>&1 && echo ok || echo failed)"
        else
          echo "DISPATCH_DOWNLOAD=failed"
        fi
        rm -f "$tmp"
        echo "=== DIRECT INSTALLER ==="
        tmp=$(mktemp)
        if curl -fsSL --max-time 20 -o "$tmp" https://get.sentinelx.app/install.sh; then
          echo "INSTALL_DOWNLOAD=ok"
          echo "INSTALL_BYTES=$(wc -c < "$tmp")"
          echo "INSTALL_FIRST_LINE=$(head -n 1 "$tmp")"
          echo "INSTALL_SYNTAX=$(bash -n "$tmp" >/dev/null 2>&1 && echo ok || echo failed)"
        else
          echo "INSTALL_DOWNLOAD=failed"
        fi
        rm -f "$tmp"
        echo "=== PYTHON ==="
        python3 --version 2>&1 || true
        python3 -m pip --version 2>&1 || true
        python3 -c 'import venv; print("VENV=ok")' 2>&1 || true
        echo "=== INSTALLED STATE ==="
        if systemctl list-unit-files --no-pager | grep -q '^sentinelx-cloud-core.service'; then
          echo "SERVICE_UNIT=present"
          echo "SERVICE_ACTIVE=$(systemctl is-active sentinelx-cloud-core.service 2>/dev/null || true)"
          echo "SERVICE_ENABLED=$(systemctl is-enabled sentinelx-cloud-core.service 2>/dev/null || true)"
        else
          echo "SERVICE_UNIT=absent"
        fi
        [[ -d /opt/sentinelx-cloud-core ]] && echo "INSTALL_DIR=present" || echo "INSTALL_DIR=absent"
        [[ -f /etc/sentinelx/host_id ]] && echo "HOST_ID_FILE=present" || echo "HOST_ID_FILE=absent"
        [[ -f /etc/sentinelx/identity.json ]] && echo "IDENTITY=present" || echo "IDENTITY=absent"
      args:
        executable: /bin/bash
      register: diag
      changed_when: false

    - name: Show SentinelX diagnostics
      ansible.builtin.debug:
        msg: "{{ diag.stdout_lines }}"
