---
- name: Safely reload Project Osho Growth V1 renderer on compute-01
  hosts: compute-01
  gather_facts: false
  tasks:
    - name: Apply source-controlled Growth patch and reload worker only if idle
      ansible.builtin.command:
        argv:
          - sudo
          - -n
          - /usr/local/sbin/p2ops-osho-render-patch
          - apply-if-idle
      register: apply
      changed_when: true

    - name: Show Growth reload output
      ansible.builtin.debug:
        msg: "{{ apply.stdout_lines }}"

    - name: Verify helper and worker health after reload
      ansible.builtin.shell: |
        set -o pipefail
        sudo -n /usr/local/sbin/p2ops-osho-render-patch status
        echo '=== WORKER HEALTH ==='
        curl -fsS --max-time 5 http://127.0.0.1:8800/health || true
      args:
        executable: /bin/bash
      register: verify
      changed_when: false

    - name: Show verification
      ansible.builtin.debug:
        msg: "{{ verify.stdout_lines }}"
