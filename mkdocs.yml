site_name: P² Home OS
site_description: Home infrastructure, compute, storage, AI and automation operations manual
site_author: Prabhat
site_url: http://docs.home.arpa

docs_dir: docs

theme:
  name: material
  language: en
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.highlight
    - search.suggest
    - content.code.copy

  palette:
    - scheme: slate
      primary: blue grey
      accent: light blue
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

    - scheme: default
      primary: blue grey
      accent: light blue
      toggle:
        icon: material/weather-night
        name: Switch to dark mode

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true

nav:
  - Home: index.md
  - System:
      - Overview: 01-system-overview.md
      - Architecture:
          - Network Topology: 01-architecture/network-topology.md
          - Service Map: 01-architecture/service-map.md
      - Hardware Inventory: 02-hardware-inventory.md
      - Network: 03-network.md
      - Storage: 04-storage.md
  - Nodes:
      - core-01 / media-server: 02-core/core-01.md
      - compute-01: 03-compute/compute-01.md
      - compute-01 As-Built: compute-01-as-built.md
      - compute-02: 03-compute/compute-02.md
      - compute-03: 03-compute/compute-03.md
  - Applications:
      - Services: 05-services.md
      - Smart Home & Voice: 06-smart-home.md
  - Project Osho:
      - Overview: 12-project-osho/index.md
      - Architecture: 12-project-osho/architecture.md
      - Pipeline: 12-project-osho/pipeline.md
      - Services & Paths: 12-project-osho/services-and-paths.md
      - Dashboard: 12-project-osho/dashboard.md
      - YouTube Publishing: 12-project-osho/youtube-publishing.md
      - Operations: 12-project-osho/operations.md
  - Operations:
      - Backup Strategy: 07-backups.md
      - Maintenance: 08-maintenance.md
      - Disaster Recovery: 09-recovery.md
      - Troubleshooting: 10-troubleshooting.md
  - Roadmap: 11-roadmap.md
  - Change Log: changelog.md
