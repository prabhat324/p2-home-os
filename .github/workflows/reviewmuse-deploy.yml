name: ReviewMuse Deploy

on:
  push:
    branches:
      - ops-control
    paths:
      - ops/reviewmuse-request.json

permissions:
  contents: read

concurrency:
  group: reviewmuse-compute04
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'prabhat324/p2-home-os'
    runs-on:
      - self-hosted
      - Linux
      - ARM64
      - core-01
    timeout-minutes: 30

    steps:
      - name: Checkout control code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Verify request-only commit
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff-tree --no-commit-id --name-only -r "${GITHUB_SHA}")"
          if [[ "${changed}" != "ops/reviewmuse-request.json" ]]; then
            echo "Rejected: deploy trigger must modify only ops/reviewmuse-request.json"
            printf 'Changed files:\n%s\n' "${changed}"
            exit 2
          fi

      - name: Deploy ReviewMuse to compute-04
        shell: bash
        run: |
          set -euo pipefail
          cd ansible
          ansible-playbook playbooks/reviewmuse-deploy.yml --limit compute-04
