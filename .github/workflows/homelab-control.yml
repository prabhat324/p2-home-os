name: Homelab Control

on:
  push:
    branches:
      - ops-control
    paths:
      - ops/request.json

permissions:
  contents: read
  statuses: write

concurrency:
  group: homelab-control
  cancel-in-progress: false

jobs:
  execute:
    if: github.repository == 'prabhat324/p2-home-os'
    runs-on:
      - self-hosted
      - Linux
      - ARM64
      - core-01
    timeout-minutes: 10

    steps:
      - name: Checkout control code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Verify request-only commit
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff-tree --no-commit-id --name-only -r "${GITHUB_SHA}")"
          if [[ "${changed}" != "ops/request.json" ]]; then
            echo "Rejected: control commits must modify only ops/request.json"
            printf 'Changed files:\n%s\n' "${changed}"
            exit 2
          fi

      - name: Publish pending control status
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          payload="$(jq -nc \
            --arg state "pending" \
            --arg description "Homelab control request is running" \
            --arg context "p2-home-os/homelab-control" \
            --arg target_url "$target_url" \
            '{state:$state,description:$description,context:$context,target_url:$target_url}')"
          curl -fsS \
            -X POST \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "$payload"

      - name: Execute approved request
        id: execute
        continue-on-error: true
        shell: bash
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
          DISCORD_ALLOWED_USER_ID: ${{ secrets.DISCORD_ALLOWED_USER_ID }}
        run: |
          set -euo pipefail
          operation="$(jq -er '.operation' ops/request.json)"
          if [[ "$operation" == "network-static-fix" ]]; then
            bash ops/run-network-static-fix.sh ops/request.json
          else
            bash ops/run-request.sh ops/request.json
          fi

      - name: Publish control request status
        if: always()
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EXECUTE_OUTCOME: ${{ steps.execute.outcome }}
        run: |
          set -euo pipefail
          if [[ "$EXECUTE_OUTCOME" == "success" ]]; then
            state=success
            description="Homelab control request succeeded"
          else
            state=failure
            description="Homelab control request failed"
          fi
          target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          payload="$(jq -nc \
            --arg state "$state" \
            --arg description "$description" \
            --arg context "p2-home-os/homelab-control" \
            --arg target_url "$target_url" \
            '{state:$state,description:$description,context:$context,target_url:$target_url}')"
          curl -fsS \
            -X POST \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "$payload"

      - name: Fail workflow when request failed
        if: steps.execute.outcome != 'success'
        shell: bash
        run: exit 1
